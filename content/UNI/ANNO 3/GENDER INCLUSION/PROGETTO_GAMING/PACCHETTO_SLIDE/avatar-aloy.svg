<svg width="90" height="90" viewBox="0 0 90 90" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="aloyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#37D6E8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0F2138" stop-opacity="0.9"/>
    </radialGradient>
    <filter id="aloyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#37D6E8" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="45" cy="45" r="41" fill="url(#aloyGlow)" stroke="#37D6E8" stroke-width="2.5" filter="url(#aloyShadow)"/>
  <!-- Holographic Focus Triangle (Aloy / Horizon) -->
  <polygon points="45,30 62,54 28,54" fill="#37D6E8" fill-opacity="0.2" stroke="#37D6E8" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Focus inner core -->
  <polygon points="45,38 54,51 36,51" fill="#37D6E8" fill-opacity="0.5"/>
  <circle cx="45" cy="45" r="2.5" fill="#FFFFFF"/>
  <!-- Tech pulse lines -->
  <line x1="22" y1="45" x2="25" y2="45" stroke="#37D6E8" stroke-width="2" stroke-linecap="round"/>
  <line x1="65" y1="45" x2="68" y2="45" stroke="#37D6E8" stroke-width="2" stroke-linecap="round"/>
  <!-- Aloy Text Badge -->
  <text x="45" y="72" font-family="'Aptos Mono', 'IBM Plex Mono', monospace" font-size="9" font-weight="800" fill="#67E8F9" text-anchor="middle" letter-spacing="1.5">ALOY</text>
</svg>
