<svg width="90" height="90" viewBox="0 0 90 90" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg3Glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5EE6A8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0F2138" stop-opacity="0.9"/>
    </radialGradient>
    <filter id="bg3Shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#5EE6A8" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="45" cy="45" r="41" fill="url(#bg3Glow)" stroke="#5EE6A8" stroke-width="2.5" filter="url(#bg3Shadow)"/>
  <!-- D20 Geometric / Modular Polyhedron (Baldur's Gate 3) -->
  <polygon points="45,28 61,38 61,52 45,62 29,52 29,38" fill="#5EE6A8" fill-opacity="0.15" stroke="#5EE6A8" stroke-width="2" stroke-linejoin="round"/>
  <!-- Inner facets -->
  <polygon points="45,34 56,41 51,55 39,55 34,41" stroke="#5EE6A8" stroke-width="1.5" stroke-linejoin="round" fill="none"/>
  <line x1="45" y1="28" x2="45" y2="34" stroke="#5EE6A8" stroke-width="1.5"/>
  <line x1="61" y1="38" x2="56" y2="41" stroke="#5EE6A8" stroke-width="1.5"/>
  <line x1="61" y1="52" x2="51" y2="55" stroke="#5EE6A8" stroke-width="1.5"/>
  <line x1="45" y1="62" x2="45" y2="55" stroke="#5EE6A8" stroke-width="1.5"/>
  <line x1="29" y1="52" x2="39" y2="55" stroke="#5EE6A8" stroke-width="1.5"/>
  <line x1="29" y1="38" x2="34" y2="41" stroke="#5EE6A8" stroke-width="1.5"/>
  <circle cx="45" cy="46" r="2.5" fill="#FFFFFF"/>
  <!-- BG3 Text Badge -->
  <text x="45" y="72" font-family="'Aptos Mono', 'IBM Plex Mono', monospace" font-size="9" font-weight="800" fill="#6EE7B7" text-anchor="middle" letter-spacing="1.5">BG3</text>
</svg>
