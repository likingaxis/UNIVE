<svg width="90" height="90" viewBox="0 0 90 90" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="laraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0F2138" stop-opacity="0.9"/>
    </radialGradient>
    <filter id="laraShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#A78BFA" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="45" cy="45" r="41" fill="url(#laraGlow)" stroke="#A78BFA" stroke-width="2.5" filter="url(#laraShadow)"/>
  <!-- Lara Croft Icon (Dual Pistols / Holster motif) -->
  <!-- Left pistol -->
  <path d="M33 34 H41 V43 H37 V53 H33 V43 H31 V38 H33 V34 Z" fill="#A78BFA" fill-opacity="0.25" stroke="#A78BFA" stroke-width="2" stroke-linejoin="round"/>
  <!-- Right pistol -->
  <path d="M57 34 H49 V43 H53 V53 H57 V43 H59 V38 H57 V34 Z" fill="#A78BFA" fill-opacity="0.25" stroke="#A78BFA" stroke-width="2" stroke-linejoin="round"/>
  <!-- Target crosshair accent -->
  <circle cx="45" cy="42" r="3" fill="#FFFFFF"/>
  <!-- Lara Text Badge -->
  <text x="45" y="72" font-family="'Aptos Mono', 'IBM Plex Mono', monospace" font-size="9" font-weight="800" fill="#C4B5FD" text-anchor="middle" letter-spacing="1.5">LARA</text>
</svg>
