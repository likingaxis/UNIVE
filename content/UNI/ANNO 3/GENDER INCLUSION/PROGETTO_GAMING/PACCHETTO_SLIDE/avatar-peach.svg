<svg width="90" height="90" viewBox="0 0 90 90" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="peachGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6B6B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0F2138" stop-opacity="0.9"/>
    </radialGradient>
    <filter id="peachShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#FF6B6B" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="45" cy="45" r="41" fill="url(#peachGlow)" stroke="#FF6B6B" stroke-width="2.5" filter="url(#peachShadow)"/>
  <!-- Crown Icon (Peach) -->
  <path d="M26 57 L28 40 L37 49 L45 33 L53 49 L62 40 L64 57 Z" fill="#FF6B6B" fill-opacity="0.2" stroke="#FF6B6B" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Crown Jewels -->
  <circle cx="28" cy="38" r="2.5" fill="#FF8E8E"/>
  <circle cx="45" cy="31" r="3" fill="#FFFFFF"/>
  <circle cx="62" cy="38" r="2.5" fill="#FF8E8E"/>
  <!-- Crown Base Line -->
  <path d="M26 57 H64" stroke="#FF6B6B" stroke-width="3" stroke-linecap="round"/>
  <!-- Peach Text Badge -->
  <text x="45" y="72" font-family="'Aptos Mono', 'IBM Plex Mono', monospace" font-size="9" font-weight="800" fill="#FF8E8E" text-anchor="middle" letter-spacing="1.5">PEACH</text>
</svg>
