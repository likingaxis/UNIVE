topic_id: hardware-vs-software
topic_title: Confronto Hw/Sw e Disponibilità
semantic_units:
- id: guasti_hardware_vs_software
  title: Natura dei Guasti Hardware e Software
  claims:
  - id: cause_guasti_software
    statement: I guasti software sono dovuti alla presenza di difetti nei programmi;
      il software non si consuma.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-01-intro
      page: '24'
  - id: cause_guasti_hardware
    statement: I guasti hardware sono quasi sempre dovuti al consumo o deterioramento
      dei componenti, a componenti che non si comportano come specificato o che si
      rompono.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-01-intro
      page: '24'
  - id: esempi_difetti_hardware
    statement: Esempi di difetti hardware includono l'alterazione di un resistore,
      un condensatore in corto o una porta logica bloccata su 1 o 0.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-01-intro
      page: '25'
  - id: latenza_difetti_software
    statement: I difetti software sono latenti, causando continui guasti del sistema
      a meno che non si effettuino correzioni.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-01-intro
      page: '26'
  - id: inapplicabilita_metriche_hw_a_sw
    statement: A causa della differenza negli effetti dei difetti, le metriche usate
      per l'affidabilità hardware non sono estensibili al software.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-01-intro
      page: '27'
- id: riparazione_e_affidabilita
  title: Riparazione e Obiettivi di Affidabilità
  claims:
  - id: metodo_riparazione_hw
    statement: Per riparare un difetto hardware, si sostituisce il componente difettoso.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-01-intro
      page: '25'
  - id: effetti_riparazione_hw
    statement: Dopo la riparazione dell'hardware, la sua affidabilità torna ai livelli
      originali.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-01-intro
      page: '28'
  - id: effetti_riparazione_sw
    statement: Dopo la riparazione del software, la sua affidabilità può aumentare
      o diminuire.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-01-intro
      page: '28'
  - id: obiettivo_affidabilita_hw
    statement: L'obiettivo dell'affidabilità hardware è la stabilità, ovvero mantenere
      costante la frequenza di guasto.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-01-intro
      page: '29'
  - id: obiettivo_affidabilita_sw
    statement: L'obiettivo dell'affidabilità software è la crescita di affidabilità,
      ovvero far decrescere la frequenza di guasto.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-01-intro
      page: '29'
  - id: andamento_frequenza_guasto_hw
    statement: La frequenza di guasto hardware nel tempo è influenzata prima dall'eliminazione
      dei componenti difettosi (mortalità infantile) e poi dall'usura.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-01-intro
      page: '30'
  - id: andamento_frequenza_guasto_sw
    statement: La frequenza di guasto software è influenzata prima dall'eliminazione
      dei difetti e successivamente dall'invecchiamento dovuto alla manutenzione.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-01-intro
      page: '31'
- id: disponibilita_software
  title: Disponibilità del Software (Availability)
  claims:
  - id: definizione_disponibilita
    statement: La disponibilità del software è la percentuale del tempo in cui il
      software è risultato usabile nel corso della sua vita.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-01-intro
      page: '32'
  - id: fattori_disponibilita
    statement: La disponibilità dipende dal numero di guasti che si verificano e dal
      tempo necessario per ripararli.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-01-intro
      page: '32'
  - id: importanza_affidabilita_disponibilita
    statement: L'affidabilità e la disponibilità del software sono cruciali per sistemi
      dove la caduta del servizio causa perdite economiche, sociali e rischi di sicurezza.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-01-intro
      page: '33'
- id: ingegneria_del_software
  title: 'Ingegneria del Software: Fasi, Definizione e Scopi'
  claims:
  - id: fasi_produzione_sw
    statement: La produzione del software è passata attraverso la fase di abilità
      individuale, la fase artigianale e la fase industriale.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-01-intro
      page: '34'
  - id: origine_termine_ingegneria_sw
    statement: Il termine 'ingegneria del software' è stato coniato nel 1968 alla
      conferenza NATO di Garmisch.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-01-intro
      page: '35'
  - id: definizione_ieee_ingegneria_sw
    statement: Lo standard IEEE Std. 610.12 (1990) definisce l'ingegneria del software
      come l'applicazione di un approccio sistematico, disciplinato e misurabile allo
      sviluppo, esercizio e manutenzione del software.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-01-intro
      page: '35'
  - id: componenti_configurazione_sw
    statement: Il software è una configurazione di programmi, documenti e dati multimediali.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-01-intro
      page: '36'
  - id: caratteristiche_sw
    statement: Il software va ingegnerizzato, non si consuma, è complesso, invisibile,
      si conforma e si cambia.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-01-intro
      page: '36'
  - id: scopo_metodi_ingegneria_sw
    statement: I metodi e le tecniche di ingegneria del software servono ad assicurare
      qualità, controllare il budget, gestire sistemi legacy, evitare ritardi e applicare
      nuove tecnologie.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-01-intro
      page: '37'
- id: miti_software
  title: Miti da Sfatare del Software
  claims:
  - id: miti_elenco
    statement: I miti del software includono credere che aumentare i programmatori
      risolva i ritardi, che descrizioni generiche bastino, che il lavoro finisca
      col deploy, che la qualità si valuti solo alla fine, e che l'ingegneria del
      software sia costosa e rallenti la produzione.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-01-intro
      page: '38'
conflicts: []
ambiguities: []
