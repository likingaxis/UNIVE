topic_id: iterative-process-models
topic_title: Sviluppo Iterativo e Modello a Spirale
semantic_units:
- id: process-iteration
  title: Process Iteration
  claims:
  - id: iteration-rationale
    statement: Requirements always evolve in the course of a large project, so process
      iteration where earlier stages are reworked is always part of the process.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '21'
  - id: iteration-application
    statement: Iteration can be applied to any of the generic process models.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '21'
  - id: iteration-approaches
    statement: Two related approaches to iteration are incremental development and
      spiral development.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '21'
- id: incremental-development
  title: Modello Incrementale
  claims:
  - id: incremental-definition
    statement: The product is developed and delivered in successive increments (builds)
      after establishing an overall architecture.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '22'
    - source_id: slides-02-process-1
      page: '23'
  - id: incremental-user-feedback
    statement: Users may experiment with delivered increments (acting as prototypes)
      while the rest of the product is still being developed.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '22'
    - source_id: slides-02-process-1
      page: '24'
  - id: incremental-advantages
    statement: Combines prototyping advantages with a more manageable process and
      better structure.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '22'
  - id: incremental-effectiveness
    statement: Effective when the client wants to continuously verify progress and
      when requirements are subject to modification.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '24'
  - id: incremental-versions
    statement: 'Can be realized in two alternative versions: with an overall architecture,
      or without an overall architecture (which is more risky).'
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '24'
- id: incremental-vs-waterfall
  title: 'Confronto: Modello Incrementale vs Cascata'
  claims:
  - id: feedback-comparison
    statement: In the waterfall model, client feedback occurs only after development
      is finished; in the incremental model, client feedback is continuous during
      development.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '28'
  - id: phases-comparison
    statement: In the waterfall model, phases are strictly sequential; in the incremental
      model, phases can be conducted in parallel.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '28'
  - id: design-coding-comparison
    statement: In the waterfall model, detailed design and coding cover the entire
      product; in the incremental model, they are performed on single builds.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '28'
  - id: team-comparison
    statement: In the waterfall model, the development team is large; in the incremental
      model, there are multiple small-sized development teams.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '28'
  - id: requirements-comparison
    statement: In the waterfall model, requirements are frozen after the specification
      phase; in the incremental model, requirements are divided into priority classes
      and easily modifiable.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '28'
- id: spiral-model
  title: Modello a Spirale
  claims:
  - id: spiral-versions
    statement: The spiral model exists in a simplified (linear) version and a full-spiral
      version (Boehm, 1988).
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '30'
    - source_id: slides-02-process-1
      page: '32'
  visual_asset_refs:
  - asset_id: f307d147-5855-4b30-b431-7da602a6cf5b
    source_id: slides-02-process-1
    page: '29'
    obsidian_path: assets/d234c4c9_p29_i0.png
- id: risk-management
  title: Risk Management
  claims:
  - id: risk-management-def
    statement: Risk management is concerned with identifying risks and drawing up
      plans to minimize their effect on a project.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '33'
  - id: risk-def
    statement: A risk is a probability that some adverse circumstance will occur.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '33'
  - id: risk-categories
    statement: Risks are categorized into project risks (affecting schedule or resources),
      product risks (affecting quality or performance), and business risks (affecting
      the organization).
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '33'
  - id: risk-types
    statement: Risk types include technology, people, organizational, tools, requirements,
      and estimation risks.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '37'
  - id: risk-management-process
    statement: The risk management process consists of risk identification, risk analysis,
      risk planning, and risk monitoring.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '35'
  - id: risk-analysis
    statement: Risk analysis assesses the probability (from very low to very high)
      and seriousness (catastrophic, serious, tolerable, insignificant) of each risk.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '39'
  - id: risk-planning
    statement: Risk planning involves developing avoidance strategies, minimization
      strategies, and contingency plans for each risk.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '42'
  - id: risk-monitoring
    statement: Risk monitoring regularly assesses whether identified risks are becoming
      more or less probable and whether their effects have changed.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '44'
- id: other-models
  title: Altri Modelli
  claims:
  - id: concurrent-engineering
    statement: The simultaneous (or concurrent) engineering model aims to reduce development
      time and cost through a systematic approach to integrated and concurrent design
      of the software product and its process, where phases coexist instead of being
      executed in sequence.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '47'
  - id: formal-methods
    statement: The formal methods model involves activities leading to formal mathematical
      specification of software to eliminate ambiguity and facilitate program verification,
      as seen in Cleanroom Software Engineering (1987).
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '47'
