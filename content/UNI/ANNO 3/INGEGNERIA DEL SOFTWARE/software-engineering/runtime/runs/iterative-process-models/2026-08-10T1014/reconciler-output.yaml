topic_id: iterative-process-models
topic_title: Sviluppo Iterativo e Modello a Spirale
semantic_units:
- id: process-iteration
  title: Process Iteration
  claims:
  - id: iteration-rationale
    statement: Requirements always evolve in large projects, requiring earlier stages
      to be reworked through process iteration.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '21'
  - id: iteration-applicability
    statement: Iteration can be applied to any generic process model.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '21'
  - id: iteration-approaches
    statement: Two related approaches to process iteration are incremental development
      and spiral development.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '21'
  visual_asset_refs:
