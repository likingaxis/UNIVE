- id: risk-analysis
  title: Risk Analysis
  claims:
  - id: risk-probability
    statement: Risk probability is assessed as very low (<10%), low (10-25%), moderate
      (25-50%), high (50-75%), or very high (>75%).
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '39'
  - id: risk-effects
    statement: Risk effects can be catastrophic, serious, tolerable, or insignificant.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '39'
  - id: risk-ranking
    statement: Top-ten risks are identified by considering all catastrophic risks
      and serious risks with more than moderate probability, and then ranked.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '41'
  relationships:
