- id: incremental-development
  title: Incremental Development Model
  claims:
  - id: incremental-delivery
    statement: The product is developed and delivered in successive increments or
      builds.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '22'
  - id: incremental-prototyping
    statement: Users can experiment with delivered increments acting as prototypes
      while others are developed.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '22'
  - id: incremental-benefits
    statement: It combines the advantages of rapid prototyping with a more manageable
      process and better structure.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '22'
  - id: incremental-effectiveness
    statement: It is effective when the customer wants continuous progress verification
      and when requirements change frequently.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '24'
  - id: incremental-versions
    statement: 'It can be realized in two alternative versions: with overall architecture,
      or without overall architecture, which is more risky.'
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '24'
