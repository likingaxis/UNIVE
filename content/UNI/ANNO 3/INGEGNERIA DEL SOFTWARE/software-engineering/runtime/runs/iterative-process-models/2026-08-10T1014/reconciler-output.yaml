- id: incremental-vs-waterfall
  title: Incremental vs Waterfall Model
  claims:
  - id: feedback-comparison
    statement: Waterfall provides feedback only after development ends, while Incremental
      involves continuous customer feedback.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '28'
  - id: phase-execution
    statement: Waterfall phases are strictly sequential, while Incremental allows
      parallel phases.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '28'
  - id: design-coding-scope
    statement: Waterfall entails detailed design and coding for the whole product;
      Incremental does it per single build.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '28'
  - id: team-size
    statement: Waterfall typically uses a large development team; Incremental uses
      multiple small teams.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '28'
  - id: requirements-management
    statement: Waterfall freezes requirements after specification; Incremental prioritizes
      them and modifies them easily.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '28'
