- id: risk-management
  title: Risk Management
  claims:
  - id: risk-definition
    statement: A risk is a probability that some adverse circumstance will occur.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '33'
  - id: risk-management-purpose
    statement: Risk management identifies risks and creates plans to minimize their
      effect on a project.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '33'
  - id: risk-categories
    statement: Risks are categorized into project risks (affecting schedule/resources),
      product risks (affecting quality/performance), and business risks (affecting
      the organisation).
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '33'
  - id: risk-management-process
    statement: 'The process involves four steps: Risk identification, Risk analysis,
      Risk planning, and Risk monitoring.'
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '35'
