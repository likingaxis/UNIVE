- id: risk-planning
  title: Risk Planning
  claims:
  - id: planning-strategies
    statement: 'Risk planning involves developing strategies to manage risk: avoidance
      (reduce probability), minimisation (reduce impact), and contingency plans (deal
      with the risk if it arises).'
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '42'
