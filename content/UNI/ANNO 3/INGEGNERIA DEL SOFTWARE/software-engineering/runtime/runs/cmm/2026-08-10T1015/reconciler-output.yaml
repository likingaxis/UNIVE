topic_id: cmm
topic_title: Capability Maturity Model (CMM)
semantic_units:
- id: cmm_definition
  title: Definition and Structure of CMM
  claims:
  - id: cmm_origin
    statement: The SEI (Software Engineering Institute) introduced a model starting
      in 1993 to determine the maturity level of an organization's software process.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      page: '12'
  - id: cmm_purpose
    statement: The maturity level is a measure of the global effectiveness of the
      application of software engineering techniques.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      page: '12'
  - id: cmm_evaluation_method
    statement: The model is based on a questionnaire and a five-level evaluation scheme.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      page: '12'
  - id: cmm_cumulative_levels
    statement: Each level includes all the characteristics defined for the previous
      level.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      page: '12'
  relationships: []
