- id: cmm_kpas
  title: Key Process Areas (KPAs)
  claims:
  - id: kpa_definition
    statement: The CMM associates to each maturity level certain KPAs (out of 18 defined)
      that describe the functions that must be present to guarantee belonging to a
      certain level.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      page: '14'
  - id: kpa_structure
    statement: Each KPA is described with respect to goals, commitments and responsibilities
      to assume, capabilities and resources needed, activities to implement, methods
      for monitoring implementation, and methods for verifying implementation.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      page: '14'
  - id: kpa_level_2
    statement: KPAs for Level 2 include Requirements management, Software project
      planning, Software project tracking & oversight, Software subcontract management,
      Software quality assurance, and Software configuration management.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      page: '15'
  - id: kpa_level_3
    statement: KPAs for Level 3 include Organization process focus, Organization process
      definition, Training program, Integrated software management, Software product
      engineering, Intergroup coordination, and Peer reviews.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      page: '15'
  - id: kpa_level_4
    statement: KPAs for Level 4 include Quantitative process management and Software
      quality management.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      page: '15'
  - id: kpa_level_5
    statement: KPAs for Level 5 include Defect prevention, Technology change management,
      and Process change management.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      page: '15'
  relationships:
  - type: part_of
    target_semantic_unit: cmm_levels
    description: KPAs are the requirements that define achievement of each CMM level
    provenance:
