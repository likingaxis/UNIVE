- id: cmm_statistics
  title: CMM Adoption Statistics
  claims:
  - id: stats_feb_2000
    statement: As of February 2000, 71 organizations in the USA (44 at Level 4, 27
      at Level 5) and 25 organizations outside the USA (1 Level 4 in Australia, 14
      Level 4 in India, 10 Level 5 in India) were at high maturity levels.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      page: '16'
  - id: stats_june_2015
    statement: Trends and number of appraisals by country were updated as of June
      2015.
