- id: cmm_levels
  title: The 5 Levels of CMM
  claims:
  - id: cmm_level_1
    statement: Level 1 (Initial) is characterized by an ad hoc process where success
      depends on heroes.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      page: '13'
    - source_id: slides-02-process-2
      page: '15'
  - id: cmm_level_2
    statement: Level 2 (Repeatable) provides basic project management. The result
      is management oversight and tracking of the project, with stable planning and
      product baselines.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      page: '13'
    - source_id: slides-02-process-2
      page: '15'
  - id: cmm_level_3
    statement: Level 3 (Defined) involves process definition. The result is a software
      process defined and institutionalized to provide product quality control.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      page: '13'
    - source_id: slides-02-process-2
      page: '15'
  - id: cmm_level_4
    statement: Level 4 (Managed) focuses on process measurement. The result is product
      quality planning and tracking of the measured software process.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      page: '13'
    - source_id: slides-02-process-2
      page: '15'
  - id: cmm_level_5
    statement: Level 5 (Optimizing) targets process control and improvement. The result
      is continuous process capability improvement.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      page: '13'
    - source_id: slides-02-process-2
      page: '15'
  relationships:
  - type: refines
    target_semantic_unit: cmm_definition
    description: Details the five maturity levels introduced in the CMM definition
