topic_id: classic-process-models
topic_title: Modelli Sequenziali (Waterfall, Prototyping)
semantic_units:
- id: processo-software-definizione
  title: Il Processo Software
  claims:
  - id: ps-def-1
    statement: Il processo software è una serie di attività necessarie alla realizzazione
      del prodotto software nei tempi, con i costi e con le desiderate caratteristiche
      di qualità.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '0'
  - id: ps-contesto-1
    statement: Nel contesto del processo software si applicano metodi, tecniche e
      strumenti, si creano prodotti (intermedi e finali), si stabilisce il controllo
      gestionale del progetto, si garantisce la qualità e si governano le modifiche.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '0'
  visual_asset_refs:
  - asset_id: a8a67443-1225-4b3a-9a52-31f5b76faace
    source_id: slides-02-process-1
    page: '0'
