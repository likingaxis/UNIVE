- id: visual-programming
  title: Visual Programming
  claims:
  - id: vp-def
    statement: Linguaggi di scripting come Visual Basic supportano la programmazione
      visuale, dove il prototipo è sviluppato creando l'interfaccia utente da componenti
      standard associati tra loro da una grande libreria.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '18'
  - id: vp-problemi
    statement: I problemi dello sviluppo visuale includono la difficoltà di coordinare
      lo sviluppo in team, l'assenza di un'architettura software esplicita e le complesse
      dipendenze tra parti del programma che causano problemi di manutenibilità.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '20'
