- id: software-prototyping
  title: Software Prototyping
  claims:
  - id: sp-def
    statement: Il software prototyping è lo sviluppo rapido del software per elicitare
      o validare i requisiti.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '9'
  - id: sp-uso
    statement: L'uso principale dei prototipi di sistema è aiutare clienti e sviluppatori
      a comprendere i requisiti del software, supportando sia l'elicitazione (sperimentando
      come il sistema supporta il lavoro) che la validazione (rivelando errori ed
      omissioni).
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '10'
  - id: sp-rischio
    statement: Il prototyping è un'attività di riduzione del rischio (riduce i rischi
      legati ai requisiti).
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '10'
  - id: sp-benefici
    statement: 'I benefici del prototyping includono: esposizione di incomprensioni,
      identificazione di servizi mancanti o confusi, disponibilità precoce di un sistema
      funzionante, base per derivare specifiche e supporto all''addestramento utenti
      e testing prodotto.'
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '11'
  - id: sp-rapidita
    statement: Lo sviluppo rapido dei prototipi è essenziale e può richiedere l'esclusione
      di funzionalità o l'allentamento di vincoli non funzionali.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '17'
