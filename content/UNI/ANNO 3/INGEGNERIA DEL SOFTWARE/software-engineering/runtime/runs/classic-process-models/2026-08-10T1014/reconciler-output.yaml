    source_id: slides-02-process-1
    page: '0'
- id: fasi-del-processo
  title: Fasi del Processo
  claims:
  - id: fp-ciclo-vita
    statement: 'Il processo software segue un ciclo di vita articolato in 3 stadi:
      sviluppo, manutenzione, dismissione.'
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '1'
  - id: fp-definizione
    statement: Lo stadio di sviluppo comprende fasi di definizione, che si occupano
      di 'cosa' il software deve fornire (definizione dei requisiti, specifiche).
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '1'
  - id: fp-produzione
    statement: Lo stadio di sviluppo comprende fasi di produzione, che definiscono
      'come' realizzare quanto ottenuto dalle fasi di definizione (progettazione,
      codifica, integrazione, rilascio).
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '1'
  - id: fp-manutenzione
    statement: Lo stadio di manutenzione supporta il software realizzato e prevede
      fasi di definizione e/o produzione al suo interno.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '1'
  - id: fp-testing
    statement: Durante ogni fase si effettua il testing dei prodotti, mediante tecniche
      di verifica e validazione (V&V) sui prodotti intermedi e finali.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '1'
  visual_asset_refs:
  - asset_id: 40f730dc-d4df-4aa9-90c7-9f2f327b5305
    source_id: slides-02-process-1
    page: '1'
    obsidian_path: assets/d234c4c9_p1_i0.png
  - asset_id: edda521b-c9af-43f5-8d36-5a0ffa3a043a
    source_id: slides-02-process-1
    page: '1'
- id: tipi-di-manutenzione
  title: Tipi di Manutenzione
  claims:
  - id: tm-correttiva
    statement: La manutenzione correttiva elimina i difetti (fault) che producono
      guasti (failure) del software.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '2'
  - id: tm-adattativa
    statement: La manutenzione adattativa adatta il software ai cambiamenti dell'ambiente
      operativo per cui è stato sviluppato.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '2'
  - id: tm-perfettiva
    statement: La manutenzione perfettiva estende il software per accomodare funzionalità
      aggiuntive.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '2'
  - id: tm-preventiva
    statement: La manutenzione preventiva (o software reengineering) consiste nell'effettuare
      modifiche che rendano più semplici le correzioni, gli adattamenti e le migliorie.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '2'
  visual_asset_refs:
  - asset_id: ee24eb37-f97c-4933-8cda-8c8a09dc5af8
    source_id: slides-02-process-1
    page: '2'
    obsidian_path: assets/d234c4c9_p2_i0.png
  - asset_id: e9dac647-efba-4a3c-a9c7-1a6aa736ea67
    source_id: slides-02-process-1
    page: '2'
- id: ciclo-di-vita
  title: Definizione di Ciclo di Vita
  claims:
  - id: cv-def
    statement: Secondo IEEE Std 610-12, il ciclo di vita è l'intervallo di tempo tra
      la nascita dell'esigenza di costruire un software e la sua dismissione.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '3'
  - id: cv-fasi
    statement: Include definizione dei requisiti, specifica, pianificazione, progetto
      preliminare e dettagliato, codifica, integrazione, testing, uso, manutenzione
      e dismissione, che possono sovrapporsi o essere iterative.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '3'
  visual_asset_refs:
  - asset_id: 771dc522-afca-4bd2-8096-f5983e885a7f
    source_id: slides-02-process-1
    page: '3'
    obsidian_path: assets/d234c4c9_p3_i0.png
  - asset_id: 9abdc679-9362-44e5-aa1e-5f0ceb2504c9
    source_id: slides-02-process-1
    page: '3'
- id: modelli-ciclo-di-vita
  title: Modelli di Ciclo di Vita
  claims:
  - id: mdcv-def
    statement: Il modello del ciclo di vita specifica le fasi e il loro ordine di
      esecuzione, dalla definizione dei requisiti alla dismissione.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '4'
  - id: mdcv-scelta
    statement: La scelta del modello dipende dalla natura dell'applicazione, maturità
      dell'organizzazione, metodi/tecnologie usate e vincoli del cliente.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '4'
  - id: mdcv-build-and-fix
    statement: L'assenza di un modello corrisponde allo sviluppo 'build & fix' (o
      'fix-it-later'), in cui il software è sviluppato e rilavorato fino a soddisfare
      il cliente.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '4'
