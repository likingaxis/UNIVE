- id: throw-away-prototyping
  title: Throw-away Prototyping
  claims:
  - id: tap-def
    statement: Un throw-away prototype è un prototipo prodotto per aiutare a scoprire
      problemi nei requisiti e poi scartato. Il prodotto finale è poi sviluppato usando
      un altro processo.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '14'
  - id: tap-prodotto-finale
    statement: Il throw-away prototype non deve essere considerato un prodotto finale,
      poiché alcune caratteristiche possono mancare, non c'è specifica per manutenzione
      a lungo termine ed è strutturato male.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '14'
  - id: tap-delivery
    statement: La consegna di un throw-away prototype come prodotto finale non è raccomandata
      perché potrebbe essere impossibile adattarlo ai requisiti non funzionali, è
      non documentato, la struttura è degradata dai cambiamenti e gli standard di
      qualità normali non sono stati applicati.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '16'
