- id: prototypes-as-specifications
  title: Prototypes as Specifications
  claims:
  - id: pas-limiti
    statement: Alcune parti dei requisiti (es. funzioni safety-critical) possono essere
      impossibili da prototipare e quindi non appaiono nelle specifiche derivate dal
      prototipo.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '13'
  - id: pas-legale
    statement: Un'implementazione (prototipo) non ha valore legale come contratto.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '13'
  - id: pas-non-funzionali
    statement: I requisiti non funzionali non possono essere testati adeguatamente
      in un prototipo software.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-1
      page: '13'
  visual_asset_refs:
