- id: user-stories
  title: User Stories
  claims:
  - id: user-stories-usage
    statement: User stories are a common agile development practice often used with
      Scrum, though not defined in the Scrum Guide.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      page: '11'
  - id: user-stories-format
    statement: A user story is a short format (typically one sentence) for describing
      user requirements from the user's point of view.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      page: '11'
  - id: user-stories-template
    statement: 'User stories use a common template: ''As a <role>, I want <goal> so
      that <benefit>''.'
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      page: '11'
  - id: user-stories-epics
    statement: Large user stories that are later broken down into smaller ones are
      called epics.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      page: '11'
  relationships:
  - type: associated_with
    target_semantic_unit: scrum
    description: User stories are often combined with Scrum, though not officially
      part of the Scrum Guide.
    provenance:
    - source_id: slides-02-process-2
      page: '11'
