- id: scrum-roles
  title: Scrum Roles
  claims:
  - id: scrum-master-role
    statement: The Scrum master ensures the methodology is understood and implemented,
      and supports the team by helping others interact according to Scrum rules.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      page: '8'
  - id: product-owner-role
    statement: The product owner manages and prioritizes the requirements in the product
      backlog.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      page: '8'
  - id: development-team-role
    statement: The development team is responsible for developing the product, which
      includes designing, coding, and testing.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      page: '8'
  relationships:
  - type: part_of
    target_semantic_unit: scrum
    description: Scrum master, product owner, and development team are roles within
      Scrum.
    provenance:
    - source_id: slides-02-process-2
      page: '8'
