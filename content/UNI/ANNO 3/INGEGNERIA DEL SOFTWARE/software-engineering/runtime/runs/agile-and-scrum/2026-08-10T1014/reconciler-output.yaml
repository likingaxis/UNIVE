- id: agile-manifesto
  title: Agile Manifesto
  claims:
  - id: agile-manifesto-values
    statement: The Agile Manifesto values individuals and interactions over processes
      and tools, working software over comprehensive documentation, customer collaboration
      over contract negotiation, and responding to change over following a plan.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      page: '6'
  - id: agile-manifesto-principles
    statement: In addition to values, the Agile Manifesto contains twelve agile principles
      that provide additional guidance.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      page: '6'
  - id: agile-manifesto-foundation
    statement: The values and principles of the Agile Manifesto define the basic concepts
      of agile development.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      page: '6'
