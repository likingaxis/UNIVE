- id: definition-of-done
  title: Definition of Done
  claims:
  - id: definition-of-done-concept
    statement: Scrum requires a 'definition of done', established by the development
      team, specifying what it means for a work item to be completed before integration.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      page: '10'
  - id: definition-of-done-requirements
    statement: Typical minimum requirements include adequate test cases and integration
      checks to ensure the main branch is not broken.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      page: '10'
  - id: definition-of-done-documentation
    statement: The definition of done also requires adequate code documentation, with
      'adequate' being defined by the team.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      page: '10'
  relationships:
  - type: part_of
    target_semantic_unit: scrum
    description: The definition of done is a requirement in Scrum.
    provenance:
    - source_id: slides-02-process-2
      page: '10'
  visual_asset_refs:
