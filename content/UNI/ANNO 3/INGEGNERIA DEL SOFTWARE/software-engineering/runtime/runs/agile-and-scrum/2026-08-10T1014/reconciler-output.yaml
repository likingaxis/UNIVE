- id: sprints
  title: Sprints
  claims:
  - id: sprint-definition
    statement: A sprint is a 2 to 4 week iteration aimed at delivering a new increment
      of working software.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      page: '9'
  - id: sprint-planning
    statement: A sprint begins with a sprint planning meeting where items are transferred
      from the product backlog to the sprint backlog.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      page: '9'
  - id: sprint-execution
    statement: During the sprint, the development team works on the increment and
      holds short daily Scrum (stand-up) meetings to synchronize work and address
      problems.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      page: '9'
  - id: sprint-review
    statement: At the end of a sprint, the increment is presented to the product owner
      and stakeholders in a sprint review.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      page: '9'
  - id: sprint-retrospective
    statement: A sprint concludes with a sprint retrospective meeting to identify
      and plan improvements for the next sprint.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      page: '9'
  relationships:
  - type: part_of
    target_semantic_unit: scrum
    description: Sprints are iterations within the Scrum process.
    provenance:
    - source_id: slides-02-process-2
      page: '9'
