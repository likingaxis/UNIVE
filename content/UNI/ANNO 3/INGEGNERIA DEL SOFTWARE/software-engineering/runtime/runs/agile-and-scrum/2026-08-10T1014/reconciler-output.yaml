semantic_units:
- id: agile-methods
  title: Agile Methods
  claims:
  - id: agile-methods-origins
    statement: Agile methods emerged in the early 2000s as a reaction against carefully
      planned software processes, which were seen as too restrictive on developers.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      page: '5'
  - id: agile-methods-definition
    statement: The agile method concept extends iterative and incremental development
      to include intensive communication, fast feedback, and few external rules.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      page: '5'
  - id: agile-manifesto-summary
    statement: The common values and principles of agile methods are summarized in
      the Agile Manifesto.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      page: '5'
  visual_asset_refs:
