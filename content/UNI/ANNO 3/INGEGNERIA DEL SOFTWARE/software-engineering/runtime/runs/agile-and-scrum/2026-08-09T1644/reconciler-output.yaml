topic_id: agile-and-scrum
topic_title: Metodologie Agile e Scrum
semantic_units:
- id: agile-methods-origin-and-characteristics
  title: Origine e caratteristiche dei metodi Agile
  claims:
  - id: agile-origin-reaction
    statement: Nei primi anni 2000 emerse una reazione contro l'importanza attribuita
      ai processi software accuratamente pianificati, considerati troppo restrittivi
      per gli sviluppatori.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      file: official-slides\I parte ISW - SistSW\02-Processo software parte2.pdf
      page: 5
    - source_id: andrea-summary
      file: IS_andrea.pdf
      page: 14
  - id: agile-extension-iterative-incremental
    statement: Il termine agile method estende il concetto originario di sviluppo
      iterativo e incrementale includendo aspetti quali comunicazione intensiva nel
      progetto, feedback rapido e poche regole esterne sul modo di lavorare.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      file: official-slides\I parte ISW - SistSW\02-Processo software parte2.pdf
      page: 5
  - id: agile-common-values-principles-manifesto
    statement: I valori e i principi comuni dei metodi Agile sono riassunti nell'Agile
      Manifesto.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      file: official-slides\I parte ISW - SistSW\02-Processo software parte2.pdf
      page: 5
    - source_id: theory-summary
      file: teoria.pdf
      page: 7
  - id: agile-flexibility-collaboration-value
    statement: L'approccio Agile è descritto nella fonte secondaria come incentrato
      su flessibilità, collaborazione e consegna rapida di valore.
    evidence_level: secondary
    status: secondary_only_but_compatible
    provenance:
    - source_id: andrea-summary
      file: IS_andrea.pdf
      page: 14
  - id: agile-not-single-model
    statement: Il modello Agile è descritto nella fonte secondaria come un insieme
      di principi e valori che guidano un modo di lavorare flessibile, collaborativo
      e iterativo, anziché come un singolo modello di sviluppo.
    evidence_level: secondary
    status: secondary_only_but_compatible
    provenance:
    - source_id: theory-summary
      file: teoria.pdf
      page: 7
  relationships:
  - type: contains
    target_semantic_unit: agile-manifesto
    description: I valori e i principi comuni che caratterizzano i metodi Agile sono
      raccolti nell'Agile Manifesto.
    provenance:
    - source_id: slides-02-process-2
      page: 5
  visual_asset_refs:
  - asset_id: 09dc2e52-c404-4f7c-b0c7-c440a0e4444c
    source_id: slides-02-process-2
    page: 5
    obsidian_path: assets/4f64ac69_p5_i0.png
  - asset_id: d2eb16cf-3b1c-4488-98c6-2e832fae3594
    source_id: slides-02-process-2
    page: 5
- id: agile-manifesto
  title: Agile Manifesto
  claims:
  - id: manifesto-year
    statement: L'Agile Manifesto è del 2001.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      file: official-slides\I parte ISW - SistSW\02-Processo software parte2.pdf
      page: 6
    - source_id: andrea-summary
      file: IS_andrea.pdf
      page: 14
  - id: manifesto-individuals-interactions
    statement: L'Agile Manifesto valorizza individui e interazioni più di processi
      e strumenti.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      file: official-slides\I parte ISW - SistSW\02-Processo software parte2.pdf
      page: 6
    - source_id: andrea-summary
      file: IS_andrea.pdf
      page: 14
  - id: manifesto-working-software
    statement: L'Agile Manifesto valorizza software funzionante più di documentazione
      esaustiva.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      file: official-slides\I parte ISW - SistSW\02-Processo software parte2.pdf
      page: 6
    - source_id: andrea-summary
      file: IS_andrea.pdf
      page: 14
  - id: manifesto-customer-collaboration
    statement: L'Agile Manifesto valorizza la collaborazione con il cliente più della
      negoziazione contrattuale.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      file: official-slides\I parte ISW - SistSW\02-Processo software parte2.pdf
      page: 6
    - source_id: andrea-summary
      file: IS_andrea.pdf
      page: 14
  - id: manifesto-responding-change
    statement: L'Agile Manifesto valorizza la risposta al cambiamento più del seguire
      un piano.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      file: official-slides\I parte ISW - SistSW\02-Processo software parte2.pdf
      page: 6
    - source_id: andrea-summary
      file: IS_andrea.pdf
      page: 14
    - source_id: theory-summary
      file: teoria.pdf
      page: 8
  - id: manifesto-right-items-have-value
    statement: Il Manifesto precisa che gli elementi posti a destra dei quattro confronti
      hanno valore, ma quelli posti a sinistra sono valorizzati maggiormente.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      file: official-slides\I parte ISW - SistSW\02-Processo software parte2.pdf
      page: 6
  - id: manifesto-twelve-principles
    statement: Oltre ai valori, l'Agile Manifesto contiene dodici principi Agile che
      forniscono indicazioni aggiuntive sull'uso dei metodi Agile.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      file: official-slides\I parte ISW - SistSW\02-Processo software parte2.pdf
      page: 6
    - source_id: andrea-summary
      file: IS_andrea.pdf
      page: 15
  - id: manifesto-values-principles-define-agile
    statement: I valori e i dodici principi dell'Agile Manifesto, considerati insieme,
      definiscono i concetti di base oggi conosciuti come agile development.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      file: official-slides\I parte ISW - SistSW\02-Processo software parte2.pdf
      page: 6
  - id: agile-principles-secondary-emphases
    statement: La fonte secondaria descrive i dodici principi come orientati, tra
      gli altri aspetti, alla consegna continua di software funzionante, alla collaborazione
      attiva con i clienti e all'accoglienza dei cambiamenti nei requisiti.
    evidence_level: secondary
    status: secondary_only_but_compatible
    provenance:
    - source_id: andrea-summary
      file: IS_andrea.pdf
      page: 15
  relationships:
  - type: defines
    target_semantic_unit: agile-methods-origin-and-characteristics
    description: I valori e i principi del Manifesto definiscono i concetti di base
      dell'agile development.
    provenance:
    - source_id: slides-02-process-2
      page: 6
  visual_asset_refs:
  - asset_id: 5d5d1135-c7fb-437b-86c8-d172e2ac6127
