- id: scrum-sprint-lifecycle
  title: Sprint ed eventi Scrum
  claims:
  - id: sprint-purpose
    statement: Uno sprint viene svolto per consegnare un nuovo incremento di software
      funzionante.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      file: official-slides\I parte ISW - SistSW\02-Processo software parte2.pdf
      page: 9
    - source_id: andrea-summary
      file: IS_andrea.pdf
      page: 15
  - id: sprint-duration
    statement: Uno sprint dura tipicamente da 2 a 4 settimane.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      file: official-slides\I parte ISW - SistSW\02-Processo software parte2.pdf
      page: 9
    - source_id: andrea-summary
      file: IS_andrea.pdf
      page: 15
  - id: sprint-planning-start
    statement: Lo sprint inizia con lo Sprint Planning meeting.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      file: official-slides\I parte ISW - SistSW\02-Processo software parte2.pdf
      page: 9
    - source_id: andrea-summary
      file: IS_andrea.pdf
      page: 15
  - id: sprint-planning-transfer
    statement: Durante lo Sprint Planning lo Scrum team trasferisce gli elementi da
      sviluppare dal Product Backlog allo Sprint Backlog.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      file: official-slides\I parte ISW - SistSW\02-Processo software parte2.pdf
      page: 9
    - source_id: andrea-summary
      file: IS_andrea.pdf
      page: 15
  - id: sprint-development-work
    statement: Durante lo sprint il development team lavora sull'incremento.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      file: official-slides\I parte ISW - SistSW\02-Processo software parte2.pdf
      page: 9
  - id: daily-scrum
    statement: Durante lo sprint si tengono brevi Daily Scrum meeting, chiamati anche
      stand-up meeting, del development team.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      file: official-slides\I parte ISW - SistSW\02-Processo software parte2.pdf
      page: 9
    - source_id: andrea-summary
      file: IS_andrea.pdf
      page: 15
  - id: daily-scrum-purpose
    statement: I Daily Scrum servono a sincronizzare il lavoro e affrontare eventuali
      problemi.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      file: official-slides\I parte ISW - SistSW\02-Processo software parte2.pdf
      page: 9
    - source_id: andrea-summary
      file: IS_andrea.pdf
      page: 15
  - id: sprint-review
    statement: Alla fine dello sprint l'incremento viene presentato al Product Owner
      e agli altri stakeholder durante una Sprint Review.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      file: official-slides\I parte ISW - SistSW\02-Processo software parte2.pdf
      page: 9
    - source_id: andrea-summary
      file: IS_andrea.pdf
      page: 15
  - id: sprint-retrospective
    statement: Dopo la Sprint Review viene svolto lo Sprint Retrospective meeting
      per identificare e pianificare miglioramenti per lo sprint successivo.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      file: official-slides\I parte ISW - SistSW\02-Processo software parte2.pdf
      page: 9
    - source_id: andrea-summary
      file: IS_andrea.pdf
      page: 15
  - id: scrum-repeated-sprints
    statement: La fonte secondaria descrive Scrum come organizzato in cicli ripetitivi
      chiamati sprint.
    evidence_level: secondary
    status: secondary_only_but_compatible
    provenance:
    - source_id: andrea-summary
      file: IS_andrea.pdf
      page: 15
  - id: scrum-feedback-adaptation-continuous-value
    statement: La fonte secondaria afferma che l'organizzazione in sprint permette
      al team di adattarsi rapidamente ai cambiamenti, ricevere feedback regolare
      e consegnare valore in modo continuo.
    evidence_level: secondary
    status: secondary_only_but_compatible
    provenance:
    - source_id: andrea-summary
      file: IS_andrea.pdf
      page: 15
  relationships:
  - type: produces
    target_semantic_unit: scrum-artifacts
    description: Lo sprint produce un incremento e utilizza Product Backlog e Sprint
      Backlog nella pianificazione del lavoro.
    provenance:
    - source_id: slides-02-process-2
      page: 9
  - type: precedes
    target_semantic_unit: scrum-definition-of-done
    description: L'incremento sviluppato durante lo sprint è soggetto ai criteri con
      cui il team definisce quando un work item è done prima dell'integrazione nel
      main branch.
    provenance:
    - source_id: slides-02-process-2
      page: 9
    - source_id: slides-02-process-2
      page: 10
  visual_asset_refs:
