    page: 9
- id: scrum-artifacts
  title: Artefatti Scrum
  claims:
  - id: product-backlog-secondary-description
    statement: La fonte secondaria descrive il Product Backlog come una lista prioritizzata
      che contiene funzionalità, miglioramenti e attività da realizzare in futuro.
    evidence_level: secondary
    status: secondary_only_but_compatible
    provenance:
    - source_id: andrea-summary
      file: IS_andrea.pdf
      page: 15
  - id: sprint-backlog-selection
    statement: Lo Sprint Backlog contiene gli elementi selezionati dal Product Backlog
      per essere sviluppati durante lo sprint.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      file: official-slides\I parte ISW - SistSW\02-Processo software parte2.pdf
      page: 9
    - source_id: andrea-summary
      file: IS_andrea.pdf
      page: 15
  - id: increment-secondary-description
    statement: La fonte secondaria descrive l'incremento come il risultato del lavoro
      dello sprint, comprendente le funzionalità e le attività completate.
    evidence_level: secondary
    status: secondary_only_but_compatible
    provenance:
    - source_id: andrea-summary
      file: IS_andrea.pdf
      page: 15
  relationships:
  - type: contains
    target_semantic_unit: scrum-sprint-lifecycle
    description: Gli elementi del Product Backlog selezionati nello Sprint Planning
      vengono trasferiti nello Sprint Backlog per lo sprint corrente.
    provenance:
    - source_id: slides-02-process-2
      page: 9
  visual_asset_refs: []
- id: scrum-definition-of-done
  title: Definition of Done
  claims:
  - id: dod-required
    statement: Scrum richiede una Definition of Done.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      file: official-slides\I parte ISW - SistSW\02-Processo software parte2.pdf
      page: 10
  - id: dod-team-defined
    statement: Il development team definisce per sé che cosa significa che un work
      item sia done prima che possa essere integrato nel main branch.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      file: official-slides\I parte ISW - SistSW\02-Processo software parte2.pdf
      page: 10
    - source_id: andrea-summary
      file: IS_andrea.pdf
      page: 15
  - id: dod-test-cases
    statement: Tra i requisiti minimi tipici della Definition of Done rientra un numero
      adeguato di test case.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      file: official-slides\I parte ISW - SistSW\02-Processo software parte2.pdf
      page: 10
  - id: dod-integration-check
    statement: Tra i requisiti minimi tipici della Definition of Done rientra la verifica
      dell'integrazione del nuovo codice per assicurarsi che non interrompa il main
      development branch.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      file: official-slides\I parte ISW - SistSW\02-Processo software parte2.pdf
      page: 10
  - id: dod-documentation
    statement: La Definition of Done richiede inoltre che il codice sia documentato
      adeguatamente.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      file: official-slides\I parte ISW - SistSW\02-Processo software parte2.pdf
      page: 10
  - id: dod-adequate-defined-by-team
    statement: È il team stesso a definire che cosa significhi documentazione adeguata.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      file: official-slides\I parte ISW - SistSW\02-Processo software parte2.pdf
      page: 10
  - id: dod-quality-purpose
    statement: La fonte secondaria afferma che la Definition of Done aiuta a garantire
      che il lavoro consegnato sia di alta qualità e soddisfi gli standard stabiliti.
    evidence_level: secondary
    status: secondary_only_but_compatible
    provenance:
    - source_id: andrea-summary
      file: IS_andrea.pdf
      page: 15
  relationships: []
