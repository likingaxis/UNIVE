- id: scrum-roles
  title: Ruoli Scrum
  claims:
  - id: scrum-master-methodology
    statement: Lo Scrum Master assicura che la metodologia sia compresa e correttamente
      implementata dal development team e dal Product Owner.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      file: official-slides\I parte ISW - SistSW\02-Processo software parte2.pdf
      page: 8
  - id: scrum-master-interaction-support
    statement: Lo Scrum Master supporta il team aiutando gli altri a interagire con
      esso secondo le regole Scrum.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      file: official-slides\I parte ISW - SistSW\02-Processo software parte2.pdf
      page: 8
  - id: scrum-master-removes-obstacles
    statement: Le fonti secondarie attribuiscono allo Scrum Master il compito di rimuovere
      gli ostacoli che potrebbero impedire il progresso del team.
    evidence_level: secondary
    status: secondary_only_but_compatible
    provenance:
    - source_id: andrea-summary
      file: IS_andrea.pdf
      page: 15
    - source_id: theory-summary
      file: teoria.pdf
      page: 8
  - id: scrum-master-protects-team
    statement: La fonte secondaria attribuisce allo Scrum Master il compito di proteggere
      il team dalle interferenze.
    evidence_level: secondary
    status: secondary_only_but_compatible
    provenance:
    - source_id: theory-summary
      file: teoria.pdf
      page: 8
  - id: product-owner-requirements-priority
    statement: Il Product Owner gestisce e contribuisce a prioritizzare i requisiti
      da implementare documentati nel Product Backlog.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      file: official-slides\I parte ISW - SistSW\02-Processo software parte2.pdf
      page: 8
    - source_id: andrea-summary
      file: IS_andrea.pdf
      page: 15
    - source_id: theory-summary
      file: teoria.pdf
      page: 8
  - id: product-owner-maintains-backlog
    statement: Le fonti secondarie attribuiscono al Product Owner la responsabilità
      di mantenere aggiornato il Product Backlog.
    evidence_level: secondary
    status: secondary_only_but_compatible
    provenance:
    - source_id: andrea-summary
      file: IS_andrea.pdf
      page: 15
    - source_id: theory-summary
      file: teoria.pdf
      page: 8
  - id: development-team-product
    statement: Il development team è responsabile dello sviluppo del prodotto, comprese
      tutte le attività rilevanti.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      file: official-slides\I parte ISW - SistSW\02-Processo software parte2.pdf
      page: 8
    - source_id: andrea-summary
      file: IS_andrea.pdf
      page: 15
  - id: development-team-tasks-examples
    statement: Tra le attività rilevanti svolte dal development team rientrano progettazione,
      codifica e testing.
    evidence_level: primary
    status: primary_supported
    provenance:
    - source_id: slides-02-process-2
      file: official-slides\I parte ISW - SistSW\02-Processo software parte2.pdf
      page: 8
  - id: development-team-increments
    statement: La fonte secondaria descrive il Dev Team come il gruppo di sviluppatori
      che lavora agli incrementi.
    evidence_level: secondary
    status: secondary_only_but_compatible
    provenance:
    - source_id: theory-summary
      file: teoria.pdf
      page: 8
  relationships:
  - type: performed_by
    target_semantic_unit: scrum-sprint-lifecycle
    description: Durante lo sprint il development team lavora sull'incremento.
    provenance:
