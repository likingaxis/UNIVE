- id: scrum-overview
  title: Scrum
  claims:
  - id: scrum-agile-framework
    statement: Scrum è descritto nelle fonti secondarie come uno dei framework più
      popolari nell'ambito dell'approccio Agile.
    evidence_level: secondary
    status: secondary_only_but_compatible
    provenance:
    - source_id: andrea-summary
      file: IS_andrea.pdf
      page: 15
    - source_id: theory-summary
      file: teoria.pdf
      page: 8
  - id: scrum-lightweight-iterative-structure
    statement: Scrum è descritto nella fonte secondaria come una struttura organizzativa
      leggera e iterativa pensata per gestire progetti complessi.
    evidence_level: secondary
    status: secondary_only_but_compatible
    provenance:
    - source_id: theory-summary
      file: teoria.pdf
      page: 8
  - id: scrum-purpose-iterative-incremental-value
    statement: La fonte secondaria attribuisce a Scrum l'obiettivo di consegnare valore
      in modo iterativo e incrementale, permettendo ai team di adattarsi rapidamente
      ai cambiamenti nelle esigenze dei clienti e nel contesto del progetto.
    evidence_level: secondary
    status: secondary_only_but_compatible
    provenance:
    - source_id: andrea-summary
      file: IS_andrea.pdf
      page: 15
  relationships:
  - type: contains
    target_semantic_unit: scrum-roles
    description: Le evidenze su Scrum comprendono ruoli con responsabilità specifiche.
    provenance:
    - source_id: slides-02-process-2
      page: 8
  - type: contains
    target_semantic_unit: scrum-sprint-lifecycle
    description: Scrum utilizza sprint nei quali viene prodotto un nuovo incremento
      di software funzionante.
    provenance:
    - source_id: slides-02-process-2
      page: 9
  visual_asset_refs:
  - asset_id: 55791be7-74fb-4508-aa5f-e0e2e8544e81
    source_id: slides-02-process-2
    page: 7
    obsidian_path: assets/4f64ac69_p7_i0.png
  - asset_id: d12b80ef-97cb-429f-80fc-ec15f85c37e2
    source_id: slides-02-process-2
    page: 7
