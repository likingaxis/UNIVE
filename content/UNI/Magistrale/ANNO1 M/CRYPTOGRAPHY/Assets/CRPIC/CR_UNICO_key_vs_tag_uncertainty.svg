<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 325" role="img" aria-labelledby="kv-title kv-desc" font-family="'Segoe UI', Arial, sans-serif">
  <title id="kv-title">Key-Space Shrinkage vs. Unchanged Tag Uncertainty for p = 5</title>
  <desc id="kv-desc">Left panel: before observing a tag, 25 keys in Z_5^2 map 5-to-1 onto all 5 tags in Z_5 (key guess 1/25, tag guess 1/5). Right panel: after observing one tag for m=2, tau=3, only 5 valid keys remain, yet they map 1-to-1 onto all 5 tags for a new message m'=1 (key guess 1/5, tag guess still 1/5).</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 1L9 5L0 9Z" fill="#4338ca"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 1L9 5L0 9Z" fill="#2a9d8f"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="798" height="323" rx="14" fill="#fcfbf8" stroke="#e7e2d9" stroke-width="1.5"/>

  <text x="400" y="29" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1f1d1a">
    One-Time Affine Hashing (<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">p</tspan> = 5): Key Uncertainty vs. Tag Uncertainty for New <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan>'
  </text>

  <!-- LEFT PANEL: Before observing tau -->
  <rect x="20" y="46" width="368" height="262" rx="10" fill="#f5f4ef" stroke="#d6d0c4" stroke-width="1.5"/>
  <rect x="38" y="56" width="332" height="28" rx="7" fill="#eef0fb" stroke="#4338ca" stroke-width="1.4"/>
  <text x="204" y="75" text-anchor="middle" font-size="13" font-weight="700" fill="#312e81">
    Before observing τ (25 keys → 5 tags)
  </text>

  <text x="108" y="101" text-anchor="middle" font-size="11.5" font-weight="600" fill="#57534e">
    Domain <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">K</tspan> = ℤ<tspan baseline-shift="sub" font-size="8.5">5</tspan><tspan baseline-shift="super" font-size="8.5">2</tspan> (25 keys)
  </text>
  <text x="310" y="101" text-anchor="middle" font-size="11.5" font-weight="600" fill="#57534e">
    Codomain <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">T</tspan> = ℤ<tspan baseline-shift="sub" font-size="8.5">5</tspan>
  </text>

  <!-- Arrows 5-to-1 -->
  <path d="M162 121 H272" fill="none" stroke="#4338ca" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <path d="M162 151 H272" fill="none" stroke="#4338ca" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <path d="M162 181 H272" fill="none" stroke="#4338ca" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <path d="M162 211 H272" fill="none" stroke="#4338ca" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <path d="M162 241 H272" fill="none" stroke="#4338ca" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <text x="218" y="115" text-anchor="middle" font-size="10.5" font-weight="600" fill="#4338ca">5 keys each</text>

  <!-- Left groups (5 cosets of 5 keys) -->
  <rect x="48" y="109" width="114" height="24" rx="6" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.3"/>
  <text x="105" y="125" text-anchor="middle" font-size="11.5" fill="#312e81">5 keys (→ 0)</text>
  <rect x="48" y="139" width="114" height="24" rx="6" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.3"/>
  <text x="105" y="155" text-anchor="middle" font-size="11.5" fill="#312e81">5 keys (→ 1)</text>
  <rect x="48" y="169" width="114" height="24" rx="6" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.3"/>
  <text x="105" y="185" text-anchor="middle" font-size="11.5" fill="#312e81">5 keys (→ 2)</text>
  <rect x="48" y="199" width="114" height="24" rx="6" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.3"/>
  <text x="105" y="215" text-anchor="middle" font-size="11.5" fill="#312e81">5 keys (→ 3)</text>
  <rect x="48" y="229" width="114" height="24" rx="6" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.3"/>
  <text x="105" y="245" text-anchor="middle" font-size="11.5" fill="#312e81">5 keys (→ 4)</text>

  <!-- Right tags 0..4 -->
  <rect x="278" y="109" width="66" height="24" rx="6" fill="#eef0fb" stroke="#4338ca" stroke-width="1.4"/>
  <text x="311" y="125" text-anchor="middle" font-size="12" font-weight="700" fill="#312e81">τ' = 0</text>
  <rect x="278" y="139" width="66" height="24" rx="6" fill="#eef0fb" stroke="#4338ca" stroke-width="1.4"/>
  <text x="311" y="155" text-anchor="middle" font-size="12" font-weight="700" fill="#312e81">τ' = 1</text>
  <rect x="278" y="169" width="66" height="24" rx="6" fill="#eef0fb" stroke="#4338ca" stroke-width="1.4"/>
  <text x="311" y="185" text-anchor="middle" font-size="12" font-weight="700" fill="#312e81">τ' = 2</text>
  <rect x="278" y="199" width="66" height="24" rx="6" fill="#eef0fb" stroke="#4338ca" stroke-width="1.4"/>
  <text x="311" y="215" text-anchor="middle" font-size="12" font-weight="700" fill="#312e81">τ' = 3</text>
  <rect x="278" y="229" width="66" height="24" rx="6" fill="#eef0fb" stroke="#4338ca" stroke-width="1.4"/>
  <text x="311" y="245" text-anchor="middle" font-size="12" font-weight="700" fill="#312e81">τ' = 4</text>

  <!-- Left footer -->
  <rect x="38" y="264" width="332" height="34" rx="8" fill="#eef0fb" stroke="#4338ca" stroke-width="1.4"/>
  <text x="204" y="285" text-anchor="middle" font-size="12" font-weight="700" fill="#312e81">
    Key guess: 1/25   |   Tag guess: 5/25 = 1/5
  </text>

  <!-- RIGHT PANEL: After observing tau -->
  <rect x="412" y="46" width="368" height="262" rx="10" fill="#f5f4ef" stroke="#d6d0c4" stroke-width="1.5"/>
  <rect x="430" y="56" width="332" height="28" rx="7" fill="#e6f4f1" stroke="#2a9d8f" stroke-width="1.4"/>
  <text x="596" y="75" text-anchor="middle" font-size="13" font-weight="700" fill="#115e59">
    After observing (2, 3) (5 keys → 5 tags)
  </text>

  <text x="500" y="101" text-anchor="middle" font-size="11.5" font-weight="600" fill="#57534e">
    Valid keys (20 ruled out)
  </text>
  <text x="702" y="101" text-anchor="middle" font-size="11.5" font-weight="600" fill="#57534e">
    Tags for <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan>' = 1
  </text>

  <!-- Arrows 1-to-1 bijection (for m'=1: (0,3)->3, (1,1)->2, (2,4)->1, (3,2)->0, (4,0)->4) -->
  <path d="M554 121 L664 211" fill="none" stroke="#2a9d8f" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <path d="M554 151 L664 181" fill="none" stroke="#2a9d8f" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <path d="M554 181 L664 151" fill="none" stroke="#2a9d8f" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <path d="M554 211 L664 121" fill="none" stroke="#2a9d8f" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <path d="M554 241 H664" fill="none" stroke="#2a9d8f" stroke-width="1.8" marker-end="url(#arrow-green)"/>

  <!-- Valid 5 keys -->
  <rect x="440" y="109" width="114" height="24" rx="6" fill="#e6f4f1" stroke="#2a9d8f" stroke-width="1.4"/>
  <text x="497" y="125" text-anchor="middle" font-size="12" font-weight="600" fill="#115e59">(0, 3)</text>
  <rect x="440" y="139" width="114" height="24" rx="6" fill="#e6f4f1" stroke="#2a9d8f" stroke-width="1.4"/>
  <text x="497" y="155" text-anchor="middle" font-size="12" font-weight="600" fill="#115e59">(1, 1)</text>
  <rect x="440" y="169" width="114" height="24" rx="6" fill="#e6f4f1" stroke="#2a9d8f" stroke-width="1.4"/>
  <text x="497" y="185" text-anchor="middle" font-size="12" font-weight="600" fill="#115e59">(2, 4)</text>
  <rect x="440" y="199" width="114" height="24" rx="6" fill="#e6f4f1" stroke="#2a9d8f" stroke-width="1.4"/>
  <text x="497" y="215" text-anchor="middle" font-size="12" font-weight="600" fill="#115e59">(3, 2)</text>
  <rect x="440" y="229" width="114" height="24" rx="6" fill="#e6f4f1" stroke="#2a9d8f" stroke-width="1.4"/>
  <text x="497" y="245" text-anchor="middle" font-size="12" font-weight="600" fill="#115e59">(4, 0)</text>

  <!-- Right tags 0..4 -->
  <rect x="670" y="109" width="66" height="24" rx="6" fill="#eef0fb" stroke="#4338ca" stroke-width="1.4"/>
  <text x="703" y="125" text-anchor="middle" font-size="12" font-weight="700" fill="#312e81">τ' = 0</text>
  <rect x="670" y="139" width="66" height="24" rx="6" fill="#eef0fb" stroke="#4338ca" stroke-width="1.4"/>
  <text x="703" y="155" text-anchor="middle" font-size="12" font-weight="700" fill="#312e81">τ' = 1</text>
  <rect x="670" y="169" width="66" height="24" rx="6" fill="#eef0fb" stroke="#4338ca" stroke-width="1.4"/>
  <text x="703" y="185" text-anchor="middle" font-size="12" font-weight="700" fill="#312e81">τ' = 2</text>
  <rect x="670" y="199" width="66" height="24" rx="6" fill="#eef0fb" stroke="#4338ca" stroke-width="1.4"/>
  <text x="703" y="215" text-anchor="middle" font-size="12" font-weight="700" fill="#312e81">τ' = 3</text>
  <rect x="670" y="229" width="66" height="24" rx="6" fill="#eef0fb" stroke="#4338ca" stroke-width="1.4"/>
  <text x="703" y="245" text-anchor="middle" font-size="12" font-weight="700" fill="#312e81">τ' = 4</text>

  <!-- Right footer -->
  <rect x="430" y="264" width="332" height="34" rx="8" fill="#e6f4f1" stroke="#2a9d8f" stroke-width="1.4"/>
  <text x="596" y="285" text-anchor="middle" font-size="12" font-weight="700" fill="#115e59">
    Key guess: 1/5 (higher)  |  Tag guess: 1/5 (unchanged)
  </text>
</svg>
