<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 375" role="img" aria-labelledby="ttg-title ttg-desc" font-family="'Segoe UI', Arial, sans-serif">
  <title id="ttg-title">Two-Time Statistical MAC Unforgeability Game</title>
  <desc id="ttg-desc">Two-time security game between unbounded Adversary A and Challenger C. Challenger samples uniform key k from K. A queries two distinct messages m1 and m2 != m1, receiving tags tau1 and tau2. A outputs forgery (m3, tau3) and wins if m3 is fresh (not in {m1, m2}) and Tag(k, m3) = tau3.</desc>
  <defs>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 1L9 5L0 9Z" fill="#57534e"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 1L9 5L0 9Z" fill="#e05a6d"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="778" height="373" rx="14" fill="#fcfbf8" stroke="#e7e2d9" stroke-width="1.5"/>

  <text x="390" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#1f1d1a">
    Two-Time Unforgeability Game (Unbounded Adversary <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">A</tspan>)
  </text>

  <!-- Vertical lifelines -->
  <line x1="150" y1="92" x2="150" y2="298" stroke="#d6d0c4" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="630" y1="92" x2="630" y2="298" stroke="#d6d0c4" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- Headers -->
  <rect x="44" y="48" width="212" height="44" rx="10" fill="#fbecee" stroke="#e05a6d" stroke-width="2"/>
  <text x="150" y="75" text-anchor="middle" font-size="16" font-weight="700" fill="#9f1239">
    Adversary <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">A</tspan>
  </text>

  <rect x="524" y="48" width="212" height="44" rx="10" fill="#eef0fb" stroke="#4338ca" stroke-width="2"/>
  <text x="630" y="75" text-anchor="middle" font-size="16" font-weight="700" fill="#312e81">
    Challenger <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">C</tspan>
  </text>

  <!-- Sample key -->
  <rect x="536" y="102" width="188" height="28" rx="8" fill="#e6f4f1" stroke="#2a9d8f" stroke-width="1.5"/>
  <text x="630" y="121" text-anchor="middle" font-size="13" font-weight="600" fill="#115e59">
    Sample uniform key <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">k</tspan> ∈ <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">K</tspan>
  </text>

  <!-- Query 1 -->
  <path d="M150 144 H624" fill="none" stroke="#57534e" stroke-width="2.2" marker-end="url(#arrow-slate)"/>
  <rect x="304" y="131" width="172" height="24" rx="12" fill="#f5f4ef" stroke="#d6d0c4" stroke-width="1.3"/>
  <text x="390" y="147" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f1d1a">
    1. Query <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="9">1</tspan> ∈ <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">M</tspan>
  </text>

  <path d="M630 176 H156" fill="none" stroke="#57534e" stroke-width="2.2" marker-end="url(#arrow-slate)"/>
  <rect x="294" y="163" width="192" height="24" rx="12" fill="#eef0fb" stroke="#a5b4fc" stroke-width="1.3"/>
  <text x="390" y="179" text-anchor="middle" font-size="12.5" font-weight="600" fill="#4338ca">
    2. τ<tspan baseline-shift="sub" font-size="9">1</tspan> = Tag(<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">k</tspan>, <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="9">1</tspan>)
  </text>

  <!-- Query 2 -->
  <path d="M150 212 H624" fill="none" stroke="#57534e" stroke-width="2.2" marker-end="url(#arrow-slate)"/>
  <rect x="304" y="199" width="172" height="24" rx="12" fill="#f5f4ef" stroke="#d6d0c4" stroke-width="1.3"/>
  <text x="390" y="215" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f1d1a">
    3. Query <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="9">2</tspan> ≠ <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="9">1</tspan>
  </text>

  <path d="M630 244 H156" fill="none" stroke="#57534e" stroke-width="2.2" marker-end="url(#arrow-slate)"/>
  <rect x="294" y="231" width="192" height="24" rx="12" fill="#eef0fb" stroke="#a5b4fc" stroke-width="1.3"/>
  <text x="390" y="247" text-anchor="middle" font-size="12.5" font-weight="600" fill="#4338ca">
    4. τ<tspan baseline-shift="sub" font-size="9">2</tspan> = Tag(<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">k</tspan>, <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="9">2</tspan>)
  </text>

  <!-- Step 5: Forgery -->
  <path d="M150 282 H624" fill="none" stroke="#e05a6d" stroke-width="2.2" marker-end="url(#arrow-red)"/>
  <rect x="276" y="269" width="228" height="24" rx="12" fill="#fbecee" stroke="#eca3ae" stroke-width="1.3"/>
  <text x="390" y="285" text-anchor="middle" font-size="12.5" font-weight="600" fill="#9f1239">
    5. Forge (<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="9">3</tspan>, τ<tspan baseline-shift="sub" font-size="9">3</tspan>)
  </text>

  <!-- Win condition -->
  <rect x="82" y="308" width="616" height="50" rx="10" fill="#e6f4f1" stroke="#2a9d8f" stroke-width="1.8"/>
  <text x="390" y="329" text-anchor="middle" font-size="13.5" font-weight="700" fill="#115e59">
    WIN condition:  <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="9">3</tspan> ∉ {<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="9">1</tspan>, <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="9">2</tspan>}   and   Tag(<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">k</tspan>, <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="9">3</tspan>) = τ<tspan baseline-shift="sub" font-size="9">3</tspan>
  </text>
  <text x="390" y="348" text-anchor="middle" font-size="12.5" fill="#1f6f66">
    Two-time ε-statistical security:  ∀ unbounded <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">A</tspan>,   Pr[<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">A</tspan> wins] ≤ ε
  </text>
</svg>
