<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" role="img" aria-labelledby="otp-xor-title otp-xor-desc" font-family="'Segoe UI', Arial, sans-serif">
  <title id="otp-xor-title">One-Time Pad Encryption via Bitwise XOR</title>
  <desc id="otp-xor-desc">Plaintext m in {0,1}^l and secret key k in {0,1}^l feed into a bitwise XOR operation to produce ciphertext c = k XOR m.</desc>
  <defs>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 1L9 5L0 9Z" fill="#57534e"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 1L9 5L0 9Z" fill="#2a9d8f"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 1L9 5L0 9Z" fill="#4338ca"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="638" height="268" rx="14" fill="#fcfbf8" stroke="#e7e2d9" stroke-width="1.5"/>

  <!-- Connectors -->
  <path d="M169 94 V132 Q169 142 179 142 H290" fill="none" stroke="#4338ca" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <path d="M471 94 V132 Q471 142 461 142 H350" fill="none" stroke="#2a9d8f" stroke-width="2.2" marker-end="url(#arrow-green)"/>
  <path d="M320 166 V198" fill="none" stroke="#57534e" stroke-width="2.2" marker-end="url(#arrow-slate)"/>

  <!-- Plaintext box -->
  <rect x="64" y="26" width="210" height="68" rx="12" fill="#eef0fb" stroke="#4338ca" stroke-width="2"/>
  <text x="169" y="53" text-anchor="middle" font-size="16" font-weight="700" fill="#312e81">Plaintext</text>
  <text x="169" y="77" text-anchor="middle" font-size="13.5" font-weight="600" fill="#4338ca">
    <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan> ∈ {0, 1}<tspan baseline-shift="super" font-size="9.5">ℓ</tspan>
  </text>

  <!-- Secret key box -->
  <rect x="366" y="26" width="210" height="68" rx="12" fill="#e6f4f1" stroke="#2a9d8f" stroke-width="2"/>
  <text x="471" y="53" text-anchor="middle" font-size="16" font-weight="700" fill="#115e59">Secret key</text>
  <text x="471" y="77" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1f6f66">
    <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">k</tspan> ∈ {0, 1}<tspan baseline-shift="super" font-size="9.5">ℓ</tspan>
  </text>

  <!-- XOR circle -->
  <circle cx="320" cy="142" r="24" fill="#f1efe9" stroke="#57534e" stroke-width="2"/>
  <text x="320" y="150" text-anchor="middle" font-size="25" font-weight="700" fill="#1f1d1a">⊕</text>

  <!-- Ciphertext box -->
  <rect x="200" y="204" width="240" height="46" rx="10" fill="#f5f4ef" stroke="#57534e" stroke-width="2"/>
  <text x="320" y="232" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1f1d1a">
    Ciphertext <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">c</tspan> = <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">k</tspan> ⊕ <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan>
  </text>
</svg>
