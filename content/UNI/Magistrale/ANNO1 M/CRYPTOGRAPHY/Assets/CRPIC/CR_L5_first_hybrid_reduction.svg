<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 455" role="img" aria-labelledby="title desc" font-family="Segoe UI, Arial, sans-serif" fill="#0f172a">
  <title id="title">First-transition reduction for ell = 3 (i = 0)</title>
  <desc id="desc">Adversary B receives a (lambda + 1)-bit challenge z from the challenger, splits it into (s_1, b_1) with an empty prefix since i = 0, computes (s_2, b_2) = G(s_1) and (s_3, b_3) = G(s_2), and sends z prime = (b_1, b_2, b_3, s_3) to adversary A, returning A's output bit. A generated challenge induces H_0, whereas a uniform challenge induces H_1.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1L9 5L0 9Z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 1L9 5L0 9Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 1L9 5L0 9Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="860" height="455" fill="#ffffff"/>

  <!-- Header -->
  <text x="430" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">First-transition reduction for <tspan font-family="Georgia, serif" font-style="italic">ℓ</tspan> = 3 (selected index <tspan font-family="Georgia, serif" font-style="italic">i</tspan> = 0)</text>
  <text x="430" y="57" text-anchor="middle" font-size="14.5" fill="#64748b">Reduction <tspan font-family="Georgia, serif" font-style="italic">B</tspan> embeds its (<tspan font-family="Georgia, serif" font-style="italic">λ</tspan> + 1)-bit challenge <tspan font-family="Georgia, serif" font-style="italic">z</tspan> into a (<tspan font-family="Georgia, serif" font-style="italic">λ</tspan> + 3)-bit input <tspan font-family="Georgia, serif" font-style="italic">z′</tspan> for <tspan font-family="Georgia, serif" font-style="italic">A</tspan></text>

  <!-- Challenger box -->
  <rect x="235" y="74" width="390" height="62" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="430" y="99" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Challenger</text>
  <text x="430" y="123" text-anchor="middle" font-size="15.5" fill="#334155">
    Samples <tspan font-family="Georgia, serif" font-style="italic">z</tspan> ← <tspan font-family="Georgia, serif" font-style="italic">G</tspan>(<tspan font-family="Georgia, serif" font-style="italic">U</tspan><tspan baseline-shift="sub" font-size="11" font-family="Georgia, serif" font-style="italic">λ</tspan>)   or   <tspan font-family="Georgia, serif" font-style="italic">z</tspan> ← <tspan font-family="Georgia, serif" font-style="italic">U</tspan><tspan baseline-shift="sub" font-size="11" font-family="Georgia, serif" font-style="italic">λ+1</tspan>
  </text>

  <!-- Arrow Challenger -> B -->
  <path d="M430 136 V168" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="444" y="139" width="110" height="22" rx="11" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="499" y="154" text-anchor="middle" font-size="12.5" font-weight="600" fill="#334155"><tspan font-family="Georgia, serif" font-style="italic">z</tspan> (<tspan font-family="Georgia, serif" font-style="italic">λ</tspan> + 1 bits)</text>

  <!-- Adversary B container -->
  <rect x="36" y="172" width="788" height="162" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="58" y="198" font-size="17" font-weight="700" fill="#1d4ed8">PPT Adversary <tspan font-family="Georgia, serif" font-style="italic">B</tspan></text>
  <rect x="218" y="180" width="232" height="24" rx="12" fill="#dbeafe"/>
  <text x="334" y="196" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e40af">For <tspan font-family="Georgia, serif" font-style="italic">i</tspan> = 0, prefix is empty</text>

  <!-- Step 1 -->
  <rect x="56" y="214" width="212" height="102" rx="11" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.6"/>
  <circle cx="78" cy="235" r="11" fill="#1d4ed8"/>
  <text x="78" y="239" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">1</text>
  <text x="98" y="240" font-size="14.5" font-weight="700" fill="#1e40af">Split challenge</text>
  <text x="162" y="272" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">
    <tspan font-family="Georgia, serif" font-style="italic">z</tspan> = (<tspan font-family="Georgia, serif" font-style="italic">s</tspan><tspan baseline-shift="sub" font-size="13">1</tspan>, <tspan font-family="Georgia, serif" font-style="italic">b</tspan><tspan baseline-shift="sub" font-size="13">1</tspan>)
  </text>
  <text x="162" y="298" text-anchor="middle" font-size="13" fill="#64748b"><tspan font-family="Georgia, serif" font-style="italic">s</tspan><tspan baseline-shift="sub" font-size="10">1</tspan>: <tspan font-family="Georgia, serif" font-style="italic">λ</tspan> bits,   <tspan font-family="Georgia, serif" font-style="italic">b</tspan><tspan baseline-shift="sub" font-size="10">1</tspan>: 1 bit</text>

  <path d="M268 265 H304" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>

  <!-- Step 2 -->
  <rect x="308" y="214" width="232" height="102" rx="11" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.6"/>
  <circle cx="330" cy="235" r="11" fill="#1d4ed8"/>
  <text x="330" y="239" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">2</text>
  <text x="350" y="240" font-size="14.5" font-weight="700" fill="#1e40af">Run <tspan font-family="Georgia, serif" font-style="italic">G</tspan> twice from <tspan font-family="Georgia, serif" font-style="italic">s</tspan><tspan baseline-shift="sub" font-size="10.5">1</tspan></text>
  <text x="424" y="270" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">
    (<tspan font-family="Georgia, serif" font-style="italic">s</tspan><tspan baseline-shift="sub" font-size="12">2</tspan>, <tspan font-family="Georgia, serif" font-style="italic">b</tspan><tspan baseline-shift="sub" font-size="12">2</tspan>) = <tspan font-family="Georgia, serif" font-style="italic">G</tspan>(<tspan font-family="Georgia, serif" font-style="italic">s</tspan><tspan baseline-shift="sub" font-size="12">1</tspan>)
  </text>
  <text x="424" y="297" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">
    (<tspan font-family="Georgia, serif" font-style="italic">s</tspan><tspan baseline-shift="sub" font-size="12">3</tspan>, <tspan font-family="Georgia, serif" font-style="italic">b</tspan><tspan baseline-shift="sub" font-size="12">3</tspan>) = <tspan font-family="Georgia, serif" font-style="italic">G</tspan>(<tspan font-family="Georgia, serif" font-style="italic">s</tspan><tspan baseline-shift="sub" font-size="12">2</tspan>)
  </text>

  <path d="M540 265 H576" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>

  <!-- Step 3 -->
  <rect x="580" y="214" width="224" height="102" rx="11" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.6"/>
  <circle cx="602" cy="235" r="11" fill="#1d4ed8"/>
  <text x="602" y="239" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">3</text>
  <text x="622" y="240" font-size="14.5" font-weight="700" fill="#1e40af">Form sample <tspan font-family="Georgia, serif" font-style="italic">z′</tspan></text>
  <text x="692" y="272" text-anchor="middle" font-size="18.5" font-weight="700" fill="#0f172a">
    (<tspan font-family="Georgia, serif" font-style="italic">b</tspan><tspan baseline-shift="sub" font-size="12.5">1</tspan>, <tspan font-family="Georgia, serif" font-style="italic">b</tspan><tspan baseline-shift="sub" font-size="12.5">2</tspan>, <tspan font-family="Georgia, serif" font-style="italic">b</tspan><tspan baseline-shift="sub" font-size="12.5">3</tspan>, <tspan font-family="Georgia, serif" font-style="italic">s</tspan><tspan baseline-shift="sub" font-size="12.5">3</tspan>)
  </text>
  <text x="692" y="298" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af"><tspan font-family="Georgia, serif" font-style="italic">λ</tspan> + 3 bits sent to <tspan font-family="Georgia, serif" font-style="italic">A</tspan></text>

  <!-- Call / return arrows between B and A -->
  <path d="M165 334 V366" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="155" y="354" text-anchor="end" font-size="13" font-weight="600" fill="#334155">pass <tspan font-family="Georgia, serif" font-style="italic">z′</tspan></text>

  <path d="M275 370 V338" fill="none" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#arrow-purple)"/>
  <text x="285" y="354" text-anchor="start" font-size="13" font-weight="600" fill="#6d28d9"><tspan font-family="Georgia, serif" font-style="italic">B</tspan> returns <tspan font-family="Georgia, serif" font-style="italic">A</tspan>(<tspan font-family="Georgia, serif" font-style="italic">z′</tspan>)</text>

  <!-- Adversary A box (bottom left) -->
  <rect x="36" y="370" width="368" height="72" rx="14" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
  <text x="220" y="399" text-anchor="middle" font-size="18.5" font-weight="700" fill="#6d28d9">PPT Adversary <tspan font-family="Georgia, serif" font-style="italic">A</tspan></text>
  <text x="220" y="425" text-anchor="middle" font-size="14.5" fill="#334155">Receives <tspan font-family="Georgia, serif" font-style="italic">z′</tspan> and outputs bit <tspan font-family="Georgia, serif" font-style="italic">A</tspan>(<tspan font-family="Georgia, serif" font-style="italic">z′</tspan>) ∈ {0, 1}</text>

  <!-- Outcome equivalence card (bottom right) -->
  <rect x="424" y="370" width="400" height="72" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/>
  <circle cx="446" cy="395" r="5" fill="#2563eb"/>
  <text x="460" y="400" font-size="14.5" fill="#1e293b">
    If <tspan font-family="Georgia, serif" font-style="italic">z</tspan> ← <tspan font-family="Georgia, serif" font-style="italic">G</tspan>(<tspan font-family="Georgia, serif" font-style="italic">U</tspan><tspan baseline-shift="sub" font-size="10.5" font-family="Georgia, serif" font-style="italic">λ</tspan>)   ⇒   <tspan font-weight="700" fill="#1e40af"><tspan font-family="Georgia, serif" font-style="italic">z′</tspan> is distributed as <tspan font-family="Georgia, serif" font-style="italic">H</tspan><tspan baseline-shift="sub" font-size="10.5">0</tspan></tspan>
  </text>
  <circle cx="446" cy="422" r="5" fill="#059669"/>
  <text x="460" y="427" font-size="14.5" fill="#1e293b">
    If <tspan font-family="Georgia, serif" font-style="italic">z</tspan> ← <tspan font-family="Georgia, serif" font-style="italic">U</tspan><tspan baseline-shift="sub" font-size="10.5" font-family="Georgia, serif" font-style="italic">λ+1</tspan>   ⇒   <tspan font-weight="700" fill="#047857"><tspan font-family="Georgia, serif" font-style="italic">z′</tspan> is distributed as <tspan font-family="Georgia, serif" font-style="italic">H</tspan><tspan baseline-shift="sub" font-size="10.5">1</tspan></tspan>
  </text>
</svg>
