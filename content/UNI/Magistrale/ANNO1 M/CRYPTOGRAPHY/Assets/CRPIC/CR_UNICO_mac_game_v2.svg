<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 326" role="img" aria-labelledby="mg2-title mg2-desc" font-family="'Segoe UI', Arial, sans-serif">
  <title id="mg2-title">One-Time Statistical MAC Security Game</title>
  <desc id="mg2-desc">Interactive security game between an unbounded Adversary A and a Challenger C. Challenger samples a uniform key k in K. Step 1: Adversary queries a message m in M. Challenger computes tau = Tag(k, m). Step 2: Challenger returns tau. Step 3: Adversary outputs a forgery pair (m', tau') and wins iff m' != m and Tag(k, m') = tau'. One-time epsilon-statistical security requires Pr[A wins] &lt;= epsilon for every unbounded A.</desc>
  <defs>
    <marker id="mg2-arrow-indigo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 1L9 5L0 9Z" fill="#4338ca"/>
    </marker>
    <marker id="mg2-arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 1L9 5L0 9Z" fill="#2a9d8f"/>
    </marker>
    <marker id="mg2-arrow-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 1L9 5L0 9Z" fill="#e05a6d"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="798" height="324" rx="14" fill="#fcfbf8" stroke="#e7e2d9" stroke-width="1.5"/>

  <!-- Participant lifelines -->
  <line x1="164" y1="78" x2="164" y2="238" stroke="#d6d0c4" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="636" y1="78" x2="636" y2="238" stroke="#d6d0c4" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- Adversary header -->
  <rect x="44" y="22" width="240" height="56" rx="10" fill="#fbecee" stroke="#e05a6d" stroke-width="1.6"/>
  <text x="164" y="46" text-anchor="middle" font-size="15.5" font-weight="700" fill="#9f1239">
    Adversary <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">A</tspan>
  </text>
  <text x="164" y="65" text-anchor="middle" font-size="11.5" fill="#9f1239">
    computationally unbounded
  </text>

  <!-- Challenger header -->
  <rect x="516" y="22" width="240" height="56" rx="10" fill="#eef0fb" stroke="#4338ca" stroke-width="1.6"/>
  <text x="636" y="46" text-anchor="middle" font-size="15.5" font-weight="700" fill="#312e81">
    Challenger <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">C</tspan>
  </text>
  <text x="636" y="65" text-anchor="middle" font-size="11.5" fill="#4338ca">
    samples uniform <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">k</tspan> ∈ <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">K</tspan>
  </text>

  <!-- Step 1: Query m -->
  <path d="M164 114 H628" fill="none" stroke="#4338ca" stroke-width="2" marker-end="url(#mg2-arrow-indigo)"/>
  <rect x="316" y="100" width="168" height="28" rx="14" fill="#ffffff" stroke="#4338ca" stroke-width="1.3"/>
  <circle cx="332" cy="114" r="9.5" fill="#4338ca"/>
  <text x="332" y="118" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text>
  <text x="410" y="118.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#312e81">
    Query <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan> ∈ <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">M</tspan>
  </text>

  <!-- Challenger internal tag computation -->
  <rect x="554" y="132" width="164" height="24" rx="6" fill="#eef0fb" stroke="#c7d2fe" stroke-width="1.1"/>
  <text x="636" y="148" text-anchor="middle" font-size="12" font-weight="700" fill="#312e81">
    τ = Tag(<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">k</tspan>, <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan>)
  </text>

  <!-- Step 2: Return tau -->
  <path d="M636 174 H172" fill="none" stroke="#2a9d8f" stroke-width="2" marker-end="url(#mg2-arrow-teal)"/>
  <rect x="326" y="160" width="148" height="28" rx="14" fill="#ffffff" stroke="#2a9d8f" stroke-width="1.3"/>
  <circle cx="342" cy="174" r="9.5" fill="#2a9d8f"/>
  <text x="342" y="178" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text>
  <text x="412" y="178.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#115e59">
    Return tag τ
  </text>

  <!-- Step 3: Output forgery (m', tau') -->
  <path d="M164 220 H628" fill="none" stroke="#e05a6d" stroke-width="2" marker-end="url(#mg2-arrow-rose)"/>
  <rect x="306" y="206" width="188" height="28" rx="14" fill="#ffffff" stroke="#e05a6d" stroke-width="1.3"/>
  <circle cx="322" cy="220" r="9.5" fill="#e05a6d"/>
  <text x="322" y="224" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text>
  <text x="410" y="224.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9f1239">
    Output (<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan>', τ')
  </text>

  <!-- Bottom split verdict callouts -->
  <rect x="36" y="252" width="350" height="52" rx="7" fill="#fbecee"/>
  <rect x="36" y="252" width="4" height="52" rx="2" fill="#e05a6d"/>
  <text x="54" y="271" font-size="10" font-weight="700" letter-spacing="1.1" fill="#9f1239">
    WIN CONDITION FOR <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">A</tspan>
  </text>
  <text x="54" y="292" font-size="13.5" font-weight="700" fill="#9f1239">
    <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan>' ≠ <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan>    and    Tag(<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">k</tspan>, <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan>') = τ'
  </text>

  <rect x="414" y="252" width="350" height="52" rx="7" fill="#e6f4f1"/>
  <rect x="414" y="252" width="4" height="52" rx="2" fill="#2a9d8f"/>
  <text x="432" y="271" font-size="10" font-weight="700" letter-spacing="1.1" fill="#115e59">
    ONE-TIME ε-STATISTICAL SECURITY
  </text>
  <text x="432" y="292" font-size="13.5" font-weight="700" fill="#115e59">
    ∀ unbounded <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">A</tspan>:   Pr[<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">A</tspan> wins] ≤ ε
  </text>
</svg>
