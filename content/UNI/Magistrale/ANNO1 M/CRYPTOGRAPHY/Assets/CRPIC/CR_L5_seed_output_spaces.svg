<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 375" role="img" aria-labelledby="title desc" font-family="Segoe UI, Arial, sans-serif" fill="#0f172a">
  <title id="title">The output space is twice as large as the seed space</title>
  <desc id="desc">For a 1-bit stretch generator G from lambda bits to lambda plus 1 bits, there are 2^lambda seeds and 2^(lambda + 1) output strings. Thus G can reach at most half of the output space, leaving at least half unreachable, so an unbounded adversary checking membership in Im(G) achieves advantage at least 1/2.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1L9 5L0 9Z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="840" height="375" fill="#ffffff"/>

  <!-- Header -->
  <text x="420" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Why an unbounded adversary can distinguish: counting the spaces</text>
  <text x="420" y="57" text-anchor="middle" font-size="15" fill="#64748b">Even for 1-bit stretch <tspan font-family="Georgia, serif" font-style="italic">G</tspan> : {0, 1}<tspan baseline-shift="super" font-size="11" font-family="Georgia, serif" font-style="italic">λ</tspan> → {0, 1}<tspan baseline-shift="super" font-size="11" font-family="Georgia, serif" font-style="italic">λ+1</tspan>, the output space is twice as large</text>

  <!-- Left label + Seed space (height = 114 = half of 228) -->
  <text x="155" y="132" text-anchor="middle" font-size="16" font-weight="700" fill="#1e40af">Seed space {0, 1}<tspan baseline-shift="super" font-size="11.5" font-family="Georgia, serif" font-style="italic">λ</tspan></text>
  <rect x="42" y="144" width="226" height="114" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="155" y="196" text-anchor="middle" font-size="34" font-weight="700" fill="#1e3a8a">2<tspan baseline-shift="super" font-size="20" font-family="Georgia, serif" font-style="italic">λ</tspan></text>
  <text x="155" y="226" text-anchor="middle" font-size="14.5" fill="#334155">possible <tspan font-family="Georgia, serif" font-style="italic">λ</tspan>-bit seeds</text>
  <text x="155" y="246" text-anchor="middle" font-size="12.5" fill="#64748b">(1× reference size)</text>

  <!-- Mapping funnel from Seed space to upper half of Output space -->
  <path d="M268 152 C328 140, 355 98, 415 94" fill="none" stroke="#93c5fd" stroke-width="1.8" stroke-dasharray="5 4"/>
  <path d="M268 248 C328 240, 355 204, 415 200" fill="none" stroke="#93c5fd" stroke-width="1.8" stroke-dasharray="5 4"/>
  <path d="M270 198 C328 190, 356 152, 412 146" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <rect x="314" y="156" width="56" height="26" rx="13" fill="#ffffff" stroke="#93c5fd" stroke-width="1.4"/>
  <text x="342" y="174" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8"><tspan font-family="Georgia, serif" font-style="italic">G</tspan>(<tspan font-family="Georgia, serif" font-style="italic">s</tspan>)</text>

  <!-- Right label + Output space (height = 228 = 2 × 114) -->
  <text x="608" y="78" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Output space {0, 1}<tspan baseline-shift="super" font-size="11.5" font-family="Georgia, serif" font-style="italic">λ+1</tspan> — total size 2<tspan baseline-shift="super" font-size="11.5" font-family="Georgia, serif" font-style="italic">λ+1</tspan> = 2 · 2<tspan baseline-shift="super" font-size="11.5" font-family="Georgia, serif" font-style="italic">λ</tspan></text>

  <!-- Upper half: Reachable image -->
  <path d="M434 88 H782 Q796 88 796 102 V202 H420 V102 Q420 88 434 88 Z" fill="#ecfdf5"/>
  <!-- Lower half: Unreachable strings -->
  <path d="M420 202 H796 V302 Q796 316 782 316 H434 Q420 316 420 302 Z" fill="#fef2f2"/>
  <!-- Inner dashed region showing Im(G) may be even smaller if G has collisions -->
  <rect x="434" y="96" width="348" height="96" rx="10" fill="#d1fae5" fill-opacity="0.55" stroke="#10b981" stroke-width="1.4"/>
  <!-- 50% dividing line -->
  <line x1="420" y1="202" x2="796" y2="202" stroke="#475569" stroke-width="1.8" stroke-dasharray="7 5"/>
  <!-- Outer frame -->
  <rect x="420" y="88" width="376" height="228" rx="14" fill="none" stroke="#475569" stroke-width="2"/>

  <!-- Upper half text -->
  <text x="608" y="123" text-anchor="middle" font-size="16.5" font-weight="700" fill="#065f46">Reachable image Im(<tspan font-family="Georgia, serif" font-style="italic">G</tspan>)</text>
  <text x="608" y="148" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">At most 2<tspan baseline-shift="super" font-size="11" font-family="Georgia, serif" font-style="italic">λ</tspan> strings  (≤ ½ of output space)</text>
  <text x="608" y="174" text-anchor="middle" font-size="13.5" fill="#334155">Generated <tspan font-family="Georgia, serif" font-style="italic">z</tspan> always lands here  ⇒  <tspan font-family="Georgia, serif" font-style="italic">A</tspan>(<tspan font-family="Georgia, serif" font-style="italic">z</tspan>) = 1</text>

  <!-- 50% tag on right edge -->
  <rect x="716" y="191" width="70" height="21" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <text x="751" y="206" text-anchor="middle" font-size="11.5" font-weight="700" fill="#334155">½ bound</text>

  <!-- Lower half text -->
  <text x="608" y="238" text-anchor="middle" font-size="16.5" font-weight="700" fill="#991b1b">Unreachable strings</text>
  <text x="608" y="263" text-anchor="middle" font-size="15.5" font-weight="600" fill="#b91c1c">At least 2<tspan baseline-shift="super" font-size="11" font-family="Georgia, serif" font-style="italic">λ</tspan> strings  (≥ ½ of output space)</text>
  <text x="608" y="289" text-anchor="middle" font-size="13.5" fill="#334155">Never generated by <tspan font-family="Georgia, serif" font-style="italic">G</tspan>  ⇒  <tspan font-family="Georgia, serif" font-style="italic">A</tspan>(<tspan font-family="Georgia, serif" font-style="italic">z</tspan>) = 0 (World 1)</text>

  <!-- Footer pill -->
  <rect x="42" y="328" width="754" height="36" rx="9" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.4"/>
  <text x="419" y="351" text-anchor="middle" font-size="14.5" fill="#334155">
    Exhaustive search tests <tspan font-family="Georgia, serif" font-style="italic">z</tspan> ∈ Im(<tspan font-family="Georgia, serif" font-style="italic">G</tspan>):  <tspan font-weight="700" fill="#0f172a">Pr[<tspan font-family="Georgia, serif" font-style="italic">A</tspan>(<tspan font-family="Georgia, serif" font-style="italic">G</tspan>(<tspan font-family="Georgia, serif" font-style="italic">U</tspan><tspan baseline-shift="sub" font-size="10.5" font-family="Georgia, serif" font-style="italic">λ</tspan>)) = 1] = 1</tspan>  vs.  <tspan font-weight="700" fill="#0f172a">Pr[<tspan font-family="Georgia, serif" font-style="italic">A</tspan>(<tspan font-family="Georgia, serif" font-style="italic">U</tspan><tspan baseline-shift="sub" font-size="10.5" font-family="Georgia, serif" font-style="italic">λ+1</tspan>) = 1] ≤ ½</tspan>  ⇒  Adv ≥ ½
  </text>
</svg>
