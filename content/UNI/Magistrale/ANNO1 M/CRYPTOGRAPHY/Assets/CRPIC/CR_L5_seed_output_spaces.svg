<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 295" role="img" aria-labelledby="title desc">
  <title id="title">The output space is twice as large as the seed space</title>
  <desc id="desc">G maps 2^lambda seeds into a space of 2^(lambda+1) strings. Its image Im(G) contains at most 2^lambda strings, at most half of the output space; at least 2^lambda strings are never produced by G, and a uniform z lands there with probability at least 1/2.</desc>
  <style>
    svg { font-size: 18px; }
    text { font-family: 'Segoe UI', Arial, sans-serif; fill: #1e293b; }
    .m { font-family: 'Times New Roman', Times, serif; font-style: italic; }
    tspan.m { font-size: 1.12em; }
    tspan[baseline-shift] { font-size: 0.72em; }
    .small { font-size: 14px; fill: #475569; }
    .ln { fill: none; stroke: #3b6fd8; stroke-width: 1.8; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 1L9 5L0 9Z" fill="#3b6fd8"/>
    </marker>
    <clipPath id="out-clip">
      <rect x="420" y="50" width="300" height="200" rx="8"/>
    </clipPath>
  </defs>
  <rect width="760" height="295" rx="12" fill="#ffffff"/>

  <!-- Seed space (height 100 = half of output space, pastel blue) -->
  <text x="140" y="110" text-anchor="middle" font-weight="600" fill="#1e3a8a">Seeds {0, 1}<tspan class="m" baseline-shift="0.6em">λ</tspan></text>
  <rect x="40" y="125" width="200" height="100" rx="8" fill="#eef6ff" stroke="#60a5fa" stroke-width="1.7"/>
  <text x="140" y="173" text-anchor="middle" font-size="26" font-weight="600" fill="#1e3a8a">2<tspan class="m" baseline-shift="0.6em">λ</tspan></text>
  <text class="small" x="140" y="201" text-anchor="middle" fill="#3b5998">seeds</text>

  <!-- Mapping -->
  <path class="ln" d="M240 160 C300 160 330 100 418 100" marker-end="url(#ar)"/>
  <text class="m" x="318" y="118" text-anchor="middle" font-size="22" fill="#1e3a8a">G</text>

  <!-- Output space (height 200 = 2x seed space) -->
  <text x="570" y="30" text-anchor="middle" font-weight="600">Outputs {0, 1}<tspan class="m" baseline-shift="0.6em">λ+1</tspan>: 2<tspan class="m" baseline-shift="0.6em">λ+1</tspan> strings</text>
  <g clip-path="url(#out-clip)">
    <rect x="420" y="50" width="300" height="100" fill="#edfbf3"/>
    <rect x="420" y="150" width="300" height="100" fill="#fff1f2"/>
  </g>
  <line x1="420" y1="150" x2="720" y2="150" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="420" y="50" width="300" height="200" rx="8" fill="none" stroke="#64748b" stroke-width="1.7"/>

  <text x="570" y="92" text-anchor="middle" font-weight="600" fill="#14532d">Im(<tspan class="m">G</tspan>)</text>
  <text class="small" x="570" y="118" text-anchor="middle" fill="#2d6a4f">at most 2<tspan class="m" baseline-shift="0.6em">λ</tspan> strings (≤ half)</text>

  <text x="570" y="192" text-anchor="middle" font-weight="600" fill="#881337">never produced by <tspan class="m">G</tspan></text>
  <text class="small" x="570" y="218" text-anchor="middle" fill="#9f1239">at least 2<tspan class="m" baseline-shift="0.6em">λ</tspan> strings (≥ half)</text>

  <text class="small" x="570" y="278" text-anchor="middle">A uniform <tspan class="m">z</tspan> falls in the lower part with probability ≥ 1/2.</text>
</svg>
