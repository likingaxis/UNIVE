<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 230" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="title"><title id="title">The output space is twice as large as the seed space</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3b6487"/></marker></defs><rect width="800" height="230" fill="#ffffff"/><rect x="25" y="25" width="350" height="140" rx="12" fill="#eff6ff" stroke="#8ba3b7"/><rect x="425" y="25" width="350" height="140" rx="12" fill="#ecfdf5" stroke="#8ba3b7"/><text x="200" y="64" text-anchor="middle" font-size="23" fill="#172b42" font-weight="600">Possible seeds</text><text x="200" y="113" text-anchor="middle" font-size="32" fill="#172b42" font-weight="400">2^λ</text><text x="200" y="146" text-anchor="middle" font-size="18" fill="#172b42" font-weight="400">λ-bit input strings</text><text x="600" y="64" text-anchor="middle" font-size="23" fill="#172b42" font-weight="600">Possible output strings</text><text x="600" y="113" text-anchor="middle" font-size="32" fill="#172b42" font-weight="400">2^(λ + 1)</text><text x="600" y="146" text-anchor="middle" font-size="18" fill="#172b42" font-weight="400">(λ + 1)-bit strings</text><text x="400" y="205" text-anchor="middle" font-size="22" fill="#172b42" font-weight="400">G can reach at most half of the output space.</text></svg>