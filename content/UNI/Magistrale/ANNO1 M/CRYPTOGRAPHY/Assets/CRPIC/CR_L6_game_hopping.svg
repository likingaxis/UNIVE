<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 355" role="img" aria-labelledby="title desc" font-family="Segoe UI, Arial, sans-serif" fill="#0f172a">
  <title id="title">Game hopping proof of one-time security</title>
  <desc id="desc">Four-game chain from G_0 to G_1: G_0 is computationally indistinguishable from H_0 by PRG security, H_0 is identically distributed to H_1 by OTP perfect secrecy, and H_1 is computationally indistinguishable from G_1 by PRG security. By the triangle inequality, the total advantage between G_0 and G_1 is negligible.</desc>

  <rect width="900" height="355" fill="#ffffff"/>

  <!-- Header -->
  <text x="450" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Game hopping: bridging <tspan font-family="Georgia, serif" font-style="italic">G</tspan><tspan baseline-shift="sub" font-size="14">0</tspan> and <tspan font-family="Georgia, serif" font-style="italic">G</tspan><tspan baseline-shift="sub" font-size="14">1</tspan> through uniform OTP hybrids</text>
  <text x="450" y="57" text-anchor="middle" font-size="14.5" fill="#64748b">Two negligible computational hops flanking one exact information-theoretic equality</text>

  <!-- Card 1: G_0 (34..188) -->
  <rect x="34" y="84" width="154" height="122" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <rect x="52" y="96" width="118" height="22" rx="11" fill="#dbeafe"/>
  <text x="111" y="111" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e40af">REAL (b = 0)</text>
  <text x="111" y="152" text-anchor="middle" font-size="30" font-weight="700" fill="#1e3a8a"><tspan font-family="Georgia, serif" font-style="italic">G</tspan><tspan baseline-shift="sub" font-size="18">0</tspan></text>
  <text x="111" y="186" text-anchor="middle" font-size="16" font-weight="600" fill="#334155"><tspan font-family="Georgia, serif" font-style="italic">G</tspan>(<tspan font-family="Georgia, serif" font-style="italic">k</tspan>) ⊕ <tspan font-family="Georgia, serif" font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="11">0</tspan></text>

  <!-- Hop 1: ≈_c (center 224, gap 72) -->
  <text x="224" y="148" text-anchor="middle" font-size="28" font-weight="700" fill="#2563eb">≈<tspan baseline-shift="sub" font-size="16" font-family="Georgia, serif" font-style="italic">c</tspan></text>
  <rect x="180" y="218" width="88" height="40" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
  <text x="224" y="235" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">PRG security</text>
  <text x="224" y="251" text-anchor="middle" font-size="11.5" fill="#475569">≤ negl<tspan baseline-shift="sub" font-size="9">0</tspan>(<tspan font-family="Georgia, serif" font-style="italic">λ</tspan>)</text>

  <!-- Card 2: H_0 (260..414) -->
  <rect x="260" y="84" width="154" height="122" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="1.8"/>
  <rect x="278" y="96" width="118" height="22" rx="11" fill="#d1fae5"/>
  <text x="337" y="111" text-anchor="middle" font-size="11.5" font-weight="700" fill="#065f46">HYBRID (b = 0)</text>
  <text x="337" y="152" text-anchor="middle" font-size="30" font-weight="700" fill="#065f46"><tspan font-family="Georgia, serif" font-style="italic">H</tspan><tspan baseline-shift="sub" font-size="18">0</tspan></text>
  <text x="337" y="186" text-anchor="middle" font-size="16" font-weight="600" fill="#334155"><tspan font-family="Georgia, serif" font-style="italic">z</tspan> ⊕ <tspan font-family="Georgia, serif" font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="11">0</tspan></text>

  <!-- Hop 2: ≡ (center 450, gap 72) -->
  <text x="450" y="148" text-anchor="middle" font-size="30" font-weight="700" fill="#059669">≡</text>
  <rect x="406" y="218" width="88" height="40" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.2"/>
  <text x="450" y="235" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">OTP secrecy</text>
  <text x="450" y="251" text-anchor="middle" font-size="11.5" fill="#065f46">gap = 0</text>

  <!-- Card 3: H_1 (486..640) -->
  <rect x="486" y="84" width="154" height="122" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="1.8"/>
  <rect x="504" y="96" width="118" height="22" rx="11" fill="#d1fae5"/>
  <text x="563" y="111" text-anchor="middle" font-size="11.5" font-weight="700" fill="#065f46">HYBRID (b = 1)</text>
  <text x="563" y="152" text-anchor="middle" font-size="30" font-weight="700" fill="#065f46"><tspan font-family="Georgia, serif" font-style="italic">H</tspan><tspan baseline-shift="sub" font-size="18">1</tspan></text>
  <text x="563" y="186" text-anchor="middle" font-size="16" font-weight="600" fill="#334155"><tspan font-family="Georgia, serif" font-style="italic">z</tspan> ⊕ <tspan font-family="Georgia, serif" font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="11">1</tspan></text>

  <!-- Hop 3: ≈_c (center 676, gap 72) -->
  <text x="676" y="148" text-anchor="middle" font-size="28" font-weight="700" fill="#2563eb">≈<tspan baseline-shift="sub" font-size="16" font-family="Georgia, serif" font-style="italic">c</tspan></text>
  <rect x="632" y="218" width="88" height="40" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
  <text x="676" y="235" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">PRG security</text>
  <text x="676" y="251" text-anchor="middle" font-size="11.5" fill="#475569">≤ negl<tspan baseline-shift="sub" font-size="9">1</tspan>(<tspan font-family="Georgia, serif" font-style="italic">λ</tspan>)</text>

  <!-- Card 4: G_1 (712..866) -->
  <rect x="712" y="84" width="154" height="122" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <rect x="730" y="96" width="118" height="22" rx="11" fill="#dbeafe"/>
  <text x="789" y="111" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e40af">REAL (b = 1)</text>
  <text x="789" y="152" text-anchor="middle" font-size="30" font-weight="700" fill="#1e3a8a"><tspan font-family="Georgia, serif" font-style="italic">G</tspan><tspan baseline-shift="sub" font-size="18">1</tspan></text>
  <text x="789" y="186" text-anchor="middle" font-size="16" font-weight="600" fill="#334155"><tspan font-family="Georgia, serif" font-style="italic">G</tspan>(<tspan font-family="Georgia, serif" font-style="italic">k</tspan>) ⊕ <tspan font-family="Georgia, serif" font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="11">1</tspan></text>

  <!-- Triangle inequality footer -->
  <rect x="34" y="278" width="832" height="58" rx="11" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="450" y="302" text-anchor="middle" font-size="14.5" font-weight="600" fill="#0f172a">
    Triangle inequality:  |Pr[<tspan font-family="Georgia, serif" font-style="italic">G</tspan><tspan baseline-shift="sub" font-size="10.5">0</tspan> = 1] − Pr[<tspan font-family="Georgia, serif" font-style="italic">G</tspan><tspan baseline-shift="sub" font-size="10.5">1</tspan> = 1]|  ≤  |Pr[<tspan font-family="Georgia, serif" font-style="italic">G</tspan><tspan baseline-shift="sub" font-size="10.5">0</tspan> = 1] − Pr[<tspan font-family="Georgia, serif" font-style="italic">H</tspan><tspan baseline-shift="sub" font-size="10.5">0</tspan> = 1]| + 0 + |Pr[<tspan font-family="Georgia, serif" font-style="italic">H</tspan><tspan baseline-shift="sub" font-size="10.5">1</tspan> = 1] − Pr[<tspan font-family="Georgia, serif" font-style="italic">G</tspan><tspan baseline-shift="sub" font-size="10.5">1</tspan> = 1]|
  </text>
  <text x="450" y="324" text-anchor="middle" font-size="14" fill="#475569">
    Sum of two negligible functions is negligible  ⇒  <tspan font-weight="700" fill="#1e40af"><tspan font-family="Georgia, serif" font-style="italic">G</tspan><tspan baseline-shift="sub" font-size="10">0</tspan> ≈<tspan baseline-shift="sub" font-size="10" font-family="Georgia, serif" font-style="italic">c</tspan> <tspan font-family="Georgia, serif" font-style="italic">G</tspan><tspan baseline-shift="sub" font-size="10">1</tspan></tspan>
  </text>
</svg>
