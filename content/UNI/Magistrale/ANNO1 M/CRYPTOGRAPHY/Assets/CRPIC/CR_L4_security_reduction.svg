<svg font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-weight="430" data-d-component="svg" fill="currentColor" style="color:rgb(31, 41, 55)" viewBox="0 0 340 254" width="100%" xmlns="http://www.w3.org/2000/svg"><title>Security reduction: from an efficient attacker to an efficient factoring algorithm</title><rect width="340" height="254" fill="#ffffff"/><rect x="38" y="10" width="264" height="49" rx="9" fill="#DCEAFE"/><text x="170" y="30" fill="#1E40AF" text-anchor="middle" font-size="13" font-weight="600">Adversary A</text><text x="170" y="45" fill="#1E40AF" text-anchor="middle" font-size="11">Efficiently breaks scheme Π</text><path d="M170 59 V89" stroke="currentColor" stroke-width="2" fill="none"/><path d="M164 83 L170 90 L176 83" fill="none" stroke="currentColor" stroke-width="2"/><rect x="38" y="92" width="264" height="57" rx="9" fill="#EDE9FE"/><text x="170" y="113" fill="#6D28D9" text-anchor="middle" font-size="13" font-weight="600">Reduction B</text><text x="170" y="130" fill="#6D28D9" text-anchor="middle" font-size="11">Uses A as a subroutine</text><path d="M170 149 V179" stroke="currentColor" stroke-width="2" fill="none"/><path d="M164 173 L170 180 L176 173" fill="none" stroke="currentColor" stroke-width="2"/><rect x="38" y="183" width="264" height="56" rx="9" fill="#DCF4E7"/><text x="170" y="205" fill="#166534" text-anchor="middle" font-size="13" font-weight="600">Efficient factoring algorithm</text><text x="170" y="222" fill="#166534" text-anchor="middle" font-size="11">Contradicts the hardness assumption</text></svg>