<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 455" role="img" aria-labelledby="title desc" font-family="Segoe UI, Arial, sans-serif" fill="#0f172a">
  <title id="title">One-time encryption security worlds</title>
  <desc id="desc">PPT adversary A chooses two equal-length messages m_0 and m_1. In Game 0 (b = 0) the challenger samples k uniformly and sends Enc(k, m_0); in Game 1 (b = 1) it sends Enc(k, m_1). A outputs a bit b prime, and security requires the probabilities of outputting 1 in the two games to differ by at most negl(lambda).</desc>
  <defs>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 1L9 5L0 9Z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="860" height="455" fill="#ffffff"/>

  <!-- Header -->
  <text x="430" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">One-time computational security: two possible worlds</text>
  <text x="430" y="57" text-anchor="middle" font-size="14.5" fill="#64748b">The adversary chooses <tspan font-family="Georgia, serif" font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="10.5">0</tspan>, <tspan font-family="Georgia, serif" font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="10.5">1</tspan> of equal length and receives one ciphertext <tspan font-family="Georgia, serif" font-style="italic">c</tspan> = Enc(<tspan font-family="Georgia, serif" font-style="italic">k</tspan>, <tspan font-family="Georgia, serif" font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="10.5" font-family="Georgia, serif" font-style="italic">b</tspan>)</text>

  <!-- Top: Adversary chooses messages -->
  <rect x="190" y="76" width="480" height="62" rx="13" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.8"/>
  <text x="430" y="102" text-anchor="middle" font-size="17.5" font-weight="700" fill="#6d28d9">PPT Adversary <tspan font-family="Georgia, serif" font-style="italic">A</tspan> (phase 1)</text>
  <text x="430" y="125" text-anchor="middle" font-size="14.5" fill="#334155">Chooses <tspan font-family="Georgia, serif" font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="10.5">0</tspan>, <tspan font-family="Georgia, serif" font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="10.5">1</tspan> ∈ <tspan font-family="Georgia, serif" font-style="italic">M</tspan> with |<tspan font-family="Georgia, serif" font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="10.5">0</tspan>| = |<tspan font-family="Georgia, serif" font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="10.5">1</tspan>|</text>

  <!-- Split connector from A down to World 0 and World 1 -->
  <path d="M430 138 V158" fill="none" stroke="#64748b" stroke-width="2.2"/>
  <path d="M215 178 V166 Q215 158 223 158 H637 Q645 158 645 166 V178" fill="none" stroke="#64748b" stroke-width="2.2"/>
  <path d="M215 170 V182" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow-slate)"/>
  <path d="M645 170 V182" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow-slate)"/>
  <rect x="374" y="145" width="112" height="24" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="430" y="162" text-anchor="middle" font-size="13.5" font-weight="600" fill="#334155">send (<tspan font-family="Georgia, serif" font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="10">0</tspan>, <tspan font-family="Georgia, serif" font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="10">1</tspan>)</text>

  <!-- Game 0 card -->
  <rect x="45" y="186" width="340" height="114" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.8"/>
  <rect x="64" y="200" width="54" height="24" rx="12" fill="#1d4ed8"/>
  <text x="91" y="217" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff"><tspan font-family="Georgia, serif" font-style="italic">b</tspan> = 0</text>
  <text x="232" y="218" text-anchor="middle" font-size="19" font-weight="700" fill="#1e40af">Game<tspan baseline-shift="sub" font-size="12">0</tspan> (encrypt <tspan font-family="Georgia, serif" font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="12">0</tspan>)</text>
  <text x="215" y="254" text-anchor="middle" font-size="18.5" fill="#0f172a"><tspan font-family="Georgia, serif" font-style="italic">k</tspan> ← <tspan font-family="Georgia, serif" font-style="italic">K</tspan></text>
  <text x="215" y="283" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a"><tspan font-family="Georgia, serif" font-style="italic">c</tspan> = Enc(<tspan font-family="Georgia, serif" font-style="italic">k</tspan>, <tspan font-family="Georgia, serif" font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="13">0</tspan>)</text>

  <!-- Center "or" pill -->
  <rect x="412" y="229" width="36" height="28" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="430" y="248" text-anchor="middle" font-size="13.5" font-weight="600" fill="#64748b">or</text>

  <!-- Game 1 card -->
  <rect x="475" y="186" width="340" height="114" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.8"/>
  <rect x="494" y="200" width="54" height="24" rx="12" fill="#047857"/>
  <text x="521" y="217" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff"><tspan font-family="Georgia, serif" font-style="italic">b</tspan> = 1</text>
  <text x="662" y="218" text-anchor="middle" font-size="19" font-weight="700" fill="#065f46">Game<tspan baseline-shift="sub" font-size="12">1</tspan> (encrypt <tspan font-family="Georgia, serif" font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="12">1</tspan>)</text>
  <text x="645" y="254" text-anchor="middle" font-size="18.5" fill="#0f172a"><tspan font-family="Georgia, serif" font-style="italic">k</tspan> ← <tspan font-family="Georgia, serif" font-style="italic">K</tspan></text>
  <text x="645" y="283" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a"><tspan font-family="Georgia, serif" font-style="italic">c</tspan> = Enc(<tspan font-family="Georgia, serif" font-style="italic">k</tspan>, <tspan font-family="Georgia, serif" font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="13">1</tspan>)</text>

  <!-- Merge connector down to A phase 2 -->
  <path d="M215 300 V316 Q215 324 223 324 H637 Q645 324 645 316 V300" fill="none" stroke="#64748b" stroke-width="2.2"/>
  <path d="M430 324 V350" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow-slate)"/>
  <rect x="387" y="311" width="86" height="24" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="430" y="328" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">send <tspan font-family="Georgia, serif" font-style="italic">c</tspan></text>

  <!-- Bottom: Adversary phase 2 -->
  <rect x="220" y="354" width="420" height="48" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.8"/>
  <text x="430" y="384" text-anchor="middle" font-size="16.5" font-weight="700" fill="#6d28d9"><tspan font-family="Georgia, serif" font-style="italic">A</tspan>(<tspan font-family="Georgia, serif" font-style="italic">c</tspan>) outputs bit <tspan font-family="Georgia, serif" font-style="italic">b′</tspan> ∈ {0, 1}</text>

  <!-- Footer -->
  <rect x="45" y="414" width="770" height="32" rx="9" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.4"/>
  <text x="430" y="435" text-anchor="middle" font-size="14" fill="#334155">
    Security:  |<tspan font-weight="700" fill="#0f172a">Pr[Game<tspan baseline-shift="sub" font-size="10">0</tspan> = 1] − Pr[Game<tspan baseline-shift="sub" font-size="10">1</tspan> = 1]</tspan>| ≤ negl(<tspan font-family="Georgia, serif" font-style="italic">λ</tspan>)   (equivalently, Game<tspan baseline-shift="sub" font-size="10">0</tspan> ≈<tspan baseline-shift="sub" font-size="10" font-family="Georgia, serif" font-style="italic">c</tspan> Game<tspan baseline-shift="sub" font-size="10">1</tspan>)
  </text>
</svg>
