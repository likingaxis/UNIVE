<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" role="img" aria-labelledby="mac-model-title mac-model-desc" font-family="'Segoe UI', Arial, sans-serif">
  <title id="mac-model-title">Message Authentication Code (MAC) Integrity Model</title>
  <desc id="mac-model-desc">Alice and Bob share secret key k. Alice computes tag tau = Tag(k, m) and sends (m, tau) in the clear. Eve observes the channel and may tamper with the pair, producing (m', tau'). Bob computes Tag(k, m') using k and checks Tag(k, m') = tau', outputting Accept or Reject.</desc>
  <defs>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 1L9 5L0 9Z" fill="#57534e"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 1L9 5L0 9Z" fill="#2a9d8f"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 1L9 5L0 9Z" fill="#e05a6d"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="798" height="308" rx="14" fill="#fcfbf8" stroke="#e7e2d9" stroke-width="1.5"/>

  <!-- Connectors behind boxes -->
  <!-- Shared key k -> Alice & Bob -->
  <path d="M295 196 H136 V180" fill="none" stroke="#2a9d8f" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-green)"/>
  <path d="M505 196 H638 V180" fill="none" stroke="#2a9d8f" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-green)"/>

  <!-- Channel Alice -> Bob -->
  <path d="M238 134 H556" fill="none" stroke="#57534e" stroke-width="2.4" marker-end="url(#arrow-slate)"/>

  <!-- Eve taps/modifies channel -->
  <path d="M400 72 V114" fill="none" stroke="#e05a6d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-red)"/>

  <!-- Bob -> Verification check (clean route below key box) -->
  <path d="M694 174 V226 H400 V238" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#arrow-slate)"/>

  <!-- Verification check -> Accept / Reject -->
  <path d="M298 266 H214" fill="none" stroke="#2a9d8f" stroke-width="2.2" marker-end="url(#arrow-green)"/>
  <path d="M502 266 H586" fill="none" stroke="#e05a6d" stroke-width="2.2" marker-end="url(#arrow-red)"/>

  <!-- Eve box (top center) -->
  <rect x="276" y="16" width="248" height="56" rx="10" fill="#fbecee" stroke="#e05a6d" stroke-width="1.8"/>
  <text x="400" y="39" text-anchor="middle" font-size="15.5" font-weight="700" fill="#9f1239">Eve</text>
  <text x="400" y="59" text-anchor="middle" font-size="12.5" fill="#9f1239">
    observes (<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan>, τ); may alter to (<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan>', τ')
  </text>

  <!-- Channel labels -->
  <rect x="256" y="119" width="108" height="28" rx="14" fill="#57534e"/>
  <text x="310" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">
    (<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan>, τ) public
  </text>

  <rect x="430" y="119" width="112" height="28" rx="14" fill="#fbecee" stroke="#e05a6d" stroke-width="1.4"/>
  <text x="486" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#9f1239">
    arrives (<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan>', τ')
  </text>

  <!-- Alice box -->
  <rect x="34" y="94" width="204" height="80" rx="12" fill="#eef0fb" stroke="#4338ca" stroke-width="2"/>
  <text x="136" y="124" text-anchor="middle" font-size="17" font-weight="700" fill="#312e81">Alice</text>
  <text x="136" y="152" text-anchor="middle" font-size="14" font-weight="600" fill="#4338ca">
    τ = Tag(<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">k</tspan>, <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan>)
  </text>

  <!-- Bob box -->
  <rect x="562" y="94" width="204" height="80" rx="12" fill="#eef0fb" stroke="#4338ca" stroke-width="2"/>
  <text x="664" y="124" text-anchor="middle" font-size="17" font-weight="700" fill="#312e81">Bob</text>
  <text x="664" y="152" text-anchor="middle" font-size="14" font-weight="600" fill="#4338ca">
    Compute Tag(<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">k</tspan>, <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan>')
  </text>

  <!-- Shared secret key -->
  <rect x="295" y="176" width="210" height="40" rx="10" fill="#e6f4f1" stroke="#2a9d8f" stroke-width="1.8"/>
  <text x="400" y="201" text-anchor="middle" font-size="14" font-weight="600" fill="#115e59">
    Shared secret key <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="700">k</tspan>
  </text>

  <!-- Verification check box -->
  <rect x="298" y="244" width="204" height="44" rx="10" fill="#f5f4ef" stroke="#57534e" stroke-width="1.8"/>
  <text x="400" y="271" text-anchor="middle" font-size="14" font-weight="700" fill="#1f1d1a">
    Tag(<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">k</tspan>, <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan>') = τ' ?
  </text>

  <!-- Accept / Reject outcomes -->
  <rect x="34" y="244" width="174" height="44" rx="10" fill="#e6f4f1" stroke="#2a9d8f" stroke-width="1.8"/>
  <text x="121" y="271" text-anchor="middle" font-size="13.5" font-weight="700" fill="#115e59">
    Yes → Accept <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan>'
  </text>

  <rect x="592" y="244" width="174" height="44" rx="10" fill="#fbecee" stroke="#e05a6d" stroke-width="1.8"/>
  <text x="679" y="271" text-anchor="middle" font-size="13.5" font-weight="700" fill="#9f1239">
    No → Reject
  </text>
</svg>
