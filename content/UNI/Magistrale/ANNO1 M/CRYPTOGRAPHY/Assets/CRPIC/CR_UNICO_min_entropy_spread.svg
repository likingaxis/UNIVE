<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 272" role="img" aria-labelledby="me-title me-desc" font-family="Segoe UI, Arial, sans-serif">
  <title id="me-title">Min-Entropy Is Whole-String Unpredictability</title>
  <desc id="me-desc">A 32-bit uniform block R repeated four times gives a 128-bit string X = R || R || R || R. Even though X has 128 bits and no bit is fixed to a constant, its min-entropy is 32 bits and the single-try guessing probability is 2^-32.</desc>
  <defs>
    <marker id="me-arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 1L9 5L0 9Z" fill="#3b82f6"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="638" height="270" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Connectors from R to 4 copies -->
  <path d="M320 68 V84" fill="none" stroke="#3b82f6" stroke-width="1.8"/>
  <path d="M96 84 H544" fill="none" stroke="#3b82f6" stroke-width="1.8"/>
  <path d="M96 84 V101" fill="none" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#me-arrow-blue)"/>
  <path d="M245 84 V101" fill="none" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#me-arrow-blue)"/>
  <path d="M395 84 V101" fill="none" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#me-arrow-blue)"/>
  <path d="M544 84 V101" fill="none" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#me-arrow-blue)"/>

  <!-- Top block R -->
  <rect x="180" y="18" width="280" height="50" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.7"/>
  <text x="320" y="40" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e3a8a">
    Uniform block <tspan font-family="Georgia, serif" font-style="italic">R</tspan> ∈ {0, 1}<tspan baseline-shift="super" font-size="10">32</tspan>
  </text>
  <text x="320" y="58" text-anchor="middle" font-size="12" fill="#1e40af">
    32 random bits (copied 4 times)
  </text>

  <!-- 4 repeated R blocks (width 132, centers 96, 245, 395, 544) -->
  <rect x="30" y="106" width="132" height="56" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
  <text x="96" y="133" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="18" font-weight="700" fill="#065f46">R</text>
  <text x="96" y="152" text-anchor="middle" font-size="12" fill="#047857">32 bits (copy 1)</text>

  <rect x="179" y="106" width="132" height="56" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
  <text x="245" y="133" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="18" font-weight="700" fill="#065f46">R</text>
  <text x="245" y="152" text-anchor="middle" font-size="12" fill="#047857">32 bits (copy 2)</text>

  <rect x="329" y="106" width="132" height="56" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
  <text x="395" y="133" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="18" font-weight="700" fill="#065f46">R</text>
  <text x="395" y="152" text-anchor="middle" font-size="12" fill="#047857">32 bits (copy 3)</text>

  <rect x="478" y="106" width="132" height="56" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
  <text x="544" y="133" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="18" font-weight="700" fill="#065f46">R</text>
  <text x="544" y="152" text-anchor="middle" font-size="12" fill="#047857">32 bits (copy 4)</text>

  <!-- Brace label for 128-bit output -->
  <path d="M30 170 V180 H185" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
  <path d="M455 180 H610 V170" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="320" y="185" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">
    <tspan font-family="Georgia, serif" font-style="italic">X</tspan> = <tspan font-family="Georgia, serif" font-style="italic">R</tspan> ‖ <tspan font-family="Georgia, serif" font-style="italic">R</tspan> ‖ <tspan font-family="Georgia, serif" font-style="italic">R</tspan> ‖ <tspan font-family="Georgia, serif" font-style="italic">R</tspan>  (128-bit string)
  </text>

  <!-- Summary footer bar -->
  <rect x="30" y="202" width="580" height="52" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="320" y="224" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">
    Length: 128 bits   ·   <tspan font-family="Georgia, serif" font-style="italic">H</tspan><tspan baseline-shift="sub" font-size="9.5">∞</tspan>(<tspan font-family="Georgia, serif" font-style="italic">X</tspan>) = 32 bits   ·   <tspan font-family="Georgia, serif" font-style="italic">p</tspan><tspan baseline-shift="sub" font-size="9.5">guess</tspan> = 2<tspan baseline-shift="super" font-size="9.5">−32</tspan>
  </text>
  <text x="320" y="244" text-anchor="middle" font-size="12" fill="#475569">
    No bit position is constant; all 128 bits are determined by the same 32-bit block <tspan font-family="Georgia, serif" font-style="italic">R</tspan>.
  </text>
</svg>
