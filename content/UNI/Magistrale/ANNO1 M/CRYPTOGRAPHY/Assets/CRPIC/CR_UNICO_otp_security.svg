<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 296" role="img" aria-labelledby="otp2-title otp2-desc" font-family="'Segoe UI', Arial, sans-serif">
  <title id="otp2-title">One-Time Pad: Fresh Key vs. Key Reused Twice</title>
  <desc id="otp2-desc">Left panel: using a fresh uniform key K in {0,1}^l gives Pr[Enc(K,m)=c] = 2^-l independently of m, satisfying Theorem 1.1(iii) and achieving perfect secrecy. Right panel: reusing the same key k for two messages m1 and m2 lets Eve compute c1 XOR c2 = m1 XOR m2, breaking secrecy.</desc>

  <rect x="1" y="1" width="798" height="294" rx="14" fill="#fcfbf8" stroke="#e7e2d9" stroke-width="1.5"/>

  <!-- Scope brackets -->
  <path d="M32 42 V28 H82" fill="none" stroke="#2a9d8f" stroke-width="1.5"/>
  <path d="M332 28 H382 V42" fill="none" stroke="#2a9d8f" stroke-width="1.5"/>
  <text x="207" y="32" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing="1.1" fill="#115e59">
    FRESH KEY <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">k</tspan> · SECURE ✓
  </text>

  <path d="M418 42 V28 H468" fill="none" stroke="#e05a6d" stroke-width="1.5"/>
  <path d="M718 28 H768 V42" fill="none" stroke="#e05a6d" stroke-width="1.5"/>
  <text x="593" y="32" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing="1.1" fill="#9f1239">
    KEY REUSED TWICE · BROKEN ✕
  </text>

  <!-- Vertical divider -->
  <line x1="400" y1="50" x2="400" y2="274" stroke="#e7e2d9" stroke-width="1.2"/>

  <!-- ==================== LEFT: FRESH KEY ==================== -->
  <rect x="32" y="54" width="348" height="58" rx="9" fill="#ffffff" stroke="#d6d0c4" stroke-width="1.4"/>
  <text x="206" y="76" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f1d1a">
    Uniform <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">K</tspan> ∈ {0, 1}<tspan baseline-shift="super" font-size="9">ℓ</tspan>
  </text>
  <text x="206" y="98" text-anchor="middle" font-size="12" fill="#57534e">
    Enc(<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">k</tspan>, <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan>) = <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">k</tspan> ⊕ <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan>    |    Dec(<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">k</tspan>, <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">c</tspan>) = <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">k</tspan> ⊕ <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">c</tspan>
  </text>

  <rect x="32" y="124" width="348" height="74" rx="9" fill="#eef0fb" stroke="#4338ca" stroke-width="1.3"/>
  <text x="206" y="148" text-anchor="middle" font-size="12.5" font-weight="700" fill="#312e81">
    Single encryption <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">c</tspan> = <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">K</tspan> ⊕ <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan>:
  </text>
  <text x="206" y="174" text-anchor="middle" font-size="13" font-weight="700" fill="#4338ca">
    Pr[Enc(<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">K</tspan>, <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan>) = <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">c</tspan>] = Pr[<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">K</tspan> = <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">c</tspan> ⊕ <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan>] = 2<tspan baseline-shift="super" font-size="9">−ℓ</tspan>
  </text>

  <rect x="32" y="212" width="348" height="58" rx="7" fill="#e6f4f1"/>
  <rect x="32" y="212" width="4" height="58" rx="2" fill="#2a9d8f"/>
  <text x="52" y="236" font-size="13" font-weight="700" fill="#115e59">
    Independent of <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan>   ✓
  </text>
  <text x="52" y="256" font-size="11.8" fill="#1f6f66">
    Theorem 1.1(iii) holds  ⇒  Perfect Secrecy
  </text>

  <!-- ==================== RIGHT: REUSED KEY ==================== -->
  <rect x="420" y="54" width="348" height="58" rx="9" fill="#ffffff" stroke="#d6d0c4" stroke-width="1.4"/>
  <text x="594" y="76" text-anchor="middle" font-size="13.5" font-weight="700" fill="#9f1239">
    Same key <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">k</tspan> used twice
  </text>
  <text x="594" y="98" text-anchor="middle" font-size="12.5" fill="#57534e">
    <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">c</tspan><tspan baseline-shift="sub" font-size="9">1</tspan> = <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">k</tspan> ⊕ <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="9">1</tspan>     and     <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">c</tspan><tspan baseline-shift="sub" font-size="9">2</tspan> = <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">k</tspan> ⊕ <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="9">2</tspan>
  </text>

  <rect x="420" y="124" width="348" height="74" rx="9" fill="#fdf3dc" stroke="#c98a0b" stroke-width="1.3"/>
  <text x="594" y="148" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92600a">
    Eve intercepts both and computes <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">c</tspan><tspan baseline-shift="sub" font-size="9">1</tspan> ⊕ <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">c</tspan><tspan baseline-shift="sub" font-size="9">2</tspan>:
  </text>
  <text x="594" y="174" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92600a">
    (<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">k</tspan> ⊕ <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">k</tspan>) ⊕ (<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="9">1</tspan> ⊕ <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="9">2</tspan>) = 0<tspan baseline-shift="super" font-size="9">ℓ</tspan> ⊕ (<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="9">1</tspan> ⊕ <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="9">2</tspan>)
  </text>

  <rect x="420" y="212" width="348" height="58" rx="7" fill="#fbecee"/>
  <rect x="420" y="212" width="4" height="58" rx="2" fill="#e05a6d"/>
  <text x="440" y="236" font-size="13" font-weight="700" fill="#9f1239">
    Key cancels:  <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">c</tspan><tspan baseline-shift="sub" font-size="9">1</tspan> ⊕ <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">c</tspan><tspan baseline-shift="sub" font-size="9">2</tspan> = <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="9">1</tspan> ⊕ <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="9">2</tspan>   ✕
  </text>
  <text x="440" y="256" font-size="11.8" fill="#9f1239">
    Leaks plaintext relation  ⇒  Secrecy broken
  </text>
</svg>
