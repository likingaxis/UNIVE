<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 275" role="img" aria-labelledby="game-title game-desc" font-family="'Segoe UI', Arial, sans-serif">
  <title id="game-title">Game-Based Perfect Secrecy Experiment</title>
  <desc id="game-desc">Interactive experiment GAME_A(b, m0, m1) between Adversary A and Challenger C. Challenger samples uniform key K, encrypts m_b into c = Enc(K, m_b), and sends c to Adversary A, who outputs bit b' in {0,1}. Perfect secrecy requires zero distinguishing advantage between Game 0 and Game 1.</desc>
  <defs>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 1L9 5L0 9Z" fill="#57534e"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 1L9 5L0 9Z" fill="#e05a6d"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="778" height="273" rx="14" fill="#fcfbf8" stroke="#e7e2d9" stroke-width="1.5"/>

  <text x="390" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#1f1d1a">
    Indistinguishability Experiment: GAME<tspan baseline-shift="sub" font-size="11" font-family="Georgia, 'Times New Roman', serif" font-style="italic">A</tspan>(<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">b</tspan>, <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="11">0</tspan>, <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="11">1</tspan>)
  </text>

  <!-- Protocol arrows (drawn behind labels) -->
  <path d="M524 102 H260" fill="none" stroke="#57534e" stroke-width="2.4" marker-end="url(#arrow-slate)"/>
  <path d="M254 162 H518" fill="none" stroke="#e05a6d" stroke-width="2.4" marker-end="url(#arrow-red)"/>

  <!-- Arrow labels -->
  <rect x="314" y="72" width="152" height="24" rx="12" fill="#f5f4ef" stroke="#d6d0c4" stroke-width="1.3"/>
  <text x="390" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#1f1d1a">
    <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">c</tspan> = Enc(<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">K</tspan>, <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="9.5" font-style="italic">b</tspan>)
  </text>

  <rect x="322" y="170" width="136" height="24" rx="12" fill="#fbecee" stroke="#eca3ae" stroke-width="1.3"/>
  <text x="390" y="186" text-anchor="middle" font-size="13" font-weight="600" fill="#9f1239">
    guess <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">b</tspan>' ∈ {0, 1}
  </text>

  <!-- Adversary A -->
  <rect x="34" y="60" width="220" height="136" rx="12" fill="#fbecee" stroke="#e05a6d" stroke-width="2"/>
  <text x="144" y="90" text-anchor="middle" font-size="17" font-weight="700" fill="#9f1239">
    Adversary <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">A</tspan>
  </text>
  <text x="144" y="116" text-anchor="middle" font-size="13" fill="#881337">
    Knows <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="9.5">0</tspan>, <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="9.5">1</tspan> ∈ <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">M</tspan>
  </text>
  <text x="144" y="142" text-anchor="middle" font-size="12.5" fill="#881337">
    Receives ciphertext <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">c</tspan>
  </text>
  <text x="144" y="168" text-anchor="middle" font-size="12.5" font-weight="600" fill="#9f1239">
    Outputs bit <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">b</tspan>' ∈ {0, 1}
  </text>

  <!-- Challenger C -->
  <rect x="524" y="60" width="220" height="136" rx="12" fill="#eef0fb" stroke="#4338ca" stroke-width="2"/>
  <text x="634" y="90" text-anchor="middle" font-size="17" font-weight="700" fill="#312e81">
    Challenger <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">C</tspan>
  </text>
  <text x="634" y="116" text-anchor="middle" font-size="13" fill="#4338ca">
    Challenge bit <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">b</tspan> ∈ {0, 1}
  </text>
  <text x="634" y="142" text-anchor="middle" font-size="13" fill="#4338ca">
    Sample uniform key <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">K</tspan>
  </text>
  <text x="634" y="168" text-anchor="middle" font-size="12.5" font-weight="600" fill="#312e81">
    Encrypt <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="9.5" font-style="italic">b</tspan> with <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">K</tspan>
  </text>

  <!-- Bottom condition -->
  <rect x="82" y="216" width="616" height="40" rx="10" fill="#e6f4f1" stroke="#2a9d8f" stroke-width="1.6"/>
  <text x="390" y="241" text-anchor="middle" font-size="13.5" font-weight="700" fill="#115e59">
    Perfect Secrecy ⇔ ∀<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">A</tspan>, ∀<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="9.5">0</tspan>,<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="9.5">1</tspan>:  |Pr[<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">b</tspan>'=1 : GAME<tspan baseline-shift="sub" font-size="9.5" font-style="italic">A</tspan>(0)] − Pr[<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">b</tspan>'=1 : GAME<tspan baseline-shift="sub" font-size="9.5" font-style="italic">A</tspan>(1)]| = 0
  </text>
</svg>
