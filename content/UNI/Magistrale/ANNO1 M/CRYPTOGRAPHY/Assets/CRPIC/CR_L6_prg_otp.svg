<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" role="img" aria-labelledby="title desc" font-family="Segoe UI, Arial, sans-serif" fill="#0f172a">
  <title id="title">PRG-OTP construction</title>
  <desc id="desc">A uniformly sampled n-bit secret key k is expanded by a secure PRG G into a 2n-bit pseudorandom pad G(k), then XORed with a 2n-bit message m to produce ciphertext c. Decryption applies the same pad G(k) to c. Reusing the key leaks m1 XOR m2.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 1L9 5L0 9Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 1L9 5L0 9Z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="860" height="400" fill="#ffffff"/>

  <!-- Header -->
  <text x="430" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">PRG-OTP: beating Shannon's key-length barrier computationally</text>
  <text x="430" y="57" text-anchor="middle" font-size="14.5" fill="#64748b">Expand a short <tspan font-family="Georgia, serif" font-style="italic">n</tspan>-bit key via a deterministic PRG <tspan font-family="Georgia, serif" font-style="italic">G</tspan> into a 2<tspan font-family="Georgia, serif" font-style="italic">n</tspan>-bit pseudorandom pad, then XOR</text>

  <!-- Row 1: Key -> PRG -> Pad -->
  <rect x="40" y="84" width="185" height="74" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="132" y="114" text-anchor="middle" font-size="18.5" font-weight="700" fill="#1e40af">Secret key <tspan font-family="Georgia, serif" font-style="italic">k</tspan></text>
  <text x="132" y="140" text-anchor="middle" font-size="14" fill="#334155"><tspan font-family="Georgia, serif" font-style="italic">k</tspan> ← <tspan font-family="Georgia, serif" font-style="italic">U</tspan><tspan baseline-shift="sub" font-size="10.5" font-family="Georgia, serif" font-style="italic">n</tspan> (<tspan font-family="Georgia, serif" font-style="italic">n</tspan> bits)</text>

  <path d="M225 121 H284" fill="none" stroke="#2563eb" stroke-width="2.3" marker-end="url(#arrow-blue)"/>

  <rect x="288" y="84" width="190" height="74" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="383" y="114" text-anchor="middle" font-size="19" font-weight="700" fill="#1e3a8a">PRG <tspan font-family="Georgia, serif" font-style="italic">G</tspan></text>
  <text x="383" y="140" text-anchor="middle" font-size="14" fill="#1e40af">{0, 1}<tspan baseline-shift="super" font-size="10.5" font-family="Georgia, serif" font-style="italic">n</tspan> → {0, 1}<tspan baseline-shift="super" font-size="10.5">2<tspan font-family="Georgia, serif" font-style="italic">n</tspan></tspan></text>

  <path d="M478 121 H538" fill="none" stroke="#2563eb" stroke-width="2.3" marker-end="url(#arrow-blue)"/>

  <rect x="542" y="84" width="220" height="74" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.8"/>
  <text x="652" y="114" text-anchor="middle" font-size="18.5" font-weight="700" fill="#065f46">Pad <tspan font-family="Georgia, serif" font-style="italic">G</tspan>(<tspan font-family="Georgia, serif" font-style="italic">k</tspan>)</text>
  <text x="652" y="140" text-anchor="middle" font-size="14" fill="#047857">2<tspan font-family="Georgia, serif" font-style="italic">n</tspan> pseudorandom bits</text>

  <!-- Vertical drop from Pad into XOR -->
  <path d="M652 158 V199" fill="none" stroke="#2563eb" stroke-width="2.3" marker-end="url(#arrow-blue)"/>

  <!-- Row 2: Message -> XOR -> Ciphertext -->
  <rect x="288" y="196" width="190" height="68" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="383" y="224" text-anchor="middle" font-size="18.5" font-weight="700" fill="#0f172a">Message <tspan font-family="Georgia, serif" font-style="italic">m</tspan></text>
  <text x="383" y="248" text-anchor="middle" font-size="14" fill="#475569">2<tspan font-family="Georgia, serif" font-style="italic">n</tspan> bits (longer than <tspan font-family="Georgia, serif" font-style="italic">k</tspan>)</text>

  <path d="M478 230 H619" fill="none" stroke="#475569" stroke-width="2.3" marker-end="url(#arrow-slate)"/>

  <circle cx="652" cy="230" r="27" fill="#ffffff" stroke="#2563eb" stroke-width="2.4"/>
  <text x="652" y="239" text-anchor="middle" font-size="30" font-weight="600" fill="#1e40af">⊕</text>

  <path d="M679 230 H732" fill="none" stroke="#475569" stroke-width="2.3" marker-end="url(#arrow-slate)"/>

  <rect x="736" y="196" width="88" height="68" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.8"/>
  <text x="780" y="226" text-anchor="middle" font-size="22" font-weight="700" fill="#6d28d9"><tspan font-family="Georgia, serif" font-style="italic">c</tspan></text>
  <text x="780" y="248" text-anchor="middle" font-size="13.5" fill="#5b21b6">2<tspan font-family="Georgia, serif" font-style="italic">n</tspan> bits</text>

  <!-- Encrypt / Decrypt cards -->
  <rect x="40" y="286" width="375" height="44" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="227" y="314" text-anchor="middle" font-size="16.5" font-weight="600" fill="#0f172a">Encrypt:  <tspan font-family="Georgia, serif" font-style="italic">c</tspan> = Enc(<tspan font-family="Georgia, serif" font-style="italic">k</tspan>, <tspan font-family="Georgia, serif" font-style="italic">m</tspan>) = <tspan font-family="Georgia, serif" font-style="italic">G</tspan>(<tspan font-family="Georgia, serif" font-style="italic">k</tspan>) ⊕ <tspan font-family="Georgia, serif" font-style="italic">m</tspan></text>

  <rect x="445" y="286" width="379" height="44" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="634" y="314" text-anchor="middle" font-size="16.5" font-weight="600" fill="#0f172a">Decrypt:  <tspan font-family="Georgia, serif" font-style="italic">m</tspan> = Dec(<tspan font-family="Georgia, serif" font-style="italic">k</tspan>, <tspan font-family="Georgia, serif" font-style="italic">c</tspan>) = <tspan font-family="Georgia, serif" font-style="italic">G</tspan>(<tspan font-family="Georgia, serif" font-style="italic">k</tspan>) ⊕ <tspan font-family="Georgia, serif" font-style="italic">c</tspan></text>

  <!-- One-time warning footer -->
  <rect x="40" y="344" width="784" height="38" rx="9" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="432" y="368" text-anchor="middle" font-size="14.5" font-weight="600" fill="#991b1b">
    Still one-time only: reusing <tspan font-family="Georgia, serif" font-style="italic">k</tspan> regenerates <tspan font-family="Georgia, serif" font-style="italic">G</tspan>(<tspan font-family="Georgia, serif" font-style="italic">k</tspan>), so  <tspan font-family="Georgia, serif" font-style="italic">c</tspan><tspan baseline-shift="sub" font-size="10.5">1</tspan> ⊕ <tspan font-family="Georgia, serif" font-style="italic">c</tspan><tspan baseline-shift="sub" font-size="10.5">2</tspan> = <tspan font-family="Georgia, serif" font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="10.5">1</tspan> ⊕ <tspan font-family="Georgia, serif" font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="10.5">2</tspan>.
  </text>
</svg>
