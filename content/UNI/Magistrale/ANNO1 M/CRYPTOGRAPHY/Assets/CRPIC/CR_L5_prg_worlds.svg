<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 465" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="title"><title id="title">Generated and uniform samples in PRG security</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3b6487"/></marker></defs><rect width="800" height="465" fill="#ffffff"/><text x="400" y="35" text-anchor="middle" font-size="25" fill="#172b42" font-weight="600">PRG security: both samples have λ + ℓ bits</text><path d="M205 150V172" fill="none" stroke="#3b6487" stroke-width="2.3" marker-end="url(#arr)"/><path d="M205 250V287H400V314" fill="none" stroke="#3b6487" stroke-width="2.3" marker-end="url(#arr)"/><path d="M595 250V287H400" fill="none" stroke="#3b6487" stroke-width="2.3" marker-end="url(#arr)"/><rect x="40" y="65" width="330" height="86" rx="12" fill="#eff6ff" stroke="#8ba3b7"/><text x="205" y="98" text-anchor="middle" font-size="21" fill="#172b42" font-weight="600">World 0: uniform seed</text><text x="205" y="132" text-anchor="middle" font-size="25" fill="#172b42" font-weight="400">s ← Uλ</text><rect x="40" y="175" width="330" height="77" rx="12" fill="#eff6ff" stroke="#8ba3b7"/><text x="205" y="207" text-anchor="middle" font-size="20" fill="#172b42" font-weight="400">Deterministic generator G</text><text x="205" y="236" text-anchor="middle" font-size="24" fill="#172b42" font-weight="400">z = G(s)</text><rect x="430" y="65" width="330" height="187" rx="12" fill="#ecfdf5" stroke="#8ba3b7"/><text x="595" y="103" text-anchor="middle" font-size="21" fill="#172b42" font-weight="600">World 1: uniform output</text><text x="595" y="166" text-anchor="middle" font-size="27" fill="#172b42" font-weight="400">z ← Uλ+ℓ</text><text x="595" y="216" text-anchor="middle" font-size="18" fill="#172b42" font-weight="400">No generator is applied.</text><rect x="210" y="316" width="380" height="90" rx="12" fill="#eff6ff" stroke="#8ba3b7"/><text x="400" y="352" text-anchor="middle" font-size="23" fill="#172b42" font-weight="600">Adversary A</text><text x="400" y="387" text-anchor="middle" font-size="23" fill="#172b42" font-weight="400">A(z) ∈ {0, 1}</text><text x="400" y="442" text-anchor="middle" font-size="20" fill="#172b42" font-weight="400">Compare the probabilities that A outputs 1.</text></svg>