<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 490" role="img" aria-labelledby="title desc" font-family="Segoe UI, Arial, sans-serif" fill="#0f172a">
  <title id="title">Generated and uniform samples in PRG security</title>
  <desc id="desc">World 0 samples a uniform lambda-bit seed s and evaluates the deterministic PRG z = G(s) of length lambda plus ell. World 1 samples z directly from the uniform distribution on lambda plus ell bits. Both are fed to PPT adversary A, and security requires the probabilities of A(z) = 1 to differ by at most negl(lambda).</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1L9 5L0 9Z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1L9 5L0 9Z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="840" height="490" fill="#ffffff"/>

  <!-- Header -->
  <text x="420" y="36" text-anchor="middle" font-size="22.5" font-weight="700" fill="#0f172a">PRG security: both worlds produce (<tspan font-family="Georgia, serif" font-style="italic">λ</tspan> + <tspan font-family="Georgia, serif" font-style="italic">ℓ</tspan>)-bit strings</text>
  <text x="420" y="60" text-anchor="middle" font-size="15" fill="#64748b">Deterministic expansion <tspan font-family="Georgia, serif" font-style="italic">G</tspan> : {0, 1}<tspan baseline-shift="super" font-size="11" font-family="Georgia, serif" font-style="italic">λ</tspan> → {0, 1}<tspan baseline-shift="super" font-size="11" font-family="Georgia, serif" font-style="italic">λ+ℓ</tspan> compared against a truly uniform output</text>

  <!-- World 0 container -->
  <rect x="40" y="80" width="350" height="224" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.8"/>
  <rect x="58" y="94" width="76" height="24" rx="12" fill="#1d4ed8"/>
  <text x="96" y="111" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">World 0</text>
  <text x="148" y="111" font-size="17.5" font-weight="700" fill="#1e40af">Pseudorandom output</text>

  <!-- World 0 step 1 -->
  <rect x="58" y="130" width="314" height="62" rx="10" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="74" y="152" font-size="13.5" fill="#475569">Sample uniform seed</text>
  <rect x="294" y="138" width="66" height="22" rx="11" fill="#dbeafe"/>
  <text x="327" y="153" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af"><tspan font-family="Georgia, serif" font-style="italic">λ</tspan> bits</text>
  <text x="215" y="180" text-anchor="middle" font-size="21" font-weight="600" fill="#0f172a">
    <tspan font-family="Georgia, serif" font-style="italic">s</tspan> ← <tspan font-family="Georgia, serif" font-style="italic">U</tspan><tspan baseline-shift="sub" font-size="14" font-family="Georgia, serif" font-style="italic">λ</tspan>
  </text>

  <!-- Arrow between World 0 steps -->
  <path d="M215 192 V216" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>

  <!-- World 0 step 2 -->
  <rect x="58" y="220" width="314" height="68" rx="10" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="74" y="242" font-size="13.5" fill="#475569">Apply deterministic PRG <tspan font-family="Georgia, serif" font-style="italic">G</tspan></text>
  <rect x="280" y="228" width="80" height="22" rx="11" fill="#dbeafe"/>
  <text x="320" y="243" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af"><tspan font-family="Georgia, serif" font-style="italic">λ</tspan> + <tspan font-family="Georgia, serif" font-style="italic">ℓ</tspan> bits</text>
  <text x="215" y="274" text-anchor="middle" font-size="21" font-weight="600" fill="#0f172a">
    <tspan font-family="Georgia, serif" font-style="italic">z</tspan> = <tspan font-family="Georgia, serif" font-style="italic">G</tspan>(<tspan font-family="Georgia, serif" font-style="italic">s</tspan>)
  </text>

  <!-- World 1 container -->
  <rect x="450" y="80" width="350" height="224" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.8"/>
  <rect x="468" y="94" width="76" height="24" rx="12" fill="#047857"/>
  <text x="506" y="111" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">World 1</text>
  <text x="558" y="111" font-size="17.5" font-weight="700" fill="#065f46">Truly uniform output</text>

  <!-- World 1 inner card -->
  <rect x="468" y="142" width="314" height="134" rx="10" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
  <text x="484" y="166" font-size="14" fill="#475569">Sample uniformly at random</text>
  <rect x="690" y="151" width="80" height="22" rx="11" fill="#d1fae5"/>
  <text x="730" y="166" text-anchor="middle" font-size="12" font-weight="600" fill="#065f46"><tspan font-family="Georgia, serif" font-style="italic">λ</tspan> + <tspan font-family="Georgia, serif" font-style="italic">ℓ</tspan> bits</text>
  <text x="625" y="216" text-anchor="middle" font-size="27" font-weight="600" fill="#0f172a">
    <tspan font-family="Georgia, serif" font-style="italic">z</tspan> ← <tspan font-family="Georgia, serif" font-style="italic">U</tspan><tspan baseline-shift="sub" font-size="17" font-family="Georgia, serif" font-style="italic">λ+ℓ</tspan>
  </text>
  <text x="625" y="253" text-anchor="middle" font-size="14" fill="#64748b">No generator <tspan font-family="Georgia, serif" font-style="italic">G</tspan> is applied.</text>

  <!-- Routed connectors merging cleanly into one arrow -->
  <path d="M215 304 V324 Q215 332 223 332 H617 Q625 332 625 324 V304" fill="none" stroke="#64748b" stroke-width="2.2"/>
  <path d="M420 332 V364" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arrow)"/>
  <rect x="352" y="316" width="136" height="30" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="420" y="336" text-anchor="middle" font-size="14.5" font-weight="600" fill="#334155"><tspan font-family="Georgia, serif" font-style="italic">z</tspan> ∈ {0, 1}<tspan baseline-shift="super" font-size="10.5" font-family="Georgia, serif" font-style="italic">λ+ℓ</tspan></text>

  <!-- Adversary card -->
  <rect x="190" y="368" width="460" height="66" rx="14" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.8"/>
  <text x="420" y="396" text-anchor="middle" font-size="20" font-weight="700" fill="#6d28d9">PPT Adversary <tspan font-family="Georgia, serif" font-style="italic">A</tspan></text>
  <text x="420" y="421" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">Outputs bit <tspan font-family="Georgia, serif" font-style="italic">A</tspan>(<tspan font-family="Georgia, serif" font-style="italic">z</tspan>) ∈ {0, 1}</text>

  <!-- Footer -->
  <rect x="70" y="444" width="700" height="34" rx="9" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.4"/>
  <text x="420" y="466" text-anchor="middle" font-size="14.5" fill="#334155">
    Compare probabilities of outputting 1:  |<tspan font-weight="600" fill="#0f172a">Pr[<tspan font-family="Georgia, serif" font-style="italic">A</tspan>(<tspan font-family="Georgia, serif" font-style="italic">G</tspan>(<tspan font-family="Georgia, serif" font-style="italic">U</tspan><tspan baseline-shift="sub" font-size="10.5" font-family="Georgia, serif" font-style="italic">λ</tspan>)) = 1] − Pr[<tspan font-family="Georgia, serif" font-style="italic">A</tspan>(<tspan font-family="Georgia, serif" font-style="italic">U</tspan><tspan baseline-shift="sub" font-size="10.5" font-family="Georgia, serif" font-style="italic">λ+ℓ</tspan>) = 1]</tspan>| ≤ negl(<tspan font-family="Georgia, serif" font-style="italic">λ</tspan>)
  </text>
</svg>
