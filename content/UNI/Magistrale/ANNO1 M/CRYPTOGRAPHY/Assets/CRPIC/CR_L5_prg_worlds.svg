<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 260" role="img" aria-labelledby="title desc">
  <title id="title">Generated and uniform samples in PRG security</title>
  <desc id="desc">World 0 samples a uniform lambda-bit seed s and computes z = G(s). World 1 samples z uniformly from lambda plus ell bits. In both worlds z has lambda plus ell bits and is given to the adversary A, which outputs one bit.</desc>
  <style>
    svg { font-size: 18px; }
    text { font-family: 'Segoe UI', Arial, sans-serif; fill: #1e293b; }
    .m { font-family: 'Times New Roman', Times, serif; font-style: italic; }
    tspan.m { font-size: 1.12em; }
    tspan[baseline-shift] { font-size: 0.72em; }
    .small { font-size: 13.5px; fill: #475569; }
    .ln { fill: none; stroke: #475569; stroke-width: 1.7; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 1L9 5L0 9Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="780" height="260" rx="12" fill="#ffffff"/>

  <!-- World 0 band (pastel blue) -->
  <rect x="18" y="20" width="415" height="98" rx="10" fill="#eef6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="36" y="72" font-weight="600" fill="#1e3a8a">World 0</text>

  <rect x="128" y="34" width="132" height="50" rx="7" fill="#ffffff" stroke="#60a5fa" stroke-width="1.6"/>
  <text x="194" y="66" text-anchor="middle" font-size="20"><tspan class="m">s</tspan> ← <tspan class="m">U</tspan><tspan class="m" baseline-shift="-0.35em">λ</tspan></text>
  <text class="small" x="194" y="104" text-anchor="middle" fill="#3b5998">seed, <tspan class="m">λ</tspan> bits</text>

  <path class="ln" d="M260 59H318" marker-end="url(#ar)"/>
  <rect x="320" y="34" width="76" height="50" rx="7" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.6"/>
  <text class="m" x="358" y="67" text-anchor="middle" font-size="22" fill="#312e81">G</text>

  <path class="ln" d="M396 59H558" marker-end="url(#ar)"/>
  <text x="488" y="49" text-anchor="middle"><tspan class="m">z</tspan> = <tspan class="m">G</tspan>(<tspan class="m">s</tspan>)</text>
  <text class="small" x="488" y="80" text-anchor="middle"><tspan class="m">λ</tspan> + <tspan class="m">ℓ</tspan> bits</text>

  <!-- World 1 band (pastel mint) -->
  <rect x="18" y="140" width="415" height="98" rx="10" fill="#edfbf3" stroke="#74c69d" stroke-width="1.5"/>
  <text x="36" y="192" font-weight="600" fill="#14532d">World 1</text>

  <rect x="128" y="154" width="268" height="50" rx="7" fill="#ffffff" stroke="#52b788" stroke-width="1.6"/>
  <text x="262" y="186" text-anchor="middle" font-size="20"><tspan class="m">z</tspan> ← <tspan class="m">U</tspan><tspan class="m" baseline-shift="-0.35em">λ+ℓ</tspan></text>
  <text class="small" x="262" y="224" text-anchor="middle" fill="#2d6a4f">no seed, no <tspan class="m">G</tspan></text>

  <path class="ln" d="M396 179H558" marker-end="url(#ar)"/>
  <text class="m" x="488" y="169" text-anchor="middle">z</text>
  <text class="small" x="488" y="200" text-anchor="middle"><tspan class="m">λ</tspan> + <tspan class="m">ℓ</tspan> bits</text>

  <!-- Adversary (pastel lavender) -->
  <rect x="560" y="34" width="110" height="170" rx="10" fill="#f3effb" stroke="#a78bfa" stroke-width="1.7"/>
  <text class="small" x="615" y="106" text-anchor="middle" fill="#5b21b6">Adversary</text>
  <text class="m" x="615" y="138" text-anchor="middle" font-size="23" fill="#3b0764">A</text>
  <path class="ln" d="M670 119H716" marker-end="url(#ar)"/>
  <text x="726" y="125">0/1</text>
</svg>
