<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="ske-title ske-desc" font-family="'Segoe UI', Arial, sans-serif">
  <title id="ske-title">Symmetric-Key Encryption Model</title>
  <desc id="ske-desc">Alice encrypts plaintext m with shared secret key k to produce ciphertext c and sends c to Bob, who decrypts it with k. Eve observes ciphertext c on the channel.</desc>
  <defs>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 1L9 5L0 9Z" fill="#57534e"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 1L9 5L0 9Z" fill="#e05a6d"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 1L9 5L0 9Z" fill="#2a9d8f"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="758" height="298" rx="14" fill="#fcfbf8" stroke="#e7e2d9" stroke-width="1.5"/>

  <!-- Connectors drawn behind nodes -->
  <path d="M228 150 H524" fill="none" stroke="#57534e" stroke-width="2.5" marker-end="url(#arrow-slate)"/>
  <path d="M380 72 V126" fill="none" stroke="#e05a6d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-red)"/>
  <path d="M270 253 H136 V198" fill="none" stroke="#2a9d8f" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-green)"/>
  <path d="M490 253 H624 V198" fill="none" stroke="#2a9d8f" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-green)"/>

  <!-- Eve (adversary) -->
  <rect x="295" y="18" width="170" height="54" rx="10" fill="#fbecee" stroke="#e05a6d" stroke-width="1.8"/>
  <text x="380" y="41" text-anchor="middle" font-size="16" font-weight="700" fill="#9f1239">Eve</text>
  <text x="380" y="60" text-anchor="middle" font-size="13" fill="#9f1239">observes <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">c</tspan></text>

  <!-- Ciphertext badge on channel -->
  <rect x="348" y="134" width="64" height="32" rx="16" fill="#57534e"/>
  <text x="380" y="155" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-style="italic">c</text>

  <!-- Alice -->
  <rect x="44" y="108" width="184" height="84" rx="12" fill="#eef0fb" stroke="#4338ca" stroke-width="2"/>
  <text x="136" y="140" text-anchor="middle" font-size="18" font-weight="700" fill="#312e81">Alice</text>
  <text x="136" y="168" text-anchor="middle" font-size="14.5" font-weight="600" fill="#4338ca">Enc(<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">k</tspan>, <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan>)</text>

  <!-- Bob -->
  <rect x="532" y="108" width="184" height="84" rx="12" fill="#eef0fb" stroke="#4338ca" stroke-width="2"/>
  <text x="624" y="140" text-anchor="middle" font-size="18" font-weight="700" fill="#312e81">Bob</text>
  <text x="624" y="168" text-anchor="middle" font-size="14.5" font-weight="600" fill="#4338ca">Dec(<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">k</tspan>, <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">c</tspan>)</text>

  <!-- Shared secret key -->
  <rect x="270" y="230" width="220" height="46" rx="10" fill="#e6f4f1" stroke="#2a9d8f" stroke-width="1.8"/>
  <text x="380" y="258" text-anchor="middle" font-size="14.5" font-weight="600" fill="#115e59">Shared secret key <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="700">k</tspan></text>
</svg>
