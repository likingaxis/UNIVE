<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc" font-family="Segoe UI, Arial, sans-serif" fill="#1f2937">
  <title id="title">The information-theoretic bill</title>
  <desc id="desc">Three limits: the one-time pad needs a message-length key, statistically secure authentication needs more key material for more messages, and extraction cannot create source randomness.</desc>
  <rect width="960" height="430" fill="#ffffff"/>
  <text x="30" y="44" font-size="27" font-weight="700">The information-theoretic bill</text>
  <text x="30" y="74" font-size="19" fill="#64748b">Strong guarantees. A few strings attached.</text>
  <text x="117" y="119" font-size="17" font-weight="700" fill="#64748b">WHAT WE GET</text>
  <text x="418" y="119" font-size="17" font-weight="700" fill="#64748b">WHAT IT COSTS</text>
  <rect x="24" y="136" width="912" height="78" rx="12" fill="#eff6ff"/>
  <g transform="translate(42 151)" stroke="#2563eb" stroke-width="3" fill="none" stroke-linecap="round">
    <circle cx="14" cy="19" r="11"/><path d="M25 19H53M42 19V29M51 19V26"/>
    <path d="M3 43H53M9 39V43M19 36V43M29 39V43M39 36V43M49 39V43"/>
  </g>
  <text x="117" y="181" font-size="23" font-weight="600">Perfect secrecy</text>
  <text x="418" y="168" font-size="21">One-time pad:</text>
  <text x="418" y="195" font-size="21">a key as long as the message.</text>
  <rect x="24" y="224" width="912" height="78" rx="12" fill="#f5f3ff"/>
  <g transform="translate(45 236)" stroke="#7c3aed" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 4H41L55 18L25 48L2 25Z"/><circle cx="12" cy="14" r="3"/>
    <path d="M23 20L29 26L41 14"/><path d="M45 34H60M52 27V41"/>
  </g>
  <text x="117" y="258" font-size="23" font-weight="600">Statistically secure</text>
  <text x="117" y="286" font-size="23" font-weight="600">MACs</text>
  <text x="418" y="256" font-size="21">More authenticated messages,</text>
  <text x="418" y="283" font-size="21">more secret-key material.</text>
  <rect x="24" y="312" width="912" height="94" rx="12" fill="#ecfdf5"/>
  <g transform="translate(43 332)" stroke="#059669" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 0H58L37 25V46L22 53V25Z"/><circle cx="19" cy="9" r="1.5"/><circle cx="34" cy="12" r="1.5"/>
    <path d="M28 39V44"/>
  </g>
  <text x="117" y="365" font-size="23" font-weight="600">Randomness extraction</text>
  <text x="418" y="347" font-size="21">Extract what the source contains;</text>
  <text x="418" y="375" font-size="21">do not create extra source randomness.</text>
</svg>
