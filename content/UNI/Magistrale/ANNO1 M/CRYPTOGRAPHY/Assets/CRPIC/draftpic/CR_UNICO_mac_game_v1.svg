<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 315" role="img" aria-labelledby="mac-game-title mac-game-desc" font-family="Segoe UI, Arial, sans-serif">
  <title id="mac-game-title">One-Time Statistical MAC Security Game</title>
  <desc id="mac-game-desc">Security game between an unbounded adversary A and a challenger C. Challenger samples uniform key k from K. Adversary queries one message m in M and receives tag tau = Tag(k, m). Adversary then outputs a forgery pair (m', tau') and wins if m' != m and Tag(k, m') = tau'.</desc>
  <defs>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 1L9 5L0 9Z" fill="#334155"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 1L9 5L0 9Z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="778" height="313" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="390" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">
    One-Time Unforgeability Game (Unbounded Adversary <tspan font-family="Georgia, serif" font-style="italic">A</tspan>)
  </text>

  <!-- Vertical participant lifelines -->
  <line x1="150" y1="92" x2="150" y2="236" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="630" y1="92" x2="630" y2="236" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- Adversary header -->
  <rect x="44" y="48" width="212" height="44" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="150" y="75" text-anchor="middle" font-size="16" font-weight="700" fill="#991b1b">
    Adversary <tspan font-family="Georgia, serif" font-style="italic">A</tspan>
  </text>

  <!-- Challenger header -->
  <rect x="524" y="48" width="212" height="44" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="630" y="75" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">
    Challenger <tspan font-family="Georgia, serif" font-style="italic">C</tspan>
  </text>

  <!-- Challenger samples k -->
  <rect x="536" y="102" width="188" height="28" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="630" y="121" text-anchor="middle" font-size="13" font-weight="600" fill="#065f46">
    Sample uniform key <tspan font-family="Georgia, serif" font-style="italic">k</tspan> ∈ <tspan font-family="Georgia, serif" font-style="italic">K</tspan>
  </text>

  <!-- Step 1: A sends m -->
  <path d="M150 144 H624" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow-slate)"/>
  <rect x="312" y="130" width="156" height="24" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="390" y="146" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b">
    1. Query <tspan font-family="Georgia, serif" font-style="italic">m</tspan> ∈ <tspan font-family="Georgia, serif" font-style="italic">M</tspan>
  </text>

  <!-- Step 2: C computes and sends tau -->
  <rect x="546" y="156" width="168" height="24" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="630" y="172" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">
    τ = Tag(<tspan font-family="Georgia, serif" font-style="italic">k</tspan>, <tspan font-family="Georgia, serif" font-style="italic">m</tspan>)
  </text>

  <path d="M630 184 H156" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow-slate)"/>
  <rect x="330" y="170" width="120" height="24" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="390" y="186" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b">
    2. Return τ
  </text>

  <!-- Step 3: A sends forgery (m', tau') -->
  <path d="M150 220 H624" fill="none" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrow-red)"/>
  <rect x="282" y="206" width="216" height="24" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.3"/>
  <text x="390" y="222" text-anchor="middle" font-size="12.5" font-weight="600" fill="#991b1b">
    3. Forge (<tspan font-family="Georgia, serif" font-style="italic">m</tspan>', τ')
  </text>

  <!-- Win condition -->
  <rect x="90" y="246" width="600" height="50" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
  <text x="390" y="267" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f46">
    WIN condition:  <tspan font-family="Georgia, serif" font-style="italic">m</tspan>' ≠ <tspan font-family="Georgia, serif" font-style="italic">m</tspan>   and   Tag(<tspan font-family="Georgia, serif" font-style="italic">k</tspan>, <tspan font-family="Georgia, serif" font-style="italic">m</tspan>') = τ'
  </text>
  <text x="390" y="286" text-anchor="middle" font-size="12.5" fill="#047857">
    One-time ε-statistical security:  ∀ unbounded <tspan font-family="Georgia, serif" font-style="italic">A</tspan>,   Pr[<tspan font-family="Georgia, serif" font-style="italic">A</tspan> wins] ≤ ε
  </text>
</svg>
