<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 325" role="img" aria-labelledby="title desc">
  <title id="title">First-transition reduction for ell = 3 (i = 0)</title>
  <desc id="desc">The challenger sends B a (lambda+1)-bit string z, either G(U_lambda) or U_(lambda+1). B splits z = (s_1, b_1), computes (s_2, b_2) = G(s_1) and (s_3, b_3) = G(s_2), runs A on z' = (b_1, b_2, b_3, s_3) and outputs A's bit. A generated z gives z' distributed as H_0; a uniform z gives H_1.</desc>
  <style>
    svg { font-size: 18px; }
    text { font-family: 'Segoe UI', Arial, sans-serif; fill: #1e293b; }
    .m { font-family: 'Times New Roman', Times, serif; font-style: italic; }
    tspan.m { font-size: 1.12em; }
    tspan[baseline-shift] { font-size: 0.72em; }
    .n { font-style: normal; }
    .small { font-size: 13.5px; fill: #475569; }
    .ln { fill: none; stroke: #475569; stroke-width: 1.7; }
    .num { fill: #3b5998; font-size: 15px; font-weight: 600; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 1L9 5L0 9Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="860" height="325" rx="12" fill="#ffffff"/>

  <!-- Challenger (pastel sand/cream) -->
  <rect x="20" y="88" width="170" height="88" rx="8" fill="#fef9ec" stroke="#d9a441" stroke-width="1.6"/>
  <text class="small" x="105" y="110" text-anchor="middle" fill="#854d0e">Challenger</text>
  <text x="105" y="137" text-anchor="middle"><tspan class="m">z</tspan> ← <tspan class="m">G</tspan>(<tspan class="m">U</tspan><tspan class="m" baseline-shift="-0.35em">λ</tspan>)</text>
  <text x="105" y="163" text-anchor="middle"><tspan class="small">or </tspan><tspan class="m">z</tspan> ← <tspan class="m">U</tspan><tspan baseline-shift="-0.35em"><tspan class="m">λ</tspan>+1</tspan></text>

  <path class="ln" d="M190 132H248" marker-end="url(#ar)"/>
  <text class="m" x="219" y="122" text-anchor="middle">z</text>
  <text class="small" x="219" y="151" text-anchor="middle"><tspan class="m">λ</tspan>+1</text>

  <!-- Reduction B (pastel blue-slate container) -->
  <rect x="250" y="18" width="520" height="232" rx="10" fill="#eef6ff" stroke="#7da9e8" stroke-width="1.7"/>
  <text x="270" y="46" font-weight="600" fill="#1e3a8a">Reduction <tspan class="m">B</tspan></text>
  <text class="small" x="270" y="68" fill="#3b5998"><tspan class="m">i</tspan> = 0: no prefix bits</text>

  <!-- White inner steps card -->
  <rect x="268" y="80" width="248" height="152" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.4"/>
  <text class="num" x="282" y="108">1.</text>
  <text x="306" y="108"><tspan class="m">z</tspan> = (<tspan class="m">s</tspan><tspan baseline-shift="-0.35em">1</tspan>, <tspan class="m">b</tspan><tspan baseline-shift="-0.35em">1</tspan>)</text>
  <text class="num" x="282" y="140">2.</text>
  <text x="306" y="140">(<tspan class="m">s</tspan><tspan baseline-shift="-0.35em">2</tspan>, <tspan class="m">b</tspan><tspan baseline-shift="-0.35em">2</tspan>) = <tspan class="m">G</tspan>(<tspan class="m">s</tspan><tspan baseline-shift="-0.35em">1</tspan>)</text>
  <text class="num" x="282" y="172">3.</text>
  <text x="306" y="172">(<tspan class="m">s</tspan><tspan baseline-shift="-0.35em">3</tspan>, <tspan class="m">b</tspan><tspan baseline-shift="-0.35em">3</tspan>) = <tspan class="m">G</tspan>(<tspan class="m">s</tspan><tspan baseline-shift="-0.35em">2</tspan>)</text>
  <text class="num" x="282" y="204">4.</text>
  <text x="306" y="204"><tspan class="m">z′</tspan> = (<tspan class="m">b</tspan><tspan baseline-shift="-0.35em">1</tspan>, <tspan class="m">b</tspan><tspan baseline-shift="-0.35em">2</tspan>, <tspan class="m">b</tspan><tspan baseline-shift="-0.35em">3</tspan>, <tspan class="m">s</tspan><tspan baseline-shift="-0.35em">3</tspan>)</text>

  <path class="ln" d="M516 198H598" marker-end="url(#ar)"/>
  <text class="m" x="557" y="188" text-anchor="middle">z′</text>
  <text class="small" x="557" y="218" text-anchor="middle"><tspan class="m">λ</tspan>+3 bits</text>

  <!-- Adversary A (pastel lavender) -->
  <rect x="600" y="163" width="96" height="70" rx="8" fill="#f3effb" stroke="#a78bfa" stroke-width="1.6"/>
  <text class="small" x="648" y="188" text-anchor="middle" fill="#5b21b6">Adversary</text>
  <text class="m" x="648" y="217" text-anchor="middle" font-size="22" fill="#3b0764">A</text>

  <path class="ln" d="M696 198H838" marker-end="url(#ar)"/>
  <text x="733" y="188" text-anchor="middle"><tspan class="m">A</tspan>(<tspan class="m">z′</tspan>)</text>
  <text class="small" x="812" y="224" text-anchor="middle">output of <tspan class="m">B</tspan></text>

  <!-- Outcome pills (pastel blue for H_0, pastel mint for H_1) -->
  <rect x="45" y="268" width="370" height="38" rx="8" fill="#eef6ff" stroke="#93c5fd" stroke-width="1.4"/>
  <text x="230" y="293" text-anchor="middle" font-size="16" fill="#1e3a8a">if <tspan class="m">z</tspan> ← <tspan class="m">G</tspan>(<tspan class="m">U</tspan><tspan class="m" baseline-shift="-0.35em">λ</tspan>):  <tspan class="m">z′</tspan> is distributed as <tspan class="m">H</tspan><tspan baseline-shift="-0.35em">0</tspan></text>

  <rect x="445" y="268" width="370" height="38" rx="8" fill="#edfbf3" stroke="#74c69d" stroke-width="1.4"/>
  <text x="630" y="293" text-anchor="middle" font-size="16" fill="#14532d">if <tspan class="m">z</tspan> ← <tspan class="m">U</tspan><tspan baseline-shift="-0.35em"><tspan class="m">λ</tspan>+1</tspan>:  <tspan class="m">z′</tspan> is distributed as <tspan class="m">H</tspan><tspan baseline-shift="-0.35em">1</tspan></text>
</svg>
