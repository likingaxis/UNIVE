<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 265" role="img" aria-labelledby="shannon-title shannon-desc" font-family="Segoe UI, Arial, sans-serif">
  <title id="shannon-title">Shannon Key-Length Lower Bound Contradiction</title>
  <desc id="shannon-desc">If |K| is strictly smaller than |M|, decrypting a fixed ciphertext c under every key in K produces a subset M_c of size at most |K|, leaving at least one message m* in M \ M_c unreachable from c. Under a uniform distribution on M, Pr[M=m* | C=c] = 0 while Pr[M=m*] = 1/|M| &gt; 0.</desc>
  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 1L9 5L0 9Z" fill="#059669"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="778" height="263" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="390" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">
    Contradiction when |<tspan font-family="Georgia, serif" font-style="italic">K</tspan>| &lt; |<tspan font-family="Georgia, serif" font-style="italic">M</tspan>| (fixed ciphertext <tspan font-family="Georgia, serif" font-style="italic">c</tspan> with Pr[<tspan font-family="Georgia, serif" font-style="italic">C</tspan> = <tspan font-family="Georgia, serif" font-style="italic">c</tspan>] &gt; 0)
  </text>

  <!-- Key space K -->
  <rect x="28" y="54" width="196" height="184" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="126" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#065f46">
    Key space <tspan font-family="Georgia, serif" font-style="italic">K</tspan>
  </text>
  <rect x="52" y="98" width="148" height="32" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.4"/>
  <text x="126" y="119" text-anchor="middle" font-size="13.5" fill="#065f46">
    <tspan font-family="Georgia, serif" font-style="italic">k</tspan><tspan baseline-shift="sub" font-size="9.5">1</tspan>
  </text>
  <rect x="52" y="140" width="148" height="32" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.4"/>
  <text x="126" y="161" text-anchor="middle" font-size="13.5" fill="#065f46">
    <tspan font-family="Georgia, serif" font-style="italic">k</tspan><tspan baseline-shift="sub" font-size="9.5">2</tspan>
  </text>
  <text x="126" y="196" text-anchor="middle" font-size="14" font-weight="700" fill="#047857">⋮</text>
  <rect x="52" y="202" width="148" height="24" rx="6" fill="#d1fae5"/>
  <text x="126" y="218" text-anchor="middle" font-size="12" font-weight="600" fill="#065f46">
    |<tspan font-family="Georgia, serif" font-style="italic">K</tspan>| possible keys
  </text>

  <!-- Mapping arrows Dec(k, c) -->
  <path d="M224 114 H360" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M224 156 H360" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="242" y="122" width="104" height="24" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="294" y="138" text-anchor="middle" font-size="12.5" font-weight="600" fill="#334155">
    Dec(<tspan font-family="Georgia, serif" font-style="italic">k</tspan>, <tspan font-family="Georgia, serif" font-style="italic">c</tspan>)
  </text>

  <!-- Message space M -->
  <rect x="366" y="54" width="386" height="184" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="559" y="79" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">
    Message space <tspan font-family="Georgia, serif" font-style="italic">M</tspan>
  </text>

  <!-- Subset M_c -->
  <rect x="384" y="94" width="188" height="128" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.8"/>
  <text x="478" y="117" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f46">
    Reachable <tspan font-family="Georgia, serif" font-style="italic">M</tspan><tspan baseline-shift="sub" font-size="9.5" font-style="italic">c</tspan>
  </text>
  <text x="478" y="140" text-anchor="middle" font-size="12" fill="#334155">
    {Dec(<tspan font-family="Georgia, serif" font-style="italic">k</tspan>, <tspan font-family="Georgia, serif" font-style="italic">c</tspan>) | <tspan font-family="Georgia, serif" font-style="italic">k</tspan> ∈ <tspan font-family="Georgia, serif" font-style="italic">K</tspan>}
  </text>
  <rect x="400" y="156" width="156" height="24" rx="6" fill="#ecfdf5"/>
  <text x="478" y="172" text-anchor="middle" font-size="12" font-weight="600" fill="#065f46">
    |<tspan font-family="Georgia, serif" font-style="italic">M</tspan><tspan baseline-shift="sub" font-size="9" font-style="italic">c</tspan>| ≤ |<tspan font-family="Georgia, serif" font-style="italic">K</tspan>| &lt; |<tspan font-family="Georgia, serif" font-style="italic">M</tspan>|
  </text>
  <text x="478" y="206" text-anchor="middle" font-size="11.5" fill="#475569">
    (at most 1 message per key)
  </text>

  <!-- Unreachable m* in M \ M_c -->
  <rect x="588" y="94" width="148" height="128" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="662" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">
    <tspan font-family="Georgia, serif" font-style="italic">m</tspan>* ∈ <tspan font-family="Georgia, serif" font-style="italic">M</tspan> \ <tspan font-family="Georgia, serif" font-style="italic">M</tspan><tspan baseline-shift="sub" font-size="9.5" font-style="italic">c</tspan>
  </text>
  <text x="662" y="142" text-anchor="middle" font-size="11.5" font-weight="600" fill="#7f1d1d">
    ∀<tspan font-family="Georgia, serif" font-style="italic">k</tspan>: Enc(<tspan font-family="Georgia, serif" font-style="italic">k</tspan>, <tspan font-family="Georgia, serif" font-style="italic">m</tspan>*) ≠ <tspan font-family="Georgia, serif" font-style="italic">c</tspan>
  </text>
  <rect x="598" y="158" width="128" height="48" rx="7" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="662" y="177" text-anchor="middle" font-size="11.5" font-weight="700" fill="#991b1b">
    Pr[<tspan font-family="Georgia, serif" font-style="italic">M</tspan>=<tspan font-family="Georgia, serif" font-style="italic">m</tspan>* | <tspan font-family="Georgia, serif" font-style="italic">C</tspan>=<tspan font-family="Georgia, serif" font-style="italic">c</tspan>] = 0
  </text>
  <text x="662" y="197" text-anchor="middle" font-size="11.5" font-weight="600" fill="#b91c1c">
    ≠ 1 / |<tspan font-family="Georgia, serif" font-style="italic">M</tspan>| &gt; 0
  </text>
</svg>
