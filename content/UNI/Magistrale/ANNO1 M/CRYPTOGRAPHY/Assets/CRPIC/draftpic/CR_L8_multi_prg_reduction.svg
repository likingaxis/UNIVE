<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 444" role="img" aria-labelledby="title desc" font-family="Segoe UI, Arial, sans-serif" fill="#0f172a">
  <title id="title">Reduction B proving H_0 approx_c H_1 (and H_{i-1} approx_c H_i) in the Multiple-PRG Lemma</title>
  <desc id="desc">Three-party sequence diagram with PRG Challenger C on the left, Reduction B in the middle, and Hybrid Distinguisher A on the right. C sends a single 2lambda-bit challenge z_1 (either G(k_1) or U_{2lambda}) to B. B independently samples k_2, ..., k_t from U_lambda, computes G(k_2), ..., G(k_t), and sends the tuple (z_1, G(k_2), ..., G(k_t)) to A. A returns a decision bit b prime, which B forwards to C.</desc>
  <defs>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 1L9 5L0 9Z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 1L9 5L0 9Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 1L9 5L0 9Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="880" height="444" fill="#ffffff"/>

  <!-- Header -->
  <text x="440" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">
    Multiple-PRG Lemma reduction: proving <tspan font-family="Georgia, serif" font-style="italic">H</tspan><tspan baseline-shift="sub" font-size="13">0</tspan> ≈<tspan baseline-shift="sub" font-size="13" font-family="Georgia, serif" font-style="italic">c</tspan> <tspan font-family="Georgia, serif" font-style="italic">H</tspan><tspan baseline-shift="sub" font-size="13">1</tspan> (and <tspan font-family="Georgia, serif" font-style="italic">H</tspan><tspan baseline-shift="sub" font-size="13" font-family="Georgia, serif" font-style="italic">i−1</tspan> ≈<tspan baseline-shift="sub" font-size="13" font-family="Georgia, serif" font-style="italic">c</tspan> <tspan font-family="Georgia, serif" font-style="italic">H</tspan><tspan baseline-shift="sub" font-size="13" font-family="Georgia, serif" font-style="italic">i</tspan>)
  </text>
  <text x="440" y="56" text-anchor="middle" font-size="14" fill="#64748b">
    Because the seeds are independent, <tspan font-family="Georgia, serif" font-style="italic">B</tspan> can sample <tspan font-family="Georgia, serif" font-style="italic">k</tspan><tspan baseline-shift="sub" font-size="10">2</tspan>, …, <tspan font-family="Georgia, serif" font-style="italic">k</tspan><tspan baseline-shift="sub" font-size="10" font-family="Georgia, serif" font-style="italic">t</tspan> ← <tspan font-family="Georgia, serif" font-style="italic">U</tspan><tspan baseline-shift="sub" font-size="10" font-family="Georgia, serif" font-style="italic">λ</tspan> on its own to complete the <tspan font-family="Georgia, serif" font-style="italic">t</tspan>-tuple
  </text>

  <!-- Lifelines -->
  <line x1="142" y1="138" x2="142" y2="358" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="440" y1="138" x2="440" y2="358" stroke="#93c5fd" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="738" y1="138" x2="738" y2="358" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- Actor boxes -->
  <rect x="34" y="74" width="216" height="62" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="142" y="100" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">PRG Challenger <tspan font-family="Georgia, serif" font-style="italic">C</tspan></text>
  <text x="142" y="122" text-anchor="middle" font-size="12.5" fill="#475569">
    <tspan font-family="Georgia, serif" font-style="italic">z</tspan><tspan baseline-shift="sub" font-size="9.5">1</tspan> = <tspan font-family="Georgia, serif" font-style="italic">G</tspan>(<tspan font-family="Georgia, serif" font-style="italic">k</tspan><tspan baseline-shift="sub" font-size="9.5">1</tspan>)  or  <tspan font-family="Georgia, serif" font-style="italic">z</tspan><tspan baseline-shift="sub" font-size="9.5">1</tspan> ← <tspan font-family="Georgia, serif" font-style="italic">U</tspan><tspan baseline-shift="sub" font-size="9.5">2<tspan font-family="Georgia, serif" font-style="italic">λ</tspan></tspan>
  </text>

  <rect x="332" y="74" width="216" height="62" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="440" y="100" text-anchor="middle" font-size="17" font-weight="700" fill="#1d4ed8">Reduction <tspan font-family="Georgia, serif" font-style="italic">B</tspan></text>
  <text x="440" y="122" text-anchor="middle" font-size="12.5" fill="#1e40af">Single-sample PRG adversary</text>

  <rect x="630" y="74" width="216" height="62" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.8"/>
  <text x="738" y="100" text-anchor="middle" font-size="17" font-weight="700" fill="#6d28d9">Adversary <tspan font-family="Georgia, serif" font-style="italic">A</tspan></text>
  <text x="738" y="122" text-anchor="middle" font-size="12.5" fill="#5b21b6">Distinguishes <tspan font-family="Georgia, serif" font-style="italic">H</tspan><tspan baseline-shift="sub" font-size="9.5">0</tspan> vs. <tspan font-family="Georgia, serif" font-style="italic">H</tspan><tspan baseline-shift="sub" font-size="9.5">1</tspan></text>

  <!-- Step 1: C -> B: z_1 -->
  <path d="M142 178 H431" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow-slate)"/>
  <rect x="208" y="148" width="166" height="24" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="291" y="165" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">
    <tspan font-family="Georgia, serif" font-style="italic">z</tspan><tspan baseline-shift="sub" font-size="10">1</tspan> ∈ {0, 1}<tspan baseline-shift="super" font-size="10">2<tspan font-family="Georgia, serif" font-style="italic">λ</tspan></tspan>
  </text>

  <!-- Step 2: B samples k_2, ..., k_t -->
  <rect x="330" y="190" width="220" height="48" rx="9" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.4"/>
  <text x="440" y="211" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a">
    Sample <tspan font-family="Georgia, serif" font-style="italic">k</tspan><tspan baseline-shift="sub" font-size="10">2</tspan>, …, <tspan font-family="Georgia, serif" font-style="italic">k</tspan><tspan baseline-shift="sub" font-size="10" font-family="Georgia, serif" font-style="italic">t</tspan> ← <tspan font-family="Georgia, serif" font-style="italic">U</tspan><tspan baseline-shift="sub" font-size="10" font-family="Georgia, serif" font-style="italic">λ</tspan>
  </text>
  <text x="440" y="229" text-anchor="middle" font-size="12.5" fill="#1e40af">
    and compute <tspan font-family="Georgia, serif" font-style="italic">G</tspan>(<tspan font-family="Georgia, serif" font-style="italic">k</tspan><tspan baseline-shift="sub" font-size="9.5">2</tspan>), …, <tspan font-family="Georgia, serif" font-style="italic">G</tspan>(<tspan font-family="Georgia, serif" font-style="italic">k</tspan><tspan baseline-shift="sub" font-size="9.5" font-family="Georgia, serif" font-style="italic">t</tspan>)
  </text>

  <!-- Step 3: B -> A: tuple -->
  <path d="M440 272 H729" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <rect x="488" y="242" width="202" height="24" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1.3"/>
  <text x="589" y="259" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e40af">
    (<tspan font-family="Georgia, serif" font-style="italic">z</tspan><tspan baseline-shift="sub" font-size="10">1</tspan>, <tspan font-family="Georgia, serif" font-style="italic">G</tspan>(<tspan font-family="Georgia, serif" font-style="italic">k</tspan><tspan baseline-shift="sub" font-size="10">2</tspan>), …, <tspan font-family="Georgia, serif" font-style="italic">G</tspan>(<tspan font-family="Georgia, serif" font-style="italic">k</tspan><tspan baseline-shift="sub" font-size="10" font-family="Georgia, serif" font-style="italic">t</tspan>))
  </text>

  <!-- Step 4: A -> B -> C: decision b' -->
  <path d="M738 316 H449" fill="none" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#arrow-purple)"/>
  <rect x="540" y="286" width="98" height="24" rx="12" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.3"/>
  <text x="589" y="303" text-anchor="middle" font-size="13.5" font-weight="600" fill="#5b21b6">decision <tspan font-family="Georgia, serif" font-style="italic">b′</tspan></text>

  <path d="M440 346 H151" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow-slate)"/>
  <rect x="242" y="316" width="98" height="24" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="291" y="333" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">output <tspan font-family="Georgia, serif" font-style="italic">b′</tspan></text>

  <!-- Bottom outcome cards -->
  <rect x="34" y="372" width="398" height="54" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="233" y="394" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">
    If <tspan font-family="Georgia, serif" font-style="italic">z</tspan><tspan baseline-shift="sub" font-size="10">1</tspan> = <tspan font-family="Georgia, serif" font-style="italic">G</tspan>(<tspan font-family="Georgia, serif" font-style="italic">k</tspan><tspan baseline-shift="sub" font-size="10">1</tspan>):  tuple is (<tspan font-family="Georgia, serif" font-style="italic">G</tspan>(<tspan font-family="Georgia, serif" font-style="italic">k</tspan><tspan baseline-shift="sub" font-size="10">1</tspan>), <tspan font-family="Georgia, serif" font-style="italic">G</tspan>(<tspan font-family="Georgia, serif" font-style="italic">k</tspan><tspan baseline-shift="sub" font-size="10">2</tspan>), …, <tspan font-family="Georgia, serif" font-style="italic">G</tspan>(<tspan font-family="Georgia, serif" font-style="italic">k</tspan><tspan baseline-shift="sub" font-size="10" font-family="Georgia, serif" font-style="italic">t</tspan>)) ≡ <tspan font-family="Georgia, serif" font-style="italic">H</tspan><tspan baseline-shift="sub" font-size="10">0</tspan>
  </text>
  <text x="233" y="414" text-anchor="middle" font-size="12.5" fill="#1e3a8a">
    Exact simulation of <tspan font-family="Georgia, serif" font-style="italic">H</tspan><tspan baseline-shift="sub" font-size="9.5">0</tspan> (for step <tspan font-family="Georgia, serif" font-style="italic">i</tspan>: simulates <tspan font-family="Georgia, serif" font-style="italic">H</tspan><tspan baseline-shift="sub" font-size="9.5" font-family="Georgia, serif" font-style="italic">i−1</tspan>)
  </text>

  <rect x="448" y="372" width="398" height="54" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="647" y="394" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">
    If <tspan font-family="Georgia, serif" font-style="italic">z</tspan><tspan baseline-shift="sub" font-size="10">1</tspan> ← <tspan font-family="Georgia, serif" font-style="italic">U</tspan><tspan baseline-shift="sub" font-size="10">2<tspan font-family="Georgia, serif" font-style="italic">λ</tspan></tspan>:  tuple is (<tspan font-family="Georgia, serif" font-style="italic">U</tspan><tspan baseline-shift="sub" font-size="10">2<tspan font-family="Georgia, serif" font-style="italic">λ</tspan></tspan>, <tspan font-family="Georgia, serif" font-style="italic">G</tspan>(<tspan font-family="Georgia, serif" font-style="italic">k</tspan><tspan baseline-shift="sub" font-size="10">2</tspan>), …, <tspan font-family="Georgia, serif" font-style="italic">G</tspan>(<tspan font-family="Georgia, serif" font-style="italic">k</tspan><tspan baseline-shift="sub" font-size="10" font-family="Georgia, serif" font-style="italic">t</tspan>)) ≡ <tspan font-family="Georgia, serif" font-style="italic">H</tspan><tspan baseline-shift="sub" font-size="10">1</tspan>
  </text>
  <text x="647" y="414" text-anchor="middle" font-size="12.5" fill="#047857">
    Exact simulation of <tspan font-family="Georgia, serif" font-style="italic">H</tspan><tspan baseline-shift="sub" font-size="9.5">1</tspan> (for step <tspan font-family="Georgia, serif" font-style="italic">i</tspan>: simulates <tspan font-family="Georgia, serif" font-style="italic">H</tspan><tspan baseline-shift="sub" font-size="9.5" font-family="Georgia, serif" font-style="italic">i</tspan>)
  </text>
</svg>
