<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 270" role="img" aria-labelledby="title desc" font-family="Segoe UI, Arial, sans-serif" fill="#0f172a">
  <title id="title">Recursive view of the GGM construction: F_k(x, y) = G_x(F'_k(y))</title>
  <desc id="desc">Horizontal flow showing how an n-bit GGM evaluation decomposes into an (n-1)-bit GGM evaluation F'_k(y) followed by one final branch G_x. Concrete example: starting from secret key k, evaluating on prefix y = 10 gives F'_k(10) = G_0(G_1(k)), and applying G_1 for final bit x = 1 gives F_k(101) = G_1(F'_k(10)) = G_1(G_0(G_1(k))).</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 1L9 5L0 9Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 1L9 5L0 9Z" fill="#059669"/>
    </marker>
  </defs>

  <rect width="840" height="270" fill="#ffffff"/>

  <!-- Header -->
  <text x="420" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">
    Recursive GGM decomposition: <tspan font-family="Georgia, serif" font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="13" font-family="Georgia, serif" font-style="italic">k</tspan>(<tspan font-family="Georgia, serif" font-style="italic">x</tspan>, <tspan font-family="Georgia, serif" font-style="italic">y</tspan>) = <tspan font-family="Georgia, serif" font-style="italic">G</tspan><tspan baseline-shift="sub" font-size="13" font-family="Georgia, serif" font-style="italic">x</tspan>(<tspan font-family="Georgia, serif" font-style="italic">F′</tspan><tspan baseline-shift="sub" font-size="13" font-family="Georgia, serif" font-style="italic">k</tspan>(<tspan font-family="Georgia, serif" font-style="italic">y</tspan>))
  </text>
  <text x="420" y="54" text-anchor="middle" font-size="14" fill="#64748b">
    Prefix <tspan font-family="Georgia, serif" font-style="italic">y</tspan> ∈ {0, 1}<tspan baseline-shift="super" font-size="10"><tspan font-family="Georgia, serif" font-style="italic">n</tspan>−1</tspan> reaches an internal node at depth <tspan font-family="Georgia, serif" font-style="italic">n</tspan>−1; final bit <tspan font-family="Georgia, serif" font-style="italic">x</tspan> ∈ {0, 1} selects <tspan font-family="Georgia, serif" font-style="italic">G</tspan><tspan baseline-shift="sub" font-size="10">0</tspan> or <tspan font-family="Georgia, serif" font-style="italic">G</tspan><tspan baseline-shift="sub" font-size="10">1</tspan>
  </text>

  <!-- Box 1: Secret key k -->
  <rect x="28" y="88" width="140" height="96" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="98" y="128" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">
    Secret key <tspan font-family="Georgia, serif" font-style="italic">k</tspan>
  </text>
  <text x="98" y="154" text-anchor="middle" font-size="13.5" fill="#475569">
    Root (<tspan font-family="Georgia, serif" font-style="italic">λ</tspan> bits)
  </text>

  <!-- Arrow 1 -->
  <path d="M168 136 H258" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
  <text x="213" y="122" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d4ed8">
    <tspan font-family="Georgia, serif" font-style="italic">y</tspan> = 10
  </text>
  <text x="213" y="156" text-anchor="middle" font-size="12" fill="#475569">
    (<tspan font-family="Georgia, serif" font-style="italic">n</tspan>−1 steps)
  </text>

  <!-- Box 2: F'_k(y) -->
  <rect x="266" y="88" width="218" height="96" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="375" y="118" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">
    <tspan font-family="Georgia, serif" font-style="italic">F′</tspan><tspan baseline-shift="sub" font-size="12" font-family="Georgia, serif" font-style="italic">k</tspan>(<tspan font-family="Georgia, serif" font-style="italic">y</tspan>) = <tspan font-family="Georgia, serif" font-style="italic">F′</tspan><tspan baseline-shift="sub" font-size="12" font-family="Georgia, serif" font-style="italic">k</tspan>(10)
  </text>
  <text x="375" y="144" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d4ed8">
    = <tspan font-family="Georgia, serif" font-style="italic">G</tspan><tspan baseline-shift="sub" font-size="10.5">0</tspan>(<tspan font-family="Georgia, serif" font-style="italic">G</tspan><tspan baseline-shift="sub" font-size="10.5">1</tspan>(<tspan font-family="Georgia, serif" font-style="italic">k</tspan>))
  </text>
  <text x="375" y="168" text-anchor="middle" font-size="12.5" fill="#475569">
    Depth-(<tspan font-family="Georgia, serif" font-style="italic">n</tspan>−1) node (<tspan font-family="Georgia, serif" font-style="italic">λ</tspan> bits)
  </text>

  <!-- Arrow 2 (wide 120px gap so label fits comfortably) -->
  <path d="M484 136 H600" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#arrow-green)"/>
  <text x="542" y="122" text-anchor="middle" font-size="12.5" font-weight="700" fill="#047857">
    Apply <tspan font-family="Georgia, serif" font-style="italic">G</tspan><tspan baseline-shift="sub" font-size="9.5" font-family="Georgia, serif" font-style="italic">x</tspan> (<tspan font-family="Georgia, serif" font-style="italic">x</tspan> = 1)
  </text>
  <text x="542" y="156" text-anchor="middle" font-size="12" fill="#065f46">
    (1 final step)
  </text>

  <!-- Box 3: F_k(x, y) -->
  <rect x="608" y="88" width="204" height="96" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2.1"/>
  <text x="710" y="118" text-anchor="middle" font-size="17" font-weight="700" fill="#065f46">
    <tspan font-family="Georgia, serif" font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="12" font-family="Georgia, serif" font-style="italic">k</tspan>(101) = <tspan font-family="Georgia, serif" font-style="italic">G</tspan><tspan baseline-shift="sub" font-size="12">1</tspan>(<tspan font-family="Georgia, serif" font-style="italic">F′</tspan><tspan baseline-shift="sub" font-size="12" font-family="Georgia, serif" font-style="italic">k</tspan>(10))
  </text>
  <text x="710" y="144" text-anchor="middle" font-size="14.5" font-weight="700" fill="#047857">
    = <tspan font-family="Georgia, serif" font-style="italic">G</tspan><tspan baseline-shift="sub" font-size="10.5">1</tspan>(<tspan font-family="Georgia, serif" font-style="italic">G</tspan><tspan baseline-shift="sub" font-size="10.5">0</tspan>(<tspan font-family="Georgia, serif" font-style="italic">G</tspan><tspan baseline-shift="sub" font-size="10.5">1</tspan>(<tspan font-family="Georgia, serif" font-style="italic">k</tspan>)))
  </text>
  <text x="710" y="168" text-anchor="middle" font-size="12.5" fill="#475569">
    Depth-<tspan font-family="Georgia, serif" font-style="italic">n</tspan> leaf (<tspan font-family="Georgia, serif" font-style="italic">λ</tspan> bits)
  </text>

  <!-- Footer -->
  <rect x="28" y="208" width="784" height="44" rx="9" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.3"/>
  <text x="420" y="228" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0f172a">
    Inductive leverage: first replace <tspan font-family="Georgia, serif" font-style="italic">F′</tspan><tspan baseline-shift="sub" font-size="9.5" font-family="Georgia, serif" font-style="italic">k</tspan>(<tspan font-family="Georgia, serif" font-style="italic">y</tspan>) with a random function <tspan font-family="Georgia, serif" font-style="italic">R′</tspan>(<tspan font-family="Georgia, serif" font-style="italic">y</tspan>) ← <tspan font-family="Georgia, serif" font-style="italic">R</tspan>(<tspan font-family="Georgia, serif" font-style="italic">n</tspan>−1, <tspan font-family="Georgia, serif" font-style="italic">λ</tspan>) (Inductive Hypothesis),
  </text>
  <text x="420" y="245" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0f172a">
    then replace <tspan font-family="Georgia, serif" font-style="italic">G</tspan><tspan baseline-shift="sub" font-size="9.5" font-family="Georgia, serif" font-style="italic">x</tspan>(<tspan font-family="Georgia, serif" font-style="italic">R′</tspan>(<tspan font-family="Georgia, serif" font-style="italic">y</tspan>)) with a random function <tspan font-family="Georgia, serif" font-style="italic">R</tspan>(<tspan font-family="Georgia, serif" font-style="italic">x</tspan>, <tspan font-family="Georgia, serif" font-style="italic">y</tspan>) ← <tspan font-family="Georgia, serif" font-style="italic">R</tspan>(<tspan font-family="Georgia, serif" font-style="italic">n</tspan>, <tspan font-family="Georgia, serif" font-style="italic">λ</tspan>) (Multiple-PRG Lemma).
  </text>
</svg>
