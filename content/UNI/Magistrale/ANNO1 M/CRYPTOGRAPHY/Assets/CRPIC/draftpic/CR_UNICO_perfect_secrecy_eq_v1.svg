<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" role="img" aria-labelledby="eq-title eq-desc" font-family="Segoe UI, Arial, sans-serif">
  <title id="eq-title">Equivalence Cycle of Theorem 1.1</title>
  <desc id="eq-desc">Cyclic implication proof for Theorem 1.1: (i) Perfect Secrecy implies (ii) Independence, which implies (iii) Equal Distributions, which implies (i) Perfect Secrecy.</desc>
  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 1L9 5L0 9Z" fill="#059669"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="798" height="218" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Implication arrows -->
  <path d="M230 75 H291" fill="none" stroke="#059669" stroke-width="2.4" marker-end="url(#arrow-green)"/>
  <path d="M503 75 H564" fill="none" stroke="#059669" stroke-width="2.4" marker-end="url(#arrow-green)"/>
  <path d="M673 122 V164 Q673 174 663 174 H137 Q127 174 127 164 V128" fill="none" stroke="#059669" stroke-width="2.4" marker-end="url(#arrow-green)"/>

  <!-- Arrow step labels -->
  <text x="263" y="62" text-anchor="middle" font-size="12.5" font-weight="700" fill="#047857">Part 1</text>
  <text x="536" y="62" text-anchor="middle" font-size="12.5" font-weight="700" fill="#047857">Part 2</text>

  <rect x="332" y="160" width="136" height="28" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
  <text x="400" y="179" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065f46">Part 3: (iii) ⇒ (i)</text>

  <!-- Node (i) -->
  <rect x="24" y="28" width="206" height="94" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="127" y="54" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">(i)</text>
  <text x="127" y="77" text-anchor="middle" font-size="14" font-weight="600" fill="#1e40af">Perfect Secrecy</text>
  <text x="127" y="102" text-anchor="middle" font-size="11" fill="#475569">Pr[<tspan font-family="Georgia, serif" font-style="italic">M</tspan>=<tspan font-family="Georgia, serif" font-style="italic">m</tspan> | <tspan font-family="Georgia, serif" font-style="italic">C</tspan>=<tspan font-family="Georgia, serif" font-style="italic">c</tspan>] = Pr[<tspan font-family="Georgia, serif" font-style="italic">M</tspan>=<tspan font-family="Georgia, serif" font-style="italic">m</tspan>]</text>

  <!-- Node (ii) -->
  <rect x="297" y="28" width="206" height="94" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="400" y="54" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">(ii)</text>
  <text x="400" y="77" text-anchor="middle" font-size="14" font-weight="600" fill="#1e40af">Independence</text>
  <text x="400" y="102" text-anchor="middle" font-size="10.5" fill="#475569">Pr[<tspan font-family="Georgia, serif" font-style="italic">M</tspan>=<tspan font-family="Georgia, serif" font-style="italic">m</tspan>, <tspan font-family="Georgia, serif" font-style="italic">C</tspan>=<tspan font-family="Georgia, serif" font-style="italic">c</tspan>] = Pr[<tspan font-family="Georgia, serif" font-style="italic">M</tspan>=<tspan font-family="Georgia, serif" font-style="italic">m</tspan>]Pr[<tspan font-family="Georgia, serif" font-style="italic">C</tspan>=<tspan font-family="Georgia, serif" font-style="italic">c</tspan>]</text>

  <!-- Node (iii) -->
  <rect x="570" y="28" width="206" height="94" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="673" y="54" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">(iii)</text>
  <text x="673" y="77" text-anchor="middle" font-size="14" font-weight="600" fill="#1e40af">Equal Distributions</text>
  <text x="673" y="102" text-anchor="middle" font-size="10.2" fill="#475569">Pr[Enc(<tspan font-family="Georgia, serif" font-style="italic">K</tspan>,<tspan font-family="Georgia, serif" font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="8">0</tspan>)=<tspan font-family="Georgia, serif" font-style="italic">c</tspan>] = Pr[Enc(<tspan font-family="Georgia, serif" font-style="italic">K</tspan>,<tspan font-family="Georgia, serif" font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="8">1</tspan>)=<tspan font-family="Georgia, serif" font-style="italic">c</tspan>]</text>
</svg>
