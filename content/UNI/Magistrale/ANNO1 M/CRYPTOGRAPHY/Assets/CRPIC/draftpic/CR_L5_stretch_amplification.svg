<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 280" role="img" aria-labelledby="title desc">
  <title id="title">Stretch amplification construction G^ell</title>
  <desc id="desc">Starting from a uniform seed s_0, G is applied ell times. Each call G(s_{i-1}) = (s_i, b_i) passes the state s_i to the next call and emits the bit b_i. The output is (b_1, ..., b_ell, s_ell): ell bits followed by the final lambda-bit state. Intermediate states are not output.</desc>
  <style>
    svg { font-size: 18px; }
    text { font-family: 'Segoe UI', Arial, sans-serif; fill: #1e293b; }
    .m { font-family: 'Times New Roman', Times, serif; font-style: italic; }
    tspan.m { font-size: 1.12em; }
    tspan[baseline-shift] { font-size: 0.72em; }
    .n { font-style: normal; }
    .small { font-size: 14px; fill: #475569; }
    .seed { fill: #eef6ff; stroke: #60a5fa; stroke-width: 1.6; }
    .fn { fill: #e0e7ff; stroke: #6366f1; stroke-width: 1.6; }
    .bit { fill: #edfbf3; stroke: #52b788; stroke-width: 1.6; }
    .ln-st { fill: none; stroke: #3b6fd8; stroke-width: 1.7; }
    .ln-bit { fill: none; stroke: #2d8a61; stroke-width: 1.7; }
    .st { fill: #1e3a8a; }
  </style>
  <defs>
    <marker id="ar-st" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 1L9 5L0 9Z" fill="#3b6fd8"/>
    </marker>
    <marker id="ar-bit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 1L9 5L0 9Z" fill="#2d8a61"/>
    </marker>
  </defs>
  <rect width="780" height="280" rx="12" fill="#ffffff"/>

  <text class="small" x="390" y="28" text-anchor="middle" fill="#3b5998">intermediate states <tspan class="m">s</tspan><tspan baseline-shift="-0.35em">1</tspan>, …, <tspan class="m">s</tspan><tspan class="m" baseline-shift="-0.35em">ℓ</tspan><tspan baseline-shift="-0.35em">−1</tspan> stay internal</text>

  <!-- Chain -->
  <rect class="seed" x="20" y="50" width="120" height="50" rx="7"/>
  <text x="80" y="82" text-anchor="middle" font-size="20" fill="#1e3a8a"><tspan class="m">s</tspan><tspan baseline-shift="-0.35em">0</tspan> ← <tspan class="m">U</tspan><tspan class="m" baseline-shift="-0.35em">λ</tspan></text>
  <path class="ln-st" d="M140 75H178" marker-end="url(#ar-st)"/>

  <rect class="fn" x="180" y="50" width="60" height="50" rx="7"/>
  <text class="m" x="210" y="83" text-anchor="middle" font-size="22" fill="#312e81">G</text>
  <path class="ln-st" d="M240 75H298" marker-end="url(#ar-st)"/>
  <text class="m st" x="269" y="63" text-anchor="middle">s<tspan class="n" baseline-shift="-0.35em">1</tspan></text>

  <rect class="fn" x="300" y="50" width="60" height="50" rx="7"/>
  <text class="m" x="330" y="83" text-anchor="middle" font-size="22" fill="#312e81">G</text>
  <path class="ln-st" d="M360 75H404" marker-end="url(#ar-st)"/>
  <text class="m st" x="382" y="63" text-anchor="middle">s<tspan class="n" baseline-shift="-0.35em">2</tspan></text>

  <text x="430" y="81" text-anchor="middle" font-size="22" fill="#64748b">⋯</text>
  <path class="ln-st" d="M456 75H518" marker-end="url(#ar-st)"/>
  <text class="m st" x="487" y="63" text-anchor="middle">s<tspan baseline-shift="-0.35em">ℓ<tspan class="n">−1</tspan></tspan></text>

  <rect class="fn" x="520" y="50" width="60" height="50" rx="7"/>
  <text class="m" x="550" y="83" text-anchor="middle" font-size="22" fill="#312e81">G</text>

  <!-- final state goes to output (pastel blue) -->
  <path class="ln-st" d="M580 75H680V168" marker-end="url(#ar-st)"/>
  <text class="m st" x="635" y="63" text-anchor="middle">s<tspan baseline-shift="-0.35em">ℓ</tspan></text>

  <!-- bits go to output (pastel mint) -->
  <path class="ln-bit" d="M210 100V168" marker-end="url(#ar-bit)"/>
  <path class="ln-bit" d="M330 100V168" marker-end="url(#ar-bit)"/>
  <path class="ln-bit" d="M550 100V168" marker-end="url(#ar-bit)"/>

  <!-- Output tuple -->
  <text x="164" y="199" font-size="20" text-anchor="end"><tspan class="m">G</tspan><tspan class="m" baseline-shift="0.6em">ℓ</tspan>(<tspan class="m">s</tspan><tspan baseline-shift="-0.35em">0</tspan>) = (</text>
  <rect class="bit" x="180" y="170" width="60" height="44" rx="6"/>
  <text x="210" y="199" text-anchor="middle" font-size="20" fill="#14532d"><tspan class="m">b</tspan><tspan baseline-shift="-0.35em">1</tspan></text>
  <text x="270" y="203" text-anchor="middle" font-size="20">,</text>
  <rect class="bit" x="300" y="170" width="60" height="44" rx="6"/>
  <text x="330" y="199" text-anchor="middle" font-size="20" fill="#14532d"><tspan class="m">b</tspan><tspan baseline-shift="-0.35em">2</tspan></text>
  <text x="430" y="199" text-anchor="middle" font-size="20">, … ,</text>
  <rect class="bit" x="520" y="170" width="60" height="44" rx="6"/>
  <text x="550" y="199" text-anchor="middle" font-size="20" fill="#14532d"><tspan class="m">b</tspan><tspan class="m" baseline-shift="-0.35em">ℓ</tspan></text>
  <text x="600" y="203" text-anchor="middle" font-size="20">,</text>
  <rect class="seed" x="620" y="170" width="120" height="44" rx="6"/>
  <text x="680" y="199" text-anchor="middle" font-size="20" fill="#1e3a8a"><tspan class="m">s</tspan><tspan class="m" baseline-shift="-0.35em">ℓ</tspan></text>
  <text x="748" y="199" font-size="20">)</text>

  <!-- length brackets -->
  <path d="M180 226V234H580V226" fill="none" stroke="#52b788" stroke-width="1.5"/>
  <text class="small" x="380" y="256" text-anchor="middle" fill="#14532d"><tspan class="m">ℓ</tspan> output bits</text>
  <path d="M620 226V234H740V226" fill="none" stroke="#60a5fa" stroke-width="1.5"/>
  <text class="small" x="680" y="256" text-anchor="middle" fill="#1e3a8a"><tspan class="m">λ</tspan> bits (final state)</text>
</svg>
