<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 355" role="img" aria-labelledby="title desc" font-family="Segoe UI, Arial, sans-serif" fill="#0f172a">
  <title id="title">Game hopping roadmap for CPA security of the PRF-based scheme</title>
  <desc id="desc">Four-game chain from G(lambda, 0) to G(lambda, 1): G(lambda, 0) is computationally indistinguishable from H(lambda, 0) by Lemma 1 (PRF security), H(lambda, 0) is statistically indistinguishable from H(lambda, 1) by Lemma 2 (statistical security up to random-input collisions), and H(lambda, 1) is computationally indistinguishable from G(lambda, 1) by Lemma 1. Combining the hops via the triangle inequality proves G(lambda, 0) approx_c G(lambda, 1).</desc>

  <rect width="900" height="355" fill="#ffffff"/>

  <!-- Header -->
  <text x="450" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">
    Game hopping: bridging <tspan font-family="Georgia, serif" font-style="italic">G</tspan>(<tspan font-family="Georgia, serif" font-style="italic">λ</tspan>, 0) and <tspan font-family="Georgia, serif" font-style="italic">G</tspan>(<tspan font-family="Georgia, serif" font-style="italic">λ</tspan>, 1) via ideal-function hybrids
  </text>
  <text x="450" y="57" text-anchor="middle" font-size="14.5" fill="#64748b">
    Two computational PRF hops (Lemma 1) flanking one statistical hop (Lemma 2)
  </text>

  <!-- Card 1: G(lambda, 0) -->
  <rect x="34" y="84" width="154" height="122" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <rect x="52" y="96" width="118" height="22" rx="11" fill="#dbeafe"/>
  <text x="111" y="111" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e40af">REAL (b = 0)</text>
  <text x="111" y="152" text-anchor="middle" font-size="25" font-weight="700" fill="#1e3a8a"><tspan font-family="Georgia, serif" font-style="italic">G</tspan>(<tspan font-family="Georgia, serif" font-style="italic">λ</tspan>, 0)</text>
  <text x="111" y="186" text-anchor="middle" font-size="15" font-weight="600" fill="#334155"><tspan font-family="Georgia, serif" font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="10.5" font-family="Georgia, serif" font-style="italic">k</tspan>(<tspan font-family="Georgia, serif" font-style="italic">r</tspan>*) ⊕ <tspan font-family="Georgia, serif" font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="10.5">0</tspan>*</text>

  <!-- Hop 1: ≈_c -->
  <text x="224" y="148" text-anchor="middle" font-size="28" font-weight="700" fill="#2563eb">≈<tspan baseline-shift="sub" font-size="16" font-family="Georgia, serif" font-style="italic">c</tspan></text>
  <line x1="224" y1="168" x2="224" y2="216" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="3 3"/>
  <rect x="178" y="218" width="92" height="40" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
  <text x="224" y="235" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">Lemma 1</text>
  <text x="224" y="251" text-anchor="middle" font-size="11.5" fill="#475569">PRF security</text>

  <!-- Card 2: H(lambda, 0) -->
  <rect x="260" y="84" width="154" height="122" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="1.8"/>
  <rect x="278" y="96" width="118" height="22" rx="11" fill="#d1fae5"/>
  <text x="337" y="111" text-anchor="middle" font-size="11.5" font-weight="700" fill="#065f46">HYBRID (b = 0)</text>
  <text x="337" y="152" text-anchor="middle" font-size="25" font-weight="700" fill="#065f46"><tspan font-family="Georgia, serif" font-style="italic">H</tspan>(<tspan font-family="Georgia, serif" font-style="italic">λ</tspan>, 0)</text>
  <text x="337" y="186" text-anchor="middle" font-size="15" font-weight="600" fill="#334155"><tspan font-family="Georgia, serif" font-style="italic">R</tspan>(<tspan font-family="Georgia, serif" font-style="italic">r</tspan>*) ⊕ <tspan font-family="Georgia, serif" font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="10.5">0</tspan>*</text>

  <!-- Hop 2: ≈_s -->
  <text x="450" y="148" text-anchor="middle" font-size="28" font-weight="700" fill="#059669">≈<tspan baseline-shift="sub" font-size="16" font-family="Georgia, serif" font-style="italic">s</tspan></text>
  <line x1="450" y1="168" x2="450" y2="216" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="3 3"/>
  <rect x="404" y="218" width="92" height="40" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.2"/>
  <text x="450" y="235" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">Lemma 2</text>
  <text x="450" y="251" text-anchor="middle" font-size="11.5" fill="#065f46">statistical</text>

  <!-- Card 3: H(lambda, 1) -->
  <rect x="486" y="84" width="154" height="122" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="1.8"/>
  <rect x="504" y="96" width="118" height="22" rx="11" fill="#d1fae5"/>
  <text x="563" y="111" text-anchor="middle" font-size="11.5" font-weight="700" fill="#065f46">HYBRID (b = 1)</text>
  <text x="563" y="152" text-anchor="middle" font-size="25" font-weight="700" fill="#065f46"><tspan font-family="Georgia, serif" font-style="italic">H</tspan>(<tspan font-family="Georgia, serif" font-style="italic">λ</tspan>, 1)</text>
  <text x="563" y="186" text-anchor="middle" font-size="15" font-weight="600" fill="#334155"><tspan font-family="Georgia, serif" font-style="italic">R</tspan>(<tspan font-family="Georgia, serif" font-style="italic">r</tspan>*) ⊕ <tspan font-family="Georgia, serif" font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="10.5">1</tspan>*</text>

  <!-- Hop 3: ≈_c -->
  <text x="676" y="148" text-anchor="middle" font-size="28" font-weight="700" fill="#2563eb">≈<tspan baseline-shift="sub" font-size="16" font-family="Georgia, serif" font-style="italic">c</tspan></text>
  <line x1="676" y1="168" x2="676" y2="216" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="3 3"/>
  <rect x="630" y="218" width="92" height="40" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
  <text x="676" y="235" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">Lemma 1</text>
  <text x="676" y="251" text-anchor="middle" font-size="11.5" fill="#475569">PRF security</text>

  <!-- Card 4: G(lambda, 1) -->
  <rect x="712" y="84" width="154" height="122" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <rect x="730" y="96" width="118" height="22" rx="11" fill="#dbeafe"/>
  <text x="789" y="111" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e40af">REAL (b = 1)</text>
  <text x="789" y="152" text-anchor="middle" font-size="25" font-weight="700" fill="#1e3a8a"><tspan font-family="Georgia, serif" font-style="italic">G</tspan>(<tspan font-family="Georgia, serif" font-style="italic">λ</tspan>, 1)</text>
  <text x="789" y="186" text-anchor="middle" font-size="15" font-weight="600" fill="#334155"><tspan font-family="Georgia, serif" font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="10.5" font-family="Georgia, serif" font-style="italic">k</tspan>(<tspan font-family="Georgia, serif" font-style="italic">r</tspan>*) ⊕ <tspan font-family="Georgia, serif" font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="10.5">1</tspan>*</text>

  <!-- Triangle inequality footer -->
  <rect x="34" y="278" width="832" height="58" rx="11" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="450" y="302" text-anchor="middle" font-size="14.5" font-weight="600" fill="#0f172a">
    Chain:  <tspan font-family="Georgia, serif" font-style="italic">G</tspan>(<tspan font-family="Georgia, serif" font-style="italic">λ</tspan>, 0)  ≈<tspan baseline-shift="sub" font-size="10.5" font-family="Georgia, serif" font-style="italic">c</tspan>  <tspan font-family="Georgia, serif" font-style="italic">H</tspan>(<tspan font-family="Georgia, serif" font-style="italic">λ</tspan>, 0)  ≈<tspan baseline-shift="sub" font-size="10.5" font-family="Georgia, serif" font-style="italic">s</tspan>  <tspan font-family="Georgia, serif" font-style="italic">H</tspan>(<tspan font-family="Georgia, serif" font-style="italic">λ</tspan>, 1)  ≈<tspan baseline-shift="sub" font-size="10.5" font-family="Georgia, serif" font-style="italic">c</tspan>  <tspan font-family="Georgia, serif" font-style="italic">G</tspan>(<tspan font-family="Georgia, serif" font-style="italic">λ</tspan>, 1)
  </text>
  <text x="450" y="324" text-anchor="middle" font-size="14" fill="#475569">
    Since statistical closeness (≈<tspan baseline-shift="sub" font-size="10" font-family="Georgia, serif" font-style="italic">s</tspan>) implies computational closeness (≈<tspan baseline-shift="sub" font-size="10" font-family="Georgia, serif" font-style="italic">c</tspan>), the triangle inequality yields  <tspan font-weight="700" fill="#1e40af"><tspan font-family="Georgia, serif" font-style="italic">G</tspan>(<tspan font-family="Georgia, serif" font-style="italic">λ</tspan>, 0) ≈<tspan baseline-shift="sub" font-size="10" font-family="Georgia, serif" font-style="italic">c</tspan> <tspan font-family="Georgia, serif" font-style="italic">G</tspan>(<tspan font-family="Georgia, serif" font-style="italic">λ</tspan>, 1)</tspan>
  </text>
</svg>
