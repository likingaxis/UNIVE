  <!-- a = 1 --><circle cx="346" cy="238" r="3.5" fill="#d6d0c4"/><circle cx="378" cy="238" r="9" fill="#2a9d8f" stroke="#1f6f66" stroke-width="1.3"/><circle cx="410" cy="238" r="3.5" fill="#d6d0c4"/><circle cx="442" cy="238" r="3.5" fill="#d6d0c4"/><circle cx="474" cy="238" r="3.5" fill="#d6d0c4"/>
  <!-- a = 2 --><circle cx="346" cy="268" r="3.5" fill="#d6d0c4"/><circle cx="378" cy="268" r="3.5" fill="#d6d0c4"/><circle cx="410" cy="268" r="3.5" fill="#d6d0c4"/><circle cx="442" cy="268" r="3.5" fill="#d6d0c4"/><circle cx="474" cy="268" r="9" fill="#2a9d8f" stroke="#1f6f66" stroke-width="1.3"/>
