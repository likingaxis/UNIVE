  <text x="314" y="194" text-anchor="middle" font-size="11.5" fill="#57534e"><tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">a</tspan></text>
  <g font-size="11.5" fill="#8a847b" text-anchor="middle">
