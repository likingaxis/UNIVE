  <!-- equations under the grids -->
  <text x="146" y="367" text-anchor="middle" font-size="13" fill="#57534e">every (<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">a</tspan>, <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">b</tspan>) is still possible</text>
  <circle cx="336" cy="363" r="6" fill="#2a9d8f" stroke="#1f6f66" stroke-width="1.2"/>
  <text x="348" y="367" font-size="13.5" font-weight="700" fill="#115e59">2<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">a</tspan> + <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">b</tspan> ≡ 3 (mod 5)</text>
  <circle cx="608" cy="356" r="6" fill="#fcfbf8" stroke="#2a9d8f" stroke-width="2"/>
  <text x="620" y="360.5" font-size="13.5" font-weight="700" fill="#115e59">2<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">a</tspan> + <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">b</tspan> ≡ 3</text>
  <circle cx="608" cy="377" r="6" fill="#fcfbf8" stroke="#c98a0b" stroke-width="2" stroke-dasharray="3 2"/>
  <text x="620" y="381.5" font-size="13.5" font-weight="700" fill="#92600a"><tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">a</tspan> + <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">b</tspan> ≡ 1</text>

  <!-- key counts -->
  <text x="146" y="420" text-anchor="middle" fill="#1f1d1a"><tspan font-family="Georgia, 'Times New Roman', serif" font-size="30">25</tspan><tspan font-size="13.5" font-weight="600" dx="6">possible keys</tspan></text>
  <text x="400" y="420" text-anchor="middle" fill="#115e59"><tspan font-family="Georgia, 'Times New Roman', serif" font-size="30">5</tspan><tspan font-size="13.5" font-weight="600" dx="6">keys left</tspan></text>
  <text x="654" y="420" text-anchor="middle" fill="#9f1239"><tspan font-family="Georgia, 'Times New Roman', serif" font-size="30">1</tspan><tspan font-size="13.5" font-weight="600" dx="6">key left: (2, 4)</tspan></text>

  <!-- verdict callouts -->
  <rect x="36" y="434" width="220" height="44" rx="6" fill="#f1efe9"/>
  <rect x="36" y="434" width="3.5" height="44" rx="1.75" fill="#8a847b"/>
