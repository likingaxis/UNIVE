  <text x="148" y="469" text-anchor="middle" font-size="11.5" fill="#57534e">blind guess of the tag</text>
  <rect x="290" y="434" width="220" height="44" rx="6" fill="#e6f4f1"/>
  <rect x="290" y="434" width="3.5" height="44" rx="1.75" fill="#2a9d8f"/>
  <text x="402" y="452" text-anchor="middle" font-size="13.5" font-weight="700" fill="#115e59">Pr[forge] ≤ 1/5  ✓</text>
  <text x="402" y="469" text-anchor="middle" font-size="11.5" fill="#1f6f66">a new <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan>′ still has 5 possible tags</text>
  <rect x="544" y="434" width="220" height="44" rx="6" fill="#fbecee"/>
  <rect x="544" y="434" width="3.5" height="44" rx="1.75" fill="#e05a6d"/>
  <text x="656" y="452" text-anchor="middle" font-size="13.5" font-weight="700" fill="#9f1239">Pr[forge] = 1  ✗</text>
  <text x="656" y="469" text-anchor="middle" font-size="11.5" fill="#9f1239">forge τ<tspan baseline-shift="sub" font-size="9">3</tspan> = (2·<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="9">3</tspan> + 4) mod 5</text>
</svg>
