  <!-- ===== column 3: Two tags seen ===== -->
  <text x="654" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#9f1239">Two tags seen</text>
  <text x="654" y="159" text-anchor="middle" font-size="12.5" fill="#57534e">(2, 3)  and  (<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="9">2</tspan>, τ<tspan baseline-shift="sub" font-size="9">2</tspan>) = (1, 1)</text>
  <path d="M565 175 L583 191" stroke="#d6d0c4" stroke-width="1"/>
  <text x="581" y="182" text-anchor="middle" font-size="11.5" fill="#57534e"><tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">b</tspan></text>
  <text x="568" y="194" text-anchor="middle" font-size="11.5" fill="#57534e"><tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">a</tspan></text>
  <g font-size="11.5" fill="#8a847b" text-anchor="middle">
