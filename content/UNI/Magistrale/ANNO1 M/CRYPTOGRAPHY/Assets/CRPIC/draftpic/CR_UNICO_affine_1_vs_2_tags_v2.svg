  <!-- a = 1 --><circle cx="600" cy="238" r="8" fill="#fcfbf8" stroke="#c98a0b" stroke-width="2.2" stroke-dasharray="3.6 2.4"/><circle cx="632" cy="238" r="8" fill="#fcfbf8" stroke="#2a9d8f" stroke-width="2.2"/><circle cx="664" cy="238" r="3.5" fill="#d6d0c4"/><circle cx="696" cy="238" r="3.5" fill="#d6d0c4"/><circle cx="728" cy="238" r="3.5" fill="#d6d0c4"/>
  <!-- a = 2 --><circle cx="600" cy="268" r="3.5" fill="#d6d0c4"/><circle cx="632" cy="268" r="3.5" fill="#d6d0c4"/><circle cx="664" cy="268" r="3.5" fill="#d6d0c4"/><circle cx="696" cy="268" r="3.5" fill="#d6d0c4"/><circle cx="728" cy="268" r="15.5" fill="none" stroke="#e05a6d" stroke-width="1.4" stroke-opacity="0.45"/><circle cx="728" cy="268" r="10.5" fill="#e05a6d" stroke="#9f1239" stroke-width="1.8"/>
  <!-- a = 3 --><circle cx="600" cy="298" r="3.5" fill="#d6d0c4"/><circle cx="632" cy="298" r="3.5" fill="#d6d0c4"/><circle cx="664" cy="298" r="8" fill="#fcfbf8" stroke="#2a9d8f" stroke-width="2.2"/><circle cx="696" cy="298" r="8" fill="#fcfbf8" stroke="#c98a0b" stroke-width="2.2" stroke-dasharray="3.6 2.4"/><circle cx="728" cy="298" r="3.5" fill="#d6d0c4"/>
