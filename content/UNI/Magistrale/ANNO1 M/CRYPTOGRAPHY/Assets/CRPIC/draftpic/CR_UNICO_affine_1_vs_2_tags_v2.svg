  <!-- a = 3 --><circle cx="92" cy="298" r="9" fill="#ece8df" stroke="#8a847b" stroke-width="1.2"/><circle cx="124" cy="298" r="9" fill="#ece8df" stroke="#8a847b" stroke-width="1.2"/><circle cx="156" cy="298" r="9" fill="#ece8df" stroke="#8a847b" stroke-width="1.2"/><circle cx="188" cy="298" r="9" fill="#ece8df" stroke="#8a847b" stroke-width="1.2"/><circle cx="220" cy="298" r="9" fill="#ece8df" stroke="#8a847b" stroke-width="1.2"/>
  <!-- a = 4 --><circle cx="92" cy="328" r="9" fill="#ece8df" stroke="#8a847b" stroke-width="1.2"/><circle cx="124" cy="328" r="9" fill="#ece8df" stroke="#8a847b" stroke-width="1.2"/><circle cx="156" cy="328" r="9" fill="#ece8df" stroke="#8a847b" stroke-width="1.2"/><circle cx="188" cy="328" r="9" fill="#ece8df" stroke="#8a847b" stroke-width="1.2"/><circle cx="220" cy="328" r="9" fill="#ece8df" stroke="#8a847b" stroke-width="1.2"/>

  <!-- ===== column 2: One tag seen ===== -->
  <text x="400" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#115e59">One tag seen</text>
  <text x="400" y="159" text-anchor="middle" font-size="12.5" fill="#57534e">(<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="9">1</tspan>, τ<tspan baseline-shift="sub" font-size="9">1</tspan>) = (2, 3)</text>
