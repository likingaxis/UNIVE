<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 320" role="img" aria-labelledby="mg-title mg-desc" font-family="'Segoe UI', Arial, sans-serif">
  <title id="mg-title">Joint vs. Marginal Probabilities in a 4x4 Pairwise-Independent Tag Table</title>
  <desc id="mg-desc">Three 4x4 grids over 2-bit tags {00, 01, 10, 11}, each cell having probability 1/16. Left panel highlights row tau = 00 (4 cells, sum 4/16 = 1/4 = 1/|T|). Middle panel highlights column tau' = 00 (4 cells, sum 4/16 = 1/4). Right panel highlights single cell (00, 00) (1 cell, probability 1/16 = 1/|T|^2). Dividing 1/16 by 4/16 yields conditional forgery probability 1/4 = 1/|T|.</desc>

  <rect x="1" y="1" width="838" height="318" rx="14" fill="#fcfbf8" stroke="#e7e2d9" stroke-width="1.5"/>

  <text x="420" y="28" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1f1d1a">
    Marginalizing the Joint Table (Example: 2-bit tags <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">T</tspan> = {00, 01, 10, 11}, |<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">T</tspan>| = 4)
  </text>

  <!-- ==================== PANEL 1: Fix tau = 00 (Row) ==================== -->
  <rect x="18" y="44" width="256" height="214" rx="10" fill="#f5f4ef" stroke="#d6d0c4" stroke-width="1.5"/>
  <rect x="30" y="54" width="232" height="26" rx="7" fill="#e6f4f1" stroke="#2a9d8f" stroke-width="1.4"/>
  <text x="146" y="71" text-anchor="middle" font-size="12.5" font-weight="700" fill="#115e59">1. Fix τ = 00 (sum row over τ')</text>

  <g font-size="10.5" font-weight="600" fill="#57534e" text-anchor="middle">
    <text x="46" y="96">τ \ τ'</text>
    <text x="86" y="96">00</text><text x="132" y="96">01</text><text x="178" y="96">10</text><text x="224" y="96">11</text>
    <text x="46" y="117">00</text><text x="46" y="145">01</text><text x="46" y="173">10</text><text x="46" y="201">11</text>
  </g>

  <!-- Row 00 highlighted green -->
  <rect x="66" y="102" width="40" height="22" rx="4" fill="#d0ebe5" stroke="#2a9d8f" stroke-width="1.5"/>
  <rect x="112" y="102" width="40" height="22" rx="4" fill="#d0ebe5" stroke="#2a9d8f" stroke-width="1.5"/>
  <rect x="158" y="102" width="40" height="22" rx="4" fill="#d0ebe5" stroke="#2a9d8f" stroke-width="1.5"/>
  <rect x="204" y="102" width="40" height="22" rx="4" fill="#d0ebe5" stroke="#2a9d8f" stroke-width="1.5"/>
  <!-- Rows 01, 10, 11 neutral -->
  <g fill="#ffffff" stroke="#d6d0c4" stroke-width="1">
    <rect x="66" y="130" width="40" height="22" rx="4"/><rect x="112" y="130" width="40" height="22" rx="4"/><rect x="158" y="130" width="40" height="22" rx="4"/><rect x="204" y="130" width="40" height="22" rx="4"/>
    <rect x="66" y="158" width="40" height="22" rx="4"/><rect x="112" y="158" width="40" height="22" rx="4"/><rect x="158" y="158" width="40" height="22" rx="4"/><rect x="204" y="158" width="40" height="22" rx="4"/>
    <rect x="66" y="186" width="40" height="22" rx="4"/><rect x="112" y="186" width="40" height="22" rx="4"/><rect x="158" y="186" width="40" height="22" rx="4"/><rect x="204" y="186" width="40" height="22" rx="4"/>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#78716c">
    <text x="86" y="117" font-weight="700" fill="#115e59">1/16</text><text x="132" y="117" font-weight="700" fill="#115e59">1/16</text><text x="178" y="117" font-weight="700" fill="#115e59">1/16</text><text x="224" y="117" font-weight="700" fill="#115e59">1/16</text>
    <text x="86" y="145">1/16</text><text x="132" y="145">1/16</text><text x="178" y="145">1/16</text><text x="224" y="145">1/16</text>
    <text x="86" y="173">1/16</text><text x="132" y="173">1/16</text><text x="178" y="173">1/16</text><text x="224" y="173">1/16</text>
    <text x="86" y="201">1/16</text><text x="132" y="201">1/16</text><text x="178" y="201">1/16</text><text x="224" y="201">1/16</text>
  </g>
  <rect x="30" y="220" width="232" height="28" rx="6" fill="#e6f4f1" stroke="#2a9d8f" stroke-width="1.2"/>
  <text x="146" y="238" text-anchor="middle" font-size="11.5" font-weight="700" fill="#115e59">
    Pr[<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="8.5" font-style="italic">K</tspan>(<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan>) = 00] = 4/16 = 1/4
  </text>

  <!-- ==================== PANEL 2: Fix tau' = 00 (Column) ==================== -->
  <rect x="292" y="44" width="256" height="214" rx="10" fill="#f5f4ef" stroke="#d6d0c4" stroke-width="1.5"/>
  <rect x="304" y="54" width="232" height="26" rx="7" fill="#eef0fb" stroke="#4338ca" stroke-width="1.4"/>
  <text x="420" y="71" text-anchor="middle" font-size="12.5" font-weight="700" fill="#312e81">2. Fix τ' = 00 (sum col over τ)</text>

  <g font-size="10.5" font-weight="600" fill="#57534e" text-anchor="middle">
    <text x="320" y="96">τ \ τ'</text>
    <text x="360" y="96">00</text><text x="406" y="96">01</text><text x="452" y="96">10</text><text x="498" y="96">11</text>
    <text x="320" y="117">00</text><text x="320" y="145">01</text><text x="320" y="173">10</text><text x="320" y="201">11</text>
  </g>

  <!-- Col 00 highlighted blue -->
  <g fill="#dfe3fa" stroke="#4338ca" stroke-width="1.5">
    <rect x="340" y="102" width="40" height="22" rx="4"/>
    <rect x="340" y="130" width="40" height="22" rx="4"/>
    <rect x="340" y="158" width="40" height="22" rx="4"/>
    <rect x="340" y="186" width="40" height="22" rx="4"/>
  </g>
  <!-- Other columns neutral -->
  <g fill="#ffffff" stroke="#d6d0c4" stroke-width="1">
    <rect x="386" y="102" width="40" height="22" rx="4"/><rect x="432" y="102" width="40" height="22" rx="4"/><rect x="478" y="102" width="40" height="22" rx="4"/>
    <rect x="386" y="130" width="40" height="22" rx="4"/><rect x="432" y="130" width="40" height="22" rx="4"/><rect x="478" y="130" width="40" height="22" rx="4"/>
    <rect x="386" y="158" width="40" height="22" rx="4"/><rect x="432" y="158" width="40" height="22" rx="4"/><rect x="478" y="158" width="40" height="22" rx="4"/>
    <rect x="386" y="186" width="40" height="22" rx="4"/><rect x="432" y="186" width="40" height="22" rx="4"/><rect x="478" y="186" width="40" height="22" rx="4"/>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#78716c">
    <text x="360" y="117" font-weight="700" fill="#312e81">1/16</text><text x="406" y="117">1/16</text><text x="452" y="117">1/16</text><text x="498" y="117">1/16</text>
    <text x="360" y="145" font-weight="700" fill="#312e81">1/16</text><text x="406" y="145">1/16</text><text x="452" y="145">1/16</text><text x="498" y="145">1/16</text>
    <text x="360" y="173" font-weight="700" fill="#312e81">1/16</text><text x="406" y="173">1/16</text><text x="452" y="173">1/16</text><text x="498" y="173">1/16</text>
    <text x="360" y="201" font-weight="700" fill="#312e81">1/16</text><text x="406" y="201">1/16</text><text x="452" y="201">1/16</text><text x="498" y="201">1/16</text>
  </g>
  <rect x="304" y="220" width="232" height="28" rx="6" fill="#eef0fb" stroke="#4338ca" stroke-width="1.2"/>
  <text x="420" y="238" text-anchor="middle" font-size="11.5" font-weight="700" fill="#312e81">
    Pr[<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="8.5" font-style="italic">K</tspan>(<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan>') = 00] = 4/16 = 1/4
  </text>

  <!-- ==================== PANEL 3: Fix both (00, 00) ==================== -->
  <rect x="566" y="44" width="256" height="214" rx="10" fill="#f5f4ef" stroke="#d6d0c4" stroke-width="1.5"/>
  <rect x="578" y="54" width="232" height="26" rx="7" fill="#fbecee" stroke="#e05a6d" stroke-width="1.4"/>
  <text x="694" y="71" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9f1239">3. Fix both τ=00 ∧ τ'=00</text>

  <g font-size="10.5" font-weight="600" fill="#57534e" text-anchor="middle">
    <text x="594" y="96">τ \ τ'</text>
    <text x="634" y="96">00</text><text x="680" y="96">01</text><text x="726" y="96">10</text><text x="772" y="96">11</text>
    <text x="594" y="117">00</text><text x="594" y="145">01</text><text x="594" y="173">10</text><text x="594" y="201">11</text>
  </g>

  <!-- Single cell (00, 00) highlighted red -->
  <rect x="614" y="102" width="40" height="22" rx="4" fill="#f6d8dd" stroke="#e05a6d" stroke-width="1.8"/>
  <g fill="#ffffff" stroke="#d6d0c4" stroke-width="1">
    <rect x="660" y="102" width="40" height="22" rx="4"/><rect x="706" y="102" width="40" height="22" rx="4"/><rect x="752" y="102" width="40" height="22" rx="4"/>
    <rect x="614" y="130" width="40" height="22" rx="4"/><rect x="660" y="130" width="40" height="22" rx="4"/><rect x="706" y="130" width="40" height="22" rx="4"/><rect x="752" y="130" width="40" height="22" rx="4"/>
    <rect x="614" y="158" width="40" height="22" rx="4"/><rect x="660" y="158" width="40" height="22" rx="4"/><rect x="706" y="158" width="40" height="22" rx="4"/><rect x="752" y="158" width="40" height="22" rx="4"/>
    <rect x="614" y="186" width="40" height="22" rx="4"/><rect x="660" y="186" width="40" height="22" rx="4"/><rect x="706" y="186" width="40" height="22" rx="4"/><rect x="752" y="186" width="40" height="22" rx="4"/>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#78716c">
    <text x="634" y="117" font-weight="700" fill="#9f1239">1/16</text><text x="680" y="117">1/16</text><text x="726" y="117">1/16</text><text x="772" y="117">1/16</text>
    <text x="634" y="145">1/16</text><text x="680" y="145">1/16</text><text x="726" y="145">1/16</text><text x="772" y="145">1/16</text>
    <text x="634" y="173">1/16</text><text x="680" y="173">1/16</text><text x="726" y="173">1/16</text><text x="772" y="173">1/16</text>
    <text x="634" y="201">1/16</text><text x="680" y="201">1/16</text><text x="726" y="201">1/16</text><text x="772" y="201">1/16</text>
  </g>
  <rect x="578" y="220" width="232" height="28" rx="6" fill="#fbecee" stroke="#e05a6d" stroke-width="1.2"/>
  <text x="694" y="238" text-anchor="middle" font-size="11" font-weight="700" fill="#9f1239">
    Pr[<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="8" font-style="italic">K</tspan>(<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan>)=00 ∧ <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="8" font-style="italic">K</tspan>(<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan>')=00] = 1/16
  </text>

  <!-- ==================== BOTTOM SUMMARY ==================== -->
  <rect x="66" y="270" width="708" height="34" rx="9" fill="#e6f4f1" stroke="#2a9d8f" stroke-width="1.6"/>
  <text x="420" y="292" text-anchor="middle" font-size="12.5" font-weight="700" fill="#115e59">
    Theorem 2.3 ratio:   Pr[τ'=00 | τ=00]  =  (Panel 3: 1/16) / (Panel 1: 4/16)  =  (1/|<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">T</tspan>|<tspan baseline-shift="super" font-size="8.5">2</tspan>) / (1/|<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">T</tspan>|)  =  1/4  =  1/|<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">T</tspan>|
  </text>
</svg>
