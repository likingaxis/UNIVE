<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 210" role="img" aria-labelledby="xor-prop-title xor-prop-desc" font-family="Segoe UI, Arial, sans-serif">
  <title id="xor-prop-title">Properties of Bitwise XOR</title>
  <desc id="xor-prop-desc">Table of three XOR properties over {0,1}^l: Associativity a XOR (b XOR c) = (a XOR b) XOR c, Self-inverse a XOR a = 0^l, and Identity 0^l XOR a = a.</desc>

  <rect x="1" y="1" width="598" height="208" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header row -->
  <rect x="16" y="16" width="568" height="42" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="44" y="42" font-size="14.5" font-weight="700" fill="#1e3a8a">Property</text>
  <text x="240" y="42" font-size="14.5" font-weight="700" fill="#1e3a8a">Expression</text>

  <!-- Row 1: Associativity -->
  <rect x="16" y="64" width="568" height="42" rx="6" fill="#f8fafc"/>
  <text x="44" y="90" font-size="14" font-weight="600" fill="#0f172a">Associativity</text>
  <text x="240" y="90" font-size="14.5" fill="#1e293b">
    <tspan font-family="Georgia, serif" font-style="italic">a</tspan> ⊕ (<tspan font-family="Georgia, serif" font-style="italic">b</tspan> ⊕ <tspan font-family="Georgia, serif" font-style="italic">c</tspan>) = (<tspan font-family="Georgia, serif" font-style="italic">a</tspan> ⊕ <tspan font-family="Georgia, serif" font-style="italic">b</tspan>) ⊕ <tspan font-family="Georgia, serif" font-style="italic">c</tspan>
  </text>

  <!-- Row 2: Self-inverse -->
  <rect x="16" y="108" width="568" height="42" rx="6" fill="#ffffff"/>
  <line x1="24" y1="108" x2="576" y2="108" stroke="#e2e8f0" stroke-width="1"/>
  <text x="44" y="134" font-size="14" font-weight="600" fill="#0f172a">Self-inverse</text>
  <text x="240" y="134" font-size="14.5" fill="#1e293b">
    <tspan font-family="Georgia, serif" font-style="italic">a</tspan> ⊕ <tspan font-family="Georgia, serif" font-style="italic">a</tspan> = 0<tspan baseline-shift="super" font-size="10">ℓ</tspan>
  </text>

  <!-- Row 3: Identity -->
  <rect x="16" y="152" width="568" height="42" rx="6" fill="#f8fafc"/>
  <line x1="24" y1="152" x2="576" y2="152" stroke="#e2e8f0" stroke-width="1"/>
  <text x="44" y="178" font-size="14" font-weight="600" fill="#0f172a">Identity</text>
  <text x="240" y="178" font-size="14.5" fill="#1e293b">
    0<tspan baseline-shift="super" font-size="10">ℓ</tspan> ⊕ <tspan font-family="Georgia, serif" font-style="italic">a</tspan> = <tspan font-family="Georgia, serif" font-style="italic">a</tspan>
  </text>
</svg>
