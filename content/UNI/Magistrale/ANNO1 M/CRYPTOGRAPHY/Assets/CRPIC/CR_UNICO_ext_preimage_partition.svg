<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 288" role="img" aria-labelledby="part-title part-desc" font-family="'Segoe UI', Arial, sans-serif">
  <title id="part-title">Partitioning {0,1}^3 by Preimages of a Deterministic Extractor</title>
  <desc id="part-desc">For n = 3, an arbitrary deterministic function Ext maps the 8 input strings in {0,1}^3 to {0,1}. Five strings (000, 001, 010, 011, 100) map to 0, forming A_0 with size 5 >= 2^(3-1) = 4; three strings (101, 110, 111) map to 1, forming A_1 with size 3.</desc>

  <rect x="1" y="1" width="558" height="286" rx="14" fill="#fcfbf8" stroke="#e7e2d9" stroke-width="1.5"/>

  <text x="280" y="27" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f1d1a">
    Step 1 (<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">n</tspan> = 3): Partition Inputs by Ext(<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">x</tspan>) ∈ {0, 1}
  </text>
  <text x="280" y="46" text-anchor="middle" font-size="12" fill="#57534e">
    8 inputs split into <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">A</tspan><tspan baseline-shift="sub" font-size="9">0</tspan> and <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">A</tspan><tspan baseline-shift="sub" font-size="9">1</tspan>  ⇒  at least one set has size ≥ 2<tspan baseline-shift="super" font-size="9">3−1</tspan> = 4
  </text>

  <!-- Bezier connectors behind nodes -->
  <path d="M114 75 C195 75, 225 123, 304 123" fill="none" stroke="#2a9d8f" stroke-width="1.8" stroke-opacity="0.75"/>
  <path d="M114 101 C195 101, 225 123, 304 123" fill="none" stroke="#2a9d8f" stroke-width="1.8" stroke-opacity="0.75"/>
  <path d="M114 127 C195 127, 225 123, 304 123" fill="none" stroke="#2a9d8f" stroke-width="1.8" stroke-opacity="0.75"/>
  <path d="M114 153 C195 153, 225 123, 304 123" fill="none" stroke="#2a9d8f" stroke-width="1.8" stroke-opacity="0.75"/>
  <path d="M114 179 C195 179, 225 123, 304 123" fill="none" stroke="#2a9d8f" stroke-width="1.8" stroke-opacity="0.75"/>

  <path d="M114 211 C195 211, 225 235, 304 235" fill="none" stroke="#78716c" stroke-width="1.6" stroke-opacity="0.65"/>
  <path d="M114 237 C195 237, 225 235, 304 235" fill="none" stroke="#78716c" stroke-width="1.6" stroke-opacity="0.65"/>
  <path d="M114 263 C195 263, 225 235, 304 235" fill="none" stroke="#78716c" stroke-width="1.6" stroke-opacity="0.65"/>

  <text x="212" y="75" text-anchor="middle" font-size="13" font-weight="700" fill="#312e81">
    Ext(<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">x</tspan>)
  </text>

  <!-- Input bitstrings (A0 group) -->
  <g fill="#e6f4f1" stroke="#2a9d8f" stroke-width="1.3">
    <rect x="38" y="64" width="76" height="22" rx="5"/>
    <rect x="38" y="90" width="76" height="22" rx="5"/>
    <rect x="38" y="116" width="76" height="22" rx="5"/>
    <rect x="38" y="142" width="76" height="22" rx="5"/>
    <rect x="38" y="168" width="76" height="22" rx="5"/>
  </g>
  <!-- Input bitstrings (A1 group) -->
  <g fill="#f5f4ef" stroke="#d6d0c4" stroke-width="1.3">
    <rect x="38" y="200" width="76" height="22" rx="5"/>
    <rect x="38" y="226" width="76" height="22" rx="5"/>
    <rect x="38" y="252" width="76" height="22" rx="5"/>
  </g>
  <g font-size="13" font-weight="700" text-anchor="middle">
    <text x="76" y="80" fill="#115e59">000</text>
    <text x="76" y="106" fill="#115e59">001</text>
    <text x="76" y="132" fill="#115e59">010</text>
    <text x="76" y="158" fill="#115e59">011</text>
    <text x="76" y="184" fill="#115e59">100</text>
    <text x="76" y="216" fill="#57534e">101</text>
    <text x="76" y="242" fill="#57534e">110</text>
    <text x="76" y="268" fill="#57534e">111</text>
  </g>

  <!-- Output 0 box -->
  <rect x="306" y="70" width="216" height="106" rx="10" fill="#e6f4f1" stroke="#2a9d8f" stroke-width="1.8"/>
  <text x="414" y="105" text-anchor="middle" font-size="26" font-weight="700" fill="#115e59">0</text>
  <text x="414" y="135" text-anchor="middle" font-size="14" font-weight="700" fill="#1f6f66">
    |<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">A</tspan><tspan baseline-shift="sub" font-size="10">0</tspan>| = 5 ≥ 2<tspan baseline-shift="super" font-size="10">3−1</tspan> = 4
  </text>
  <text x="414" y="158" text-anchor="middle" font-size="12.5" fill="#115e59">
    larger preimage (<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">b</tspan> = 0)
  </text>

  <!-- Output 1 box -->
  <rect x="306" y="198" width="216" height="74" rx="10" fill="#f5f4ef" stroke="#d6d0c4" stroke-width="1.5"/>
  <text x="414" y="232" text-anchor="middle" font-size="24" font-weight="700" fill="#57534e">1</text>
  <text x="414" y="257" text-anchor="middle" font-size="13.5" font-weight="600" fill="#57534e">
    |<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">A</tspan><tspan baseline-shift="sub" font-size="10">1</tspan>| = 3
  </text>
</svg>
