<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 416" role="img" aria-labelledby="title desc" font-family="Segoe UI, Arial, sans-serif" fill="#0f172a">
  <title id="title">Lazy sampling of a uniformly random function</title>
  <desc id="desc">Comparing the naive ideal challenger, which materializes a full table of 2^n rows in exponential time, with an efficient polynomial-time simulator C prime that answers queries on demand using a table T of at most q queried pairs (x, y). Repeated queries return the stored output T[x], while new queries sample a uniform y from U_n and store it.</desc>
  <defs>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 1L9 5L0 9Z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 1L9 5L0 9Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 1L9 5L0 9Z" fill="#059669"/>
    </marker>
  </defs>

  <rect width="880" height="416" fill="#ffffff"/>

  <!-- Header -->
  <text x="440" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Lazy sampling: simulating the ideal random function efficiently</text>
  <text x="440" y="57" text-anchor="middle" font-size="14.5" fill="#64748b">A PPT adversary makes at most <tspan font-family="Georgia, serif" font-style="italic">q</tspan> = poly(<tspan font-family="Georgia, serif" font-style="italic">λ</tspan>) queries, so <tspan font-family="Georgia, serif" font-style="italic">C′</tspan> only fills the rows actually requested</text>

  <!-- Left panel: Naive full table -->
  <rect x="28" y="76" width="332" height="274" rx="14" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.8"/>
  <rect x="46" y="92" width="122" height="24" rx="12" fill="#b91c1c"/>
  <text x="107" y="109" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Naive (exp time)</text>
  <text x="268" y="110" text-anchor="middle" font-size="18.5" font-weight="700" fill="#991b1b">Full table <tspan font-family="Georgia, serif" font-style="italic">R</tspan></text>

  <rect x="46" y="128" width="296" height="38" rx="8" fill="#ffffff" stroke="#fecaca" stroke-width="1.4"/>
  <text x="194" y="152" text-anchor="middle" font-size="14.5" font-weight="600" fill="#0f172a">Sample entire <tspan font-family="Georgia, serif" font-style="italic">R</tspan> ← <tspan font-family="Georgia, serif" font-style="italic">R</tspan>(<tspan font-family="Georgia, serif" font-style="italic">n</tspan>, <tspan font-family="Georgia, serif" font-style="italic">n</tspan>) upfront</text>

  <!-- Table illustration -->
  <rect x="46" y="176" width="296" height="128" rx="9" fill="#ffffff" stroke="#fca5a5" stroke-width="1.4"/>
  <line x1="176" y1="176" x2="176" y2="304" stroke="#fca5a5" stroke-width="1.3"/>
  <line x1="46" y1="202" x2="342" y2="202" stroke="#fca5a5" stroke-width="1.3"/>
  <line x1="46" y1="227" x2="342" y2="227" stroke="#fecaca" stroke-width="1.1"/>
  <line x1="46" y1="252" x2="342" y2="252" stroke="#fecaca" stroke-width="1.1"/>
  <line x1="46" y1="277" x2="342" y2="277" stroke="#fecaca" stroke-width="1.1"/>

  <text x="111" y="194" text-anchor="middle" font-size="12.5" font-weight="700" fill="#991b1b">All 2<tspan baseline-shift="super" font-size="9.5" font-family="Georgia, serif" font-style="italic">n</tspan> inputs</text>
  <text x="259" y="194" text-anchor="middle" font-size="12.5" font-weight="700" fill="#991b1b">Random output</text>

  <text x="111" y="219" text-anchor="middle" font-size="13" fill="#334155">00…00</text>
  <text x="259" y="219" text-anchor="middle" font-size="13" fill="#334155"><tspan font-family="Georgia, serif" font-style="italic">R</tspan>(00…00) ← <tspan font-family="Georgia, serif" font-style="italic">U</tspan><tspan baseline-shift="sub" font-size="9.5" font-family="Georgia, serif" font-style="italic">n</tspan></text>

  <text x="111" y="244" text-anchor="middle" font-size="13" fill="#334155">00…01</text>
  <text x="259" y="244" text-anchor="middle" font-size="13" fill="#334155"><tspan font-family="Georgia, serif" font-style="italic">R</tspan>(00…01) ← <tspan font-family="Georgia, serif" font-style="italic">U</tspan><tspan baseline-shift="sub" font-size="9.5" font-family="Georgia, serif" font-style="italic">n</tspan></text>

  <text x="111" y="269" text-anchor="middle" font-size="14" fill="#64748b">⋮</text>
  <text x="259" y="269" text-anchor="middle" font-size="14" fill="#64748b">⋮</text>

  <text x="111" y="295" text-anchor="middle" font-size="13" fill="#334155">11…11</text>
  <text x="259" y="295" text-anchor="middle" font-size="13" fill="#334155"><tspan font-family="Georgia, serif" font-style="italic">R</tspan>(11…11) ← <tspan font-family="Georgia, serif" font-style="italic">U</tspan><tspan baseline-shift="sub" font-size="9.5" font-family="Georgia, serif" font-style="italic">n</tspan></text>

  <text x="194" y="331" text-anchor="middle" font-size="13" font-weight="600" fill="#991b1b">Needs <tspan font-family="Georgia, serif" font-style="italic">n</tspan> · 2<tspan baseline-shift="super" font-size="9.5" font-family="Georgia, serif" font-style="italic">n</tspan> bits (exponential space &amp; time)</text>

  <!-- Center equivalence -->
  <rect x="366" y="196" width="54" height="32" rx="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="393" y="218" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">≡</text>
  <text x="393" y="244" text-anchor="middle" font-size="11.5" font-weight="600" fill="#64748b">same view</text>

  <!-- Right panel: Lazy sampling -->
  <rect x="426" y="76" width="426" height="274" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.8"/>
  <rect x="444" y="92" width="166" height="24" rx="12" fill="#047857"/>
  <text x="527" y="109" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Lazy sampling (poly time)</text>
  <text x="734" y="110" text-anchor="middle" font-size="18.5" font-weight="700" fill="#065f46">On-the-fly table <tspan font-family="Georgia, serif" font-style="italic">T</tspan></text>

  <!-- Top box right -->
  <rect x="444" y="128" width="390" height="42" rx="9" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
  <text x="639" y="154" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">
    Initialize <tspan font-family="Georgia, serif" font-style="italic">T</tspan> = ∅; receive query <tspan font-family="Georgia, serif" font-style="italic">x</tspan> ∈ {0, 1}<tspan baseline-shift="super" font-size="10.5" font-family="Georgia, serif" font-style="italic">n</tspan>
  </text>

  <!-- Branch arrows -->
  <path d="M639 170 V184" fill="none" stroke="#475569" stroke-width="2"/>
  <path d="M538 198 V190 Q538 184 546 184 H732 Q740 184 740 190 V198" fill="none" stroke="#475569" stroke-width="2"/>
  <path d="M538 190 V200" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M740 190 V200" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Branch 1: Repeated query -->
  <rect x="444" y="206" width="186" height="102" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/>
  <text x="537" y="229" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">(<tspan font-family="Georgia, serif" font-style="italic">x</tspan>, <tspan font-family="Georgia, serif" font-style="italic">y</tspan>) already in <tspan font-family="Georgia, serif" font-style="italic">T</tspan></text>
  <text x="537" y="254" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0f172a">Return stored <tspan font-family="Georgia, serif" font-style="italic">y</tspan></text>
  <text x="537" y="276" text-anchor="middle" font-size="12" fill="#334155">Consistent reply</text>
  <text x="537" y="294" text-anchor="middle" font-size="12" fill="#334155">(keeps <tspan font-family="Georgia, serif" font-style="italic">R</tspan> deterministic)</text>

  <!-- Branch 2: Fresh query -->
  <rect x="648" y="206" width="186" height="102" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="1.6"/>
  <text x="741" y="229" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46"><tspan font-family="Georgia, serif" font-style="italic">x</tspan> is fresh (not in <tspan font-family="Georgia, serif" font-style="italic">T</tspan>)</text>
  <text x="741" y="254" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Sample <tspan font-family="Georgia, serif" font-style="italic">y</tspan> ← <tspan font-family="Georgia, serif" font-style="italic">U</tspan><tspan baseline-shift="sub" font-size="10" font-family="Georgia, serif" font-style="italic">n</tspan></text>
  <text x="741" y="276" text-anchor="middle" font-size="13" fill="#047857">Store (<tspan font-family="Georgia, serif" font-style="italic">x</tspan>, <tspan font-family="Georgia, serif" font-style="italic">y</tspan>) in <tspan font-family="Georgia, serif" font-style="italic">T</tspan></text>
  <text x="741" y="295" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Return <tspan font-family="Georgia, serif" font-style="italic">y</tspan></text>

  <text x="639" y="331" text-anchor="middle" font-size="13" font-weight="600" fill="#065f46">Stores at most <tspan font-family="Georgia, serif" font-style="italic">q</tspan> = poly(<tspan font-family="Georgia, serif" font-style="italic">λ</tspan>) pairs in <tspan font-family="Georgia, serif" font-style="italic">T</tspan> (efficient!)</text>

  <!-- Footer -->
  <rect x="28" y="364" width="824" height="36" rx="9" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.4"/>
  <text x="440" y="387" text-anchor="middle" font-size="14" fill="#334155">
    Every distinct <tspan font-family="Georgia, serif" font-style="italic">x</tspan> receives an independent uniform output in {0, 1}<tspan baseline-shift="super" font-size="10" font-family="Georgia, serif" font-style="italic">n</tspan>, matching <tspan font-family="Georgia, serif" font-style="italic">R</tspan> ← <tspan font-family="Georgia, serif" font-style="italic">R</tspan>(<tspan font-family="Georgia, serif" font-style="italic">n</tspan>, <tspan font-family="Georgia, serif" font-style="italic">n</tspan>) identically.
  </text>
</svg>
