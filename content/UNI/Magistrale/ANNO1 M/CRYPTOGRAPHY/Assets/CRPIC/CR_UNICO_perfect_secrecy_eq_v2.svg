<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 226" role="img" aria-labelledby="eq2-title eq2-desc" font-family="'Segoe UI', Arial, sans-serif">
  <title id="eq2-title">Equivalence Cycle of Theorem 1.1</title>
  <desc id="eq2-desc">Cyclic implication proof for Theorem 1.1: (i) Perfect Secrecy implies (ii) Independence in Part 1, which implies (iii) Equal Distributions in Part 2, which implies (i) Perfect Secrecy in Part 3.</desc>
  <defs>
    <marker id="eq2-arrow-indigo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 1L9 5L0 9Z" fill="#4338ca"/>
    </marker>
    <marker id="eq2-arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 1L9 5L0 9Z" fill="#2a9d8f"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="798" height="224" rx="14" fill="#fcfbf8" stroke="#e7e2d9" stroke-width="1.5"/>

  <!-- Implication arrows -->
  <path d="M236 82 H289" fill="none" stroke="#4338ca" stroke-width="2.2" marker-end="url(#eq2-arrow-indigo)"/>
  <path d="M505 82 H558" fill="none" stroke="#4338ca" stroke-width="2.2" marker-end="url(#eq2-arrow-indigo)"/>
  <path d="M670 138 V178 Q670 190 658 190 H142 Q130 190 130 178 V145" fill="none" stroke="#2a9d8f" stroke-width="2.2" marker-end="url(#eq2-arrow-teal)"/>

  <!-- Top arrow labels -->
  <text x="265" y="68" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4338ca">Part 1</text>
  <text x="534" y="68" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4338ca">Part 2</text>

  <!-- Return pill -->
  <rect x="320" y="175" width="160" height="30" rx="15" fill="#e6f4f1" stroke="#2a9d8f" stroke-width="1.4"/>
  <text x="400" y="194.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#115e59">Part 3: (iii) ⇒ (i)</text>

  <!-- Node (i) -->
  <rect x="24" y="26" width="212" height="112" rx="11" fill="#ffffff" stroke="#4338ca" stroke-width="1.6"/>
  <rect x="110" y="37" width="40" height="22" rx="11" fill="#eef0fb"/>
  <text x="130" y="52.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4338ca">(i)</text>
  <text x="130" y="80" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f1d1a">Perfect Secrecy</text>
  <text x="130" y="99" text-anchor="middle" font-size="11" fill="#57534e">posterior equals prior</text>
  <text x="130" y="122" text-anchor="middle" font-size="10.8" font-weight="600" fill="#312e81">
    Pr[<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">M</tspan>=<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan> | <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">C</tspan>=<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">c</tspan>] = Pr[<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">M</tspan>=<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan>]
  </text>

  <!-- Node (ii) -->
  <rect x="294" y="26" width="212" height="112" rx="11" fill="#ffffff" stroke="#4338ca" stroke-width="1.6"/>
  <rect x="380" y="37" width="40" height="22" rx="11" fill="#eef0fb"/>
  <text x="400" y="52.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4338ca">(ii)</text>
  <text x="400" y="80" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f1d1a">Independence</text>
  <text x="400" y="99" text-anchor="middle" font-size="11" fill="#57534e">joint factors into marginals</text>
  <text x="400" y="122" text-anchor="middle" font-size="10.2" font-weight="600" fill="#312e81">
    Pr[<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">M</tspan>=<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan>,<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">C</tspan>=<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">c</tspan>] = Pr[<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">M</tspan>=<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan>]Pr[<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">C</tspan>=<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">c</tspan>]
  </text>

  <!-- Node (iii) -->
  <rect x="564" y="26" width="212" height="112" rx="11" fill="#ffffff" stroke="#4338ca" stroke-width="1.6"/>
  <rect x="650" y="37" width="40" height="22" rx="11" fill="#eef0fb"/>
  <text x="670" y="52.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4338ca">(iii)</text>
  <text x="670" y="80" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f1d1a">Equal Distributions</text>
  <text x="670" y="99" text-anchor="middle" font-size="11" fill="#57534e">identical ciphertext law</text>
  <text x="670" y="122" text-anchor="middle" font-size="9.8" font-weight="600" fill="#312e81">
    Pr[Enc(<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">K</tspan>,<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="7.5">0</tspan>)=<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">c</tspan>] = Pr[Enc(<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">K</tspan>,<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="7.5">1</tspan>)=<tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">c</tspan>]
  </text>
</svg>
