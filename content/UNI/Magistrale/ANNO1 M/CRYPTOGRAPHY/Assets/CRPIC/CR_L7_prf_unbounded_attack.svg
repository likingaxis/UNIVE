<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 398" role="img" aria-labelledby="title desc" font-family="Segoe UI, Arial, sans-serif" fill="#0f172a">
  <title id="title">Why unbounded adversaries break any PRF under standard parameters</title>
  <desc id="desc">A PRF family indexed by lambda-bit keys contains at most 2^lambda functions, whereas R(n, n) contains (2^n)^(2^n) functions. When n * 2^n &gt;= lambda + 1, an unbounded adversary queries t distinct inputs with t * n &gt;= lambda + 1 and tests all 2^lambda keys, outputting 1 with probability 1 in the real game and at most 1/2 in the ideal game.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 1L9 5L0 9Z" fill="#2563eb"/>
    </marker>
    <clipPath id="r-clip">
      <rect x="380" y="96" width="466" height="148" rx="11"/>
    </clipPath>
  </defs>

  <rect width="880" height="398" fill="#ffffff"/>

  <!-- Header -->
  <text x="440" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Counting attack: no <tspan font-family="Georgia, serif" font-style="italic">F</tspan> is a PRF against unbounded adversaries</text>
  <text x="440" y="57" text-anchor="middle" font-size="14.5" fill="#64748b">Under standard parameters (<tspan font-family="Georgia, serif" font-style="italic">n</tspan> · 2<tspan baseline-shift="super" font-size="10.5" font-family="Georgia, serif" font-style="italic">n</tspan> ≥ <tspan font-family="Georgia, serif" font-style="italic">λ</tspan> + 1), the keyed family covers a tiny fraction of <tspan font-family="Georgia, serif" font-style="italic">R</tspan>(<tspan font-family="Georgia, serif" font-style="italic">n</tspan>, <tspan font-family="Georgia, serif" font-style="italic">n</tspan>)</text>

  <!-- Left: Key space -->
  <text x="150" y="96" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1e40af">Key space {0, 1}<tspan baseline-shift="super" font-size="11" font-family="Georgia, serif" font-style="italic">λ</tspan></text>
  <rect x="36" y="110" width="228" height="120" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="150" y="164" text-anchor="middle" font-size="28" font-weight="700" fill="#1e3a8a">2<tspan baseline-shift="super" font-size="17" font-family="Georgia, serif" font-style="italic">λ</tspan></text>
  <text x="150" y="196" text-anchor="middle" font-size="14" font-weight="600" fill="#1e40af">possible secret keys <tspan font-family="Georgia, serif" font-style="italic">k</tspan></text>

  <!-- Arrow -->
  <path d="M264 170 C306 170 326 119 374 119" fill="none" stroke="#2563eb" stroke-width="2.3" marker-end="url(#arrow-blue)"/>
  <rect x="282" y="128" width="76" height="24" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
  <text x="320" y="145" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1d4ed8"><tspan font-family="Georgia, serif" font-style="italic">k</tspan> ↦ <tspan font-family="Georgia, serif" font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="10" font-family="Georgia, serif" font-style="italic">k</tspan></text>

  <!-- Right: All functions R(n,n) -->
  <text x="613" y="88" text-anchor="middle" font-size="15.5" font-weight="700" fill="#0f172a">
    All functions <tspan font-family="Georgia, serif" font-style="italic">R</tspan>(<tspan font-family="Georgia, serif" font-style="italic">n</tspan>, <tspan font-family="Georgia, serif" font-style="italic">n</tspan>):  (2<tspan dy="-6" font-size="11" font-family="Georgia, serif" font-style="italic">n</tspan><tspan dy="6">)</tspan><tspan dy="-6" font-size="11">2</tspan><tspan dy="-4" font-size="8.5" font-family="Georgia, serif" font-style="italic">n</tspan><tspan dy="10"> = 2</tspan><tspan dy="-6" font-size="11"><tspan font-family="Georgia, serif" font-style="italic">n</tspan>·2</tspan><tspan dy="-4" font-size="8.5" font-family="Georgia, serif" font-style="italic">n</tspan><tspan dy="10"> maps</tspan>
  </text>
  <g clip-path="url(#r-clip)">
    <rect x="380" y="96" width="466" height="44" fill="#ecfdf5"/>
    <rect x="380" y="140" width="466" height="104" fill="#fef2f2"/>
  </g>
  <line x1="380" y1="140" x2="846" y2="140" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="380" y="96" width="466" height="148" rx="11" fill="none" stroke="#64748b" stroke-width="1.8"/>

  <text x="613" y="124" text-anchor="middle" font-size="14.5" font-weight="700" fill="#065f46">
    Functions in <tspan font-family="Georgia, serif" font-style="italic">F</tspan>: at most 2<tspan baseline-shift="super" font-size="10.5" font-family="Georgia, serif" font-style="italic">λ</tspan> maps (tiny subset; not to scale)
  </text>
  <text x="613" y="184" text-anchor="middle" font-size="16" font-weight="700" fill="#991b1b">
    Never realized by any key in <tspan font-family="Georgia, serif" font-style="italic">F</tspan>
  </text>
  <text x="613" y="210" text-anchor="middle" font-size="14" fill="#9f1239">
    at least  (2<tspan dy="-5" font-size="10" font-family="Georgia, serif" font-style="italic">n</tspan><tspan dy="5">)</tspan><tspan dy="-5" font-size="10">2</tspan><tspan dy="-3.5" font-size="8" font-family="Georgia, serif" font-style="italic">n</tspan><tspan dy="8.5"> − 2</tspan><tspan dy="-5" font-size="10" font-family="Georgia, serif" font-style="italic">λ</tspan><tspan dy="5">  functions</tspan>
  </text>

  <!-- Bottom: Unbounded adversary steps -->
  <rect x="36" y="264" width="810" height="114" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="58" y="290" font-size="15.5" font-weight="700" fill="#0f172a">
    Unbounded distinguisher <tspan font-family="Georgia, serif" font-style="italic">A</tspan> (pick <tspan font-family="Georgia, serif" font-style="italic">t</tspan> = ⌈(<tspan font-family="Georgia, serif" font-style="italic">λ</tspan> + 1) / <tspan font-family="Georgia, serif" font-style="italic">n</tspan>⌉ distinct inputs):
  </text>
  <text x="58" y="315" font-size="14" fill="#334155">
    1. Query <tspan font-family="Georgia, serif" font-style="italic">x</tspan><tspan baseline-shift="sub" font-size="10">1</tspan>, …, <tspan font-family="Georgia, serif" font-style="italic">x</tspan><tspan baseline-shift="sub" font-size="10" font-family="Georgia, serif" font-style="italic">t</tspan> to obtain (<tspan font-family="Georgia, serif" font-style="italic">y</tspan><tspan baseline-shift="sub" font-size="10">1</tspan>, …, <tspan font-family="Georgia, serif" font-style="italic">y</tspan><tspan baseline-shift="sub" font-size="10" font-family="Georgia, serif" font-style="italic">t</tspan>).   2. Enumerate all 2<tspan baseline-shift="super" font-size="10" font-family="Georgia, serif" font-style="italic">λ</tspan> keys <tspan font-family="Georgia, serif" font-style="italic">k</tspan>; output 1 iff some <tspan font-family="Georgia, serif" font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="10" font-family="Georgia, serif" font-style="italic">k</tspan> matches all <tspan font-family="Georgia, serif" font-style="italic">t</tspan> outputs.
  </text>
  <rect x="56" y="332" width="770" height="34" rx="8" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.3"/>
  <text x="441" y="354" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">
    Real game: Pr[<tspan font-family="Georgia, serif" font-style="italic">A</tspan> = 1] = 1     |     Ideal game: Pr[<tspan font-family="Georgia, serif" font-style="italic">A</tspan> = 1] ≤ 2<tspan baseline-shift="super" font-size="10" font-family="Georgia, serif" font-style="italic">λ</tspan> / 2<tspan baseline-shift="super" font-size="10"><tspan font-family="Georgia, serif" font-style="italic">t</tspan><tspan font-family="Georgia, serif" font-style="italic">n</tspan></tspan> ≤ 1/2     ⇒     Adv ≥ 1/2
  </text>
</svg>
