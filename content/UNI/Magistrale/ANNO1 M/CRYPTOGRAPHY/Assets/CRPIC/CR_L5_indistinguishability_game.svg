<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 270" role="img" aria-labelledby="title desc">
  <title id="title">Two experiments for computational indistinguishability</title>
  <desc id="desc">In GAME(lambda, 0) the challenger samples z from X_lambda; in GAME(lambda, 1) it samples z from Y_lambda. In both games the same adversary A receives z and outputs a bit b prime.</desc>
  <style>
    svg { font-size: 18px; }
    text { font-family: 'Segoe UI', Arial, sans-serif; fill: #1e293b; }
    .m { font-family: 'Times New Roman', Times, serif; font-style: italic; }
    tspan.m { font-size: 1.12em; }
    tspan[baseline-shift] { font-size: 0.72em; }
    .small { font-size: 13.5px; fill: #475569; }
    .ln { fill: none; stroke: #475569; stroke-width: 1.7; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 1L9 5L0 9Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="780" height="270" rx="12" fill="#ffffff"/>

  <!-- GAME 0 band (pastel blue) -->
  <rect x="18" y="18" width="744" height="96" rx="10" fill="#eef6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="38" y="72" font-weight="600" fill="#1e3a8a">GAME(<tspan class="m">λ</tspan>, 0)</text>

  <rect x="180" y="32" width="200" height="68" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="1.6"/>
  <text class="small" x="280" y="54" text-anchor="middle" fill="#3b5998">Challenger</text>
  <text x="280" y="84" text-anchor="middle" font-size="21"><tspan class="m">z</tspan> ← <tspan class="m">X</tspan><tspan class="m" baseline-shift="-0.35em">λ</tspan></text>

  <path class="ln" d="M380 66H478" marker-end="url(#ar)"/>
  <text class="m" x="429" y="56" text-anchor="middle">z</text>

  <rect x="480" y="32" width="135" height="68" rx="8" fill="#f3effb" stroke="#a78bfa" stroke-width="1.6"/>
  <text class="small" x="547.5" y="54" text-anchor="middle" fill="#5b21b6">Adversary</text>
  <text class="m" x="547.5" y="84" text-anchor="middle" font-size="21" fill="#3b0764">A</text>

  <path class="ln" d="M615 66H668" marker-end="url(#ar)"/>
  <text x="680" y="72"><tspan class="m">b′</tspan> ∈ {0, 1}</text>

  <!-- GAME 1 band (pastel mint) -->
  <rect x="18" y="128" width="744" height="96" rx="10" fill="#edfbf3" stroke="#74c69d" stroke-width="1.5"/>
  <text x="38" y="182" font-weight="600" fill="#14532d">GAME(<tspan class="m">λ</tspan>, 1)</text>

  <rect x="180" y="142" width="200" height="68" rx="8" fill="#ffffff" stroke="#52b788" stroke-width="1.6"/>
  <text class="small" x="280" y="164" text-anchor="middle" fill="#2d6a4f">Challenger</text>
  <text x="280" y="194" text-anchor="middle" font-size="21"><tspan class="m">z</tspan> ← <tspan class="m">Y</tspan><tspan class="m" baseline-shift="-0.35em">λ</tspan></text>

  <path class="ln" d="M380 176H478" marker-end="url(#ar)"/>
  <text class="m" x="429" y="166" text-anchor="middle">z</text>

  <rect x="480" y="142" width="135" height="68" rx="8" fill="#f3effb" stroke="#a78bfa" stroke-width="1.6"/>
  <text class="small" x="547.5" y="164" text-anchor="middle" fill="#5b21b6">Adversary</text>
  <text class="m" x="547.5" y="194" text-anchor="middle" font-size="21" fill="#3b0764">A</text>

  <path class="ln" d="M615 176H668" marker-end="url(#ar)"/>
  <text x="680" y="182"><tspan class="m">b′</tspan> ∈ {0, 1}</text>

  <text class="small" x="390" y="250" text-anchor="middle">Same adversary in both games; it sees only <tspan class="m">z</tspan>, not which game it is in.</text>
</svg>
