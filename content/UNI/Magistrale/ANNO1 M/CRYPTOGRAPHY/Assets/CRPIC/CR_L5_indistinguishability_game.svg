<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="title"><title id="title">Two experiments for computational indistinguishability</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3b6487"/></marker></defs><rect width="800" height="440" fill="#ffffff"/><text x="400" y="35" text-anchor="middle" font-size="25" fill="#172b42" font-weight="600">Two experiments, one observed sample</text><path d="M210 167V207H400V228" fill="none" stroke="#3b6487" stroke-width="2.3" marker-end="url(#arr)"/><path d="M590 167V207H400" fill="none" stroke="#3b6487" stroke-width="2.3" marker-end="url(#arr)"/><rect x="40" y="65" width="340" height="105" rx="12" fill="#eff6ff" stroke="#8ba3b7"/><rect x="420" y="65" width="340" height="105" rx="12" fill="#ecfdf5" stroke="#8ba3b7"/><text x="210" y="99" text-anchor="middle" font-size="23" fill="#172b42" font-weight="600">GAME(λ, 0)</text><text x="210" y="140" text-anchor="middle" font-size="25" fill="#172b42" font-weight="400">z ← Xλ</text><text x="590" y="99" text-anchor="middle" font-size="23" fill="#172b42" font-weight="600">GAME(λ, 1)</text><text x="590" y="140" text-anchor="middle" font-size="25" fill="#172b42" font-weight="400">z ← Yλ</text><rect x="230" y="230" width="340" height="92" rx="12" fill="#eff6ff" stroke="#8ba3b7"/><text x="400" y="267" text-anchor="middle" font-size="24" fill="#172b42" font-weight="600">Adversary A</text><text x="400" y="300" text-anchor="middle" font-size="20" fill="#172b42" font-weight="400">receives z; outputs b′ ∈ {0, 1}</text><text x="400" y="367" text-anchor="middle" font-size="19" fill="#172b42" font-weight="400">Guessing interpretation: b′ guesses the hidden world b.</text><text x="400" y="402" text-anchor="middle" font-size="21" fill="#172b42" font-weight="400">The adversary wins when b′ = b.</text></svg>