<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" role="img" aria-labelledby="title desc" font-family="Segoe UI, Arial, sans-serif" fill="#0f172a">
  <title id="title">Two experiments for computational indistinguishability</title>
  <desc id="desc">In GAME(lambda, 0) the challenger samples z from X_lambda; in GAME(lambda, 1) the challenger samples z from Y_lambda. The PPT adversary receives z without knowing b and outputs a guess b prime in {0, 1}, winning when b prime equals b.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1L9 5L0 9Z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="840" height="440" fill="#ffffff"/>

  <!-- Header -->
  <text x="420" y="38" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">Two experiments, one observed sample</text>
  <text x="420" y="62" text-anchor="middle" font-size="15.5" fill="#64748b">Computational indistinguishability game with hidden world bit <tspan font-family="Georgia, serif" font-style="italic">b</tspan> ∈ {0, 1}</text>

  <!-- World 0 card -->
  <rect x="40" y="84" width="335" height="122" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.8"/>
  <rect x="60" y="100" width="54" height="24" rx="12" fill="#1d4ed8"/>
  <text x="87" y="117" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff"><tspan font-family="Georgia, serif" font-style="italic">b</tspan> = 0</text>
  <text x="225" y="119" text-anchor="middle" font-size="20" font-weight="700" fill="#1e40af">GAME(<tspan font-family="Georgia, serif" font-style="italic">λ</tspan>, 0)</text>
  <text x="208" y="159" text-anchor="middle" font-size="26" font-weight="600" fill="#0f172a">
    <tspan font-family="Georgia, serif" font-style="italic">z</tspan> ← <tspan font-family="Georgia, serif" font-style="italic">X</tspan><tspan baseline-shift="sub" font-size="17" font-family="Georgia, serif" font-style="italic">λ</tspan>
  </text>
  <text x="208" y="188" text-anchor="middle" font-size="14" fill="#475569">Challenger samples from distribution <tspan font-family="Georgia, serif" font-style="italic">X</tspan><tspan baseline-shift="sub" font-size="11" font-family="Georgia, serif" font-style="italic">λ</tspan></text>

  <!-- Center "or" pill -->
  <rect x="402" y="131" width="36" height="28" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="420" y="150" text-anchor="middle" font-size="13.5" font-weight="600" fill="#64748b">or</text>

  <!-- World 1 card -->
  <rect x="465" y="84" width="335" height="122" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.8"/>
  <rect x="485" y="100" width="54" height="24" rx="12" fill="#047857"/>
  <text x="512" y="117" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff"><tspan font-family="Georgia, serif" font-style="italic">b</tspan> = 1</text>
  <text x="650" y="119" text-anchor="middle" font-size="20" font-weight="700" fill="#065f46">GAME(<tspan font-family="Georgia, serif" font-style="italic">λ</tspan>, 1)</text>
  <text x="633" y="159" text-anchor="middle" font-size="26" font-weight="600" fill="#0f172a">
    <tspan font-family="Georgia, serif" font-style="italic">z</tspan> ← <tspan font-family="Georgia, serif" font-style="italic">Y</tspan><tspan baseline-shift="sub" font-size="17" font-family="Georgia, serif" font-style="italic">λ</tspan>
  </text>
  <text x="633" y="188" text-anchor="middle" font-size="14" fill="#475569">Challenger samples from distribution <tspan font-family="Georgia, serif" font-style="italic">Y</tspan><tspan baseline-shift="sub" font-size="11" font-family="Georgia, serif" font-style="italic">λ</tspan></text>

  <!-- Routed connectors merging cleanly into one arrow -->
  <path d="M208 206 V226 Q208 234 216 234 H624 Q632 234 632 226 V206" fill="none" stroke="#64748b" stroke-width="2.2"/>
  <path d="M420 234 V268" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arrow)"/>
  <rect x="387" y="220" width="66" height="26" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="420" y="238" text-anchor="middle" font-size="15" font-weight="600" fill="#334155">send <tspan font-family="Georgia, serif" font-style="italic">z</tspan></text>

  <!-- Adversary card -->
  <rect x="200" y="272" width="440" height="94" rx="14" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.8"/>
  <text x="420" y="303" text-anchor="middle" font-size="21" font-weight="700" fill="#6d28d9">PPT Adversary <tspan font-family="Georgia, serif" font-style="italic">A</tspan></text>
  <text x="420" y="329" text-anchor="middle" font-size="15.5" fill="#475569">Receives sample <tspan font-family="Georgia, serif" font-style="italic">z</tspan> (does not see hidden bit <tspan font-family="Georgia, serif" font-style="italic">b</tspan>)</text>
  <text x="420" y="353" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">Outputs <tspan font-family="Georgia, serif" font-style="italic">b′</tspan> ∈ {0, 1}</text>

  <!-- Footer interpretation pill -->
  <rect x="80" y="382" width="680" height="42" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="420" y="408" text-anchor="middle" font-size="15.5" fill="#334155">
    Guessing interpretation: <tspan font-family="Georgia, serif" font-style="italic">b′</tspan> guesses the hidden world <tspan font-family="Georgia, serif" font-style="italic">b</tspan> — the adversary wins when <tspan font-weight="700" fill="#0f172a"><tspan font-family="Georgia, serif" font-style="italic">b′</tspan> = <tspan font-family="Georgia, serif" font-style="italic">b</tspan></tspan>.
  </text>
</svg>
