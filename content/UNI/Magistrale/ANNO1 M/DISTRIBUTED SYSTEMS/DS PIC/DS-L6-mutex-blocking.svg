<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="760" height="220" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="380" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Motivation: A Single Process Crash Blocks Non-Fault-Tolerant Protocols</text>

  <!-- Process p0 -->
  <rect x="55" y="55" width="130" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="120" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Process p₀</text>
  <text x="120" y="96" text-anchor="middle" font-size="11" fill="#334155">Wants to enter CS</text>

  <!-- Process p1 -->
  <rect x="315" y="55" width="130" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="380" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Process p₁</text>
  <text x="380" y="96" text-anchor="middle" font-size="11" fill="#334155">Correct (replies ACK)</text>

  <!-- Process p2 (Crashed) -->
  <rect x="575" y="55" width="130" height="52" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="625" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">Process p₂</text>
  <text x="640" y="96" text-anchor="middle" font-size="11" font-weight="600" fill="#b91c1c">Crashed!</text>
  <circle cx="682" cy="73" r="9" fill="#dc2626"/>
  <path d="M 678 69 L 686 77 M 686 69 L 678 77" stroke="#ffffff" stroke-width="2"/>

  <!-- Exchange p0 <-> p1 -->
  <path d="M 185 72 L 310 72" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-b)"/>
  <text x="247" y="65" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">REQUEST</text>
  <path d="M 315 92 L 190 92" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-b)"/>
  <text x="247" y="107" text-anchor="middle" font-size="11" font-weight="600" fill="#15803d">ACK ✓</text>

  <!-- Exchange p0 -> p2 (No reply) -->
  <path d="M 120 107 L 120 155 L 640 155 L 640 112" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arr-r)"/>
  <text x="380" y="146" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b91c1c">REQUEST sent to p₂ → No ACK / No RELEASE ever arrives!</text>

  <text x="380" y="195" text-anchor="middle" font-size="12" fill="#334155">Without a Failure Detector to report that p₂ has crashed, p₀ waits forever and Liveness is lost.</text>
</svg>
