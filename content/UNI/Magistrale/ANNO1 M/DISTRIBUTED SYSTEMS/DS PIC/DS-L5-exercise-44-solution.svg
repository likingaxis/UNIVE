<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr-t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arr-msg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="860" height="360" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="430" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Worked Vector Clock Solution — Exercise 1 (4 Processes)</text>

  <!-- Process lines -->
  <text x="35" y="75" font-size="14" font-weight="700" fill="#0f172a">P₁</text>
  <line x1="65" y1="70" x2="825" y2="70" stroke="#334155" stroke-width="2" marker-end="url(#arr-t)"/>

  <text x="35" y="155" font-size="14" font-weight="700" fill="#0f172a">P₂</text>
  <line x1="65" y1="150" x2="825" y2="150" stroke="#334155" stroke-width="2" marker-end="url(#arr-t)"/>

  <text x="35" y="235" font-size="14" font-weight="700" fill="#0f172a">P₃</text>
  <line x1="65" y1="230" x2="825" y2="230" stroke="#334155" stroke-width="2" marker-end="url(#arr-t)"/>

  <text x="35" y="315" font-size="14" font-weight="700" fill="#0f172a">P₄</text>
  <line x1="65" y1="310" x2="825" y2="310" stroke="#334155" stroke-width="2" marker-end="url(#arr-t)"/>

  <!-- 9 Message Arrows -->
  <!-- a1(110,70) -> b1(160,150) -->
  <line x1="110" y1="70" x2="157" y2="145" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-msg)"/>
  <!-- c1(140,230) -> a2(230,70) -->
  <line x1="140" y1="230" x2="227" y2="75" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-msg)"/>
  <!-- b2(240,150) -> d2(330,310) -->
  <line x1="240" y1="150" x2="327" y2="305" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-msg)"/>
  <!-- a3(310,70) -> b3(350,150) -->
  <line x1="310" y1="70" x2="347" y2="145" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-msg)"/>
  <!-- d1(210,310) -> c2(280,230) -->
  <line x1="210" y1="310" x2="276" y2="235" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-msg)"/>
  <!-- b4(430,150) -> c3(470,230) -->
  <line x1="430" y1="150" x2="467" y2="225" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-msg)"/>
  <!-- c4(550,230) -> b5(590,150) -->
  <line x1="550" y1="230" x2="587" y2="155" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-msg)"/>
  <!-- d3(520,310) -> b6(670,150) -->
  <line x1="520" y1="310" x2="666" y2="155" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-msg)"/>
  <!-- b7(740,150) -> a4(780,70) -->
  <line x1="740" y1="150" x2="777" y2="75" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-msg)"/>

  <!-- P1 Events -->
  <circle cx="110" cy="70" r="4.5" fill="#0f172a"/>
  <text x="110" y="54" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">a₁ [1,0,0,0]</text>

  <circle cx="230" cy="70" r="4.5" fill="#0f172a"/>
  <text x="230" y="54" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">a₂ [2,0,1,0]</text>

  <circle cx="310" cy="70" r="4.5" fill="#0f172a"/>
  <text x="315" y="54" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">a₃ [3,0,1,0]</text>

  <circle cx="780" cy="70" r="6" fill="#dc2626"/>
  <text x="775" y="52" text-anchor="middle" font-size="11.5" font-weight="700" fill="#dc2626">e₃=a₄ [4,7,4,3]</text>

  <!-- P2 Events -->
  <circle cx="160" cy="150" r="4.5" fill="#0f172a"/>
  <text x="155" y="170" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">b₁ [1,1,0,0]</text>

  <circle cx="240" cy="150" r="4.5" fill="#0f172a"/>
  <text x="240" y="136" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">b₂ [1,2,0,0]</text>

  <circle cx="350" cy="150" r="4.5" fill="#0f172a"/>
  <text x="350" y="170" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">b₃ [3,3,1,0]</text>

  <circle cx="430" cy="150" r="4.5" fill="#0f172a"/>
  <text x="430" y="136" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">b₄ [3,4,1,0]</text>

  <circle cx="590" cy="150" r="4.5" fill="#0f172a"/>
  <text x="580" y="136" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">b₅ [3,5,4,1]</text>

  <circle cx="670" cy="150" r="4.5" fill="#0f172a"/>
  <text x="665" y="170" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">b₆ [3,6,4,3]</text>

  <circle cx="740" cy="150" r="4.5" fill="#0f172a"/>
  <text x="745" y="136" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">b₇ [3,7,4,3]</text>

  <!-- P3 Events -->
  <circle cx="140" cy="230" r="6" fill="#dc2626"/>
  <text x="135" y="250" text-anchor="middle" font-size="11.5" font-weight="700" fill="#dc2626">e₁=c₁ [0,0,1,0]</text>

  <circle cx="280" cy="230" r="4.5" fill="#0f172a"/>
  <text x="280" y="216" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">c₂ [0,0,2,1]</text>

  <circle cx="470" cy="230" r="4.5" fill="#0f172a"/>
  <text x="470" y="250" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">c₃ [3,4,3,1]</text>

  <circle cx="550" cy="230" r="4.5" fill="#0f172a"/>
  <text x="555" y="250" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">c₄ [3,4,4,1]</text>

  <!-- P4 Events -->
  <circle cx="210" cy="310" r="4.5" fill="#0f172a"/>
  <text x="210" y="330" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">d₁ [0,0,0,1]</text>

  <circle cx="330" cy="310" r="4.5" fill="#0f172a"/>
  <text x="330" y="330" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">d₂ [1,2,0,2]</text>

  <circle cx="520" cy="310" r="6" fill="#dc2626"/>
  <text x="520" y="330" text-anchor="middle" font-size="11.5" font-weight="700" fill="#dc2626">e₂=d₃ [1,2,0,3]</text>

  <text x="430" y="352" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">Results: e₁ || e₂ ([0,0,1,0] vs [1,2,0,3]),   e₁ → e₃ ([0,0,1,0] &lt; [4,7,4,3]),   e₂ → e₃ ([1,2,0,3] &lt; [4,7,4,3])</text>
</svg>
