<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr-t2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arr-msg2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="860" height="360" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="430" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Worked Vector Clock Solution — Exercise 2 (4 Processes)</text>

  <!-- Process lines -->
  <text x="35" y="75" font-size="14" font-weight="700" fill="#0f172a">P₁</text>
  <line x1="65" y1="70" x2="825" y2="70" stroke="#334155" stroke-width="2" marker-end="url(#arr-t2)"/>

  <text x="35" y="155" font-size="14" font-weight="700" fill="#0f172a">P₂</text>
  <line x1="65" y1="150" x2="825" y2="150" stroke="#334155" stroke-width="2" marker-end="url(#arr-t2)"/>

  <text x="35" y="235" font-size="14" font-weight="700" fill="#0f172a">P₃</text>
  <line x1="65" y1="230" x2="825" y2="230" stroke="#334155" stroke-width="2" marker-end="url(#arr-t2)"/>

  <text x="35" y="315" font-size="14" font-weight="700" fill="#0f172a">P₄</text>
  <line x1="65" y1="310" x2="825" y2="310" stroke="#334155" stroke-width="2" marker-end="url(#arr-t2)"/>

  <!-- 9 Message Arrows -->
  <!-- a1(110,70) -> b1(170,150) -->
  <line x1="110" y1="70" x2="167" y2="145" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-msg2)"/>
  <!-- d1(160,310) -> b2(260,150) -->
  <line x1="160" y1="310" x2="257" y2="155" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-msg2)"/>
  <!-- c1(135,230) -> b3(365,150) -->
  <line x1="135" y1="230" x2="359" y2="152" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-msg2)"/>
  <!-- a2(290,70) -> d2(390,310) -->
  <line x1="290" y1="70" x2="388" y2="305" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-msg2)"/>
  <!-- b4(425,150) -> c2(465,230) -->
  <line x1="425" y1="150" x2="462" y2="225" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-msg2)"/>
  <!-- d3(460,310) -> c3(535,230) -->
  <line x1="460" y1="310" x2="531" y2="235" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-msg2)"/>
  <!-- b5(555,150) -> d4(705,310) -->
  <line x1="555" y1="150" x2="701" y2="305" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-msg2)"/>
  <!-- a3(605,70) -> b6(735,150) -->
  <line x1="605" y1="70" x2="730" y2="146" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-msg2)"/>
  <!-- c4(615,230) -> a4(745,70) -->
  <line x1="615" y1="230" x2="741" y2="75" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-msg2)"/>

  <!-- P1 Events -->
  <circle cx="110" cy="70" r="4.5" fill="#0f172a"/>
  <text x="110" y="54" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e3a8a">a₁ [1,0,0,0]</text>

  <circle cx="290" cy="70" r="6" fill="#dc2626"/>
  <text x="290" y="52" text-anchor="middle" font-size="11.5" font-weight="700" fill="#dc2626">e₁=a₂ [2,0,0,0]</text>

  <circle cx="605" cy="70" r="4.5" fill="#0f172a"/>
  <text x="605" y="54" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e3a8a">a₃ [3,0,0,0]</text>

  <circle cx="745" cy="70" r="6" fill="#dc2626"/>
  <text x="745" y="52" text-anchor="middle" font-size="11.5" font-weight="700" fill="#dc2626">e₃=a₄ [4,4,4,3]</text>

  <!-- P2 Events -->
  <circle cx="170" cy="150" r="6" fill="#dc2626"/>
  <text x="165" y="170" text-anchor="middle" font-size="11.5" font-weight="700" fill="#dc2626">e₂=b₁ [1,1,0,0]</text>

  <circle cx="260" cy="150" r="4.5" fill="#0f172a"/>
  <text x="260" y="136" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">b₂ [1,2,0,1]</text>

  <circle cx="365" cy="150" r="4.5" fill="#0f172a"/>
  <text x="355" y="170" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">b₃ [1,3,1,1]</text>

  <circle cx="425" cy="150" r="4.5" fill="#0f172a"/>
  <text x="430" y="136" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">b₄ [1,4,1,1]</text>

  <circle cx="555" cy="150" r="4.5" fill="#0f172a"/>
  <text x="555" y="136" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">b₅ [1,5,1,1]</text>

  <circle cx="735" cy="150" r="6" fill="#dc2626"/>
  <text x="745" y="170" text-anchor="middle" font-size="11.5" font-weight="700" fill="#dc2626">e₄=b₆ [3,6,1,1]</text>

  <!-- P3 Events -->
  <circle cx="135" cy="230" r="4.5" fill="#0f172a"/>
  <text x="135" y="250" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">c₁ [0,0,1,0]</text>

  <circle cx="465" cy="230" r="4.5" fill="#0f172a"/>
  <text x="455" y="250" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">c₂ [1,4,2,1]</text>

  <circle cx="535" cy="230" r="4.5" fill="#0f172a"/>
  <text x="535" y="216" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">c₃ [2,4,3,3]</text>

  <circle cx="615" cy="230" r="4.5" fill="#0f172a"/>
  <text x="625" y="250" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">c₄ [2,4,4,3]</text>

  <!-- P4 Events -->
  <circle cx="160" cy="310" r="4.5" fill="#0f172a"/>
  <text x="160" y="330" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">d₁ [0,0,0,1]</text>

  <circle cx="390" cy="310" r="4.5" fill="#0f172a"/>
  <text x="385" y="330" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">d₂ [2,0,0,2]</text>

  <circle cx="460" cy="310" r="4.5" fill="#0f172a"/>
  <text x="465" y="330" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">d₃ [2,0,0,3]</text>

  <circle cx="705" cy="310" r="6" fill="#dc2626"/>
  <text x="705" y="330" text-anchor="middle" font-size="11.5" font-weight="700" fill="#dc2626">e₅=d₄ [2,5,1,4]</text>

  <text x="430" y="352" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">Results: e₁ || e₂,   e₁ → e₃,   e₂ → e₃,   e₁ → e₄,   e₁ → e₅,   e₃ || e₄ || e₅</text>
</svg>
