<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 250" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="780" height="250" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="390" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Why Ordering Matters: Out-of-Order Message Arrival Changes Meaning</text>

  <!-- Left panel: Sent Order -->
  <rect x="25" y="48" width="350" height="182" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="200" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">Case 1: Received in Send Order</text>
  <rect x="45" y="88" width="310" height="38" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="58" y="112" font-size="12" font-weight="600" fill="#1e293b">1. "No lecture tomorrow"</text>
  <rect x="45" y="138" width="310" height="38" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="58" y="162" font-size="12" font-weight="600" fill="#1e293b">2. "Do this assignment before next lecture"</text>
  <text x="200" y="206" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">Interpretation: Due after the skipped lecture (next week)</text>

  <!-- Right panel: Reversed Order -->
  <rect x="405" y="48" width="350" height="182" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="580" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">Case 2: Network Delays Swap Messages</text>
  <rect x="425" y="88" width="310" height="38" rx="6" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/>
  <text x="438" y="112" font-size="12" font-weight="600" fill="#1e293b">1. "Do this assignment before next lecture"</text>
  <rect x="425" y="138" width="310" height="38" rx="6" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/>
  <text x="438" y="162" font-size="12" font-weight="600" fill="#1e293b">2. "No lecture tomorrow"</text>
  <text x="580" y="206" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">Interpretation: Student rushes assignment for tomorrow!</text>
</svg>
