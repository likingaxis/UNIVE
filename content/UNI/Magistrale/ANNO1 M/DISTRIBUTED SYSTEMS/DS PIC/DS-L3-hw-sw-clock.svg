<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="820" height="250" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="410" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Physical Computer Clock Architecture: Hardware vs. Software Clock</text>

  <!-- Quartz Oscillator Box -->
  <rect x="30" y="65" width="200" height="135" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="130" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">Quartz Crystal Oscillator</text>
  <!-- Crystal icon / wave -->
  <path d="M 65 125 Q 80 100, 95 125 T 125 125 T 155 125 T 185 125" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <text x="130" y="158" text-anchor="middle" font-size="12" fill="#334155">Oscillates under tension</text>
  <text x="130" y="178" text-anchor="middle" font-size="11" fill="#64748b">Sensitive to temperature &amp; age</text>

  <!-- Arrow 1 -->
  <line x1="230" y1="132" x2="295" y2="132" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="262" y="122" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">ticks</text>

  <!-- Hardware Counter Box -->
  <rect x="295" y="65" width="215" height="135" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="402" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">Hardware Clock Hᵢ(t)</text>
  <rect x="325" y="108" width="155" height="34" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="402" y="130" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#14532d">010011010110...</text>
  <text x="402" y="164" text-anchor="middle" font-size="12" fill="#334155">Counts oscillations from origin</text>
  <text x="402" y="182" text-anchor="middle" font-size="11" fill="#64748b">Triggers periodic OS interrupts</text>

  <!-- Arrow 2 -->
  <line x1="510" y1="132" x2="575" y2="132" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="542" y="122" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">scaling</text>

  <!-- Software Clock Box -->
  <rect x="575" y="65" width="215" height="135" rx="10" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="682" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#7e22ce">Software Clock Cᵢ(t)</text>
  <rect x="595" y="108" width="175" height="34" rx="6" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="682" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#581c87">Cᵢ(t) = α · Hᵢ(t) + β</text>
  <text x="682" y="164" text-anchor="middle" font-size="12" fill="#334155">α : clock speed (rate adjustment)</text>
  <text x="682" y="182" text-anchor="middle" font-size="12" fill="#334155">β : clock offset (reference shift)</text>

  <!-- Bottom note -->
  <text x="410" y="228" text-anchor="middle" font-size="12" fill="#475569">Applications read Cᵢ(t) to timestamp local events: C(e) := Cᵢ(t)</text>
</svg>
