<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 310" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="820" height="310" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="410" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">FIFO Algorithm Modifications: Key Counterexample Traces</text>

  <!-- Panel 1: Modification A -->
  <rect x="20" y="46" width="380" height="244" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="210" y="68" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Modification A: Guard sn' ≥ next (with next++)</text>

  <!-- Timelines Panel 1 -->
  <text x="45" y="105" font-size="13" font-weight="700" fill="#1d4ed8">p</text>
  <line x1="65" y1="100" x2="375" y2="100" stroke="#334155" stroke-width="2"/>
  <text x="45" y="210" font-size="13" font-weight="700" fill="#15803d">q</text>
  <line x1="65" y1="205" x2="375" y2="205" stroke="#334155" stroke-width="2"/>

  <!-- Send points on p -->
  <circle cx="95" cy="100" r="4" fill="#2563eb"/>
  <text x="95" y="88" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">m₁(1)</text>
  <circle cx="140" cy="100" r="4" fill="#2563eb"/>
  <text x="140" y="88" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">m₂(2)</text>
  <circle cx="185" cy="100" r="4" fill="#2563eb"/>
  <text x="185" y="88" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">m₃(3)</text>

  <!-- Crossing arrows -->
  <!-- Every delivery occurs after its send; arrivals may reorder. -->
  <line x1="185" y1="100" x2="235" y2="200" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red)"/>
  <line x1="140" y1="100" x2="295" y2="200" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="95" y1="100" x2="355" y2="200" stroke="#64748b" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arr-blue)"/>

  <!-- Deliveries on q -->
  <circle cx="235" cy="205" r="4" fill="#dc2626"/>
  <text x="235" y="225" text-anchor="middle" font-size="11" font-weight="700" fill="#dc2626">Deliv m₃</text>
  <text x="235" y="240" text-anchor="middle" font-size="10" fill="#475569">next=2</text>

  <circle cx="295" cy="205" r="4" fill="#2563eb"/>
  <text x="295" y="225" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">Deliv m₂</text>
  <text x="295" y="240" text-anchor="middle" font-size="10" fill="#475569">next=3</text>

  <circle cx="355" cy="205" r="4" fill="#64748b"/>
  <text x="355" y="225" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">m₁ stuck!</text>
  <text x="355" y="240" text-anchor="middle" font-size="10" fill="#475569">sn=1 &lt; 3</text>

  <text x="210" y="274" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">Violates FIFO (m₃ before m₂) &amp; Reliable Delivery (m₁ stuck)</text>

  <!-- Panel 2: Modification C -->
  <rect x="420" y="46" width="380" height="244" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="610" y="68" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Modification C: Guard sn' ≥ next, No Removal from pending</text>

  <rect x="445" y="88" width="330" height="34" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="610" y="110" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">m₃(3) arrives at next = 1 and remains in pending</text>

  <rect x="445" y="132" width="330" height="28" rx="5" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="610" y="150" text-anchor="middle" font-size="11" font-weight="600" fill="#991b1b">Handler 1: 3 ≥ 1 holds → Deliver m₃ (#1), next := 2</text>

  <rect x="445" y="166" width="330" height="28" rx="5" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="610" y="184" text-anchor="middle" font-size="11" font-weight="600" fill="#991b1b">Handler 2: 3 ≥ 2 holds → Deliver m₃ (#2), next := 3</text>

  <rect x="445" y="200" width="330" height="28" rx="5" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="610" y="218" text-anchor="middle" font-size="11" font-weight="600" fill="#991b1b">Handler 3: 3 ≥ 3 holds → Deliver m₃ (#3), next := 4</text>

  <rect x="445" y="234" width="330" height="24" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="610" y="250" text-anchor="middle" font-size="11" fill="#475569">Now 3 ≥ 4 is false: m₃ no longer enables delivery</text>

  <text x="610" y="276" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">Duplicates shown; other failures are explained in the note</text>
</svg>
