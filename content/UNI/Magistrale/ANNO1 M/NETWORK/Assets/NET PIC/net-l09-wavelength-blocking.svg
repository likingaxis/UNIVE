<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="600" height="250" role="img" aria-label="Wavelength continuity blocking example along route A to B to C" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,Helvetica,sans-serif;color:#243d57">
  <title>Wavelength blocking example along route A → B → C</title>
  <rect width="100%" height="100%" fill="#ffffff" rx="8" />
  <text x="24" y="30" font-size="15" font-weight="700" fill="#243d57">Wavelength availability along route A → B → C (no conversion at B)</text>

  <!-- Link A-B: lambda_1 free (top), lambda_2 occupied (bottom) -->
  <line x1="114" y1="88" x2="276" y2="88" stroke="#d96b43" stroke-width="4.5" stroke-linecap="round" />
  <line x1="114" y1="112" x2="276" y2="112" stroke="#1f9d78" stroke-opacity="0.38" stroke-width="3" stroke-dasharray="7 6" stroke-linecap="round" />

  <text x="178" y="73" font-size="13" font-weight="700" fill="#b84b27" text-anchor="end">λ</text>
  <text x="179" y="76" font-size="9.5" font-weight="700" fill="#b84b27" text-anchor="start">1</text>
  <text x="188" y="73" font-size="13" font-weight="700" fill="#b84b27" text-anchor="start">free</text>

  <text x="167" y="135" font-size="12" font-weight="600" fill="#64748b" text-anchor="end">λ</text>
  <text x="168" y="138" font-size="9" font-weight="600" fill="#64748b" text-anchor="start">2</text>
  <text x="176" y="135" font-size="12" font-weight="600" fill="#64748b" text-anchor="start">occupied</text>

  <!-- Link B-C: lambda_1 occupied (top), lambda_2 free (bottom) -->
  <line x1="324" y1="88" x2="486" y2="88" stroke="#d96b43" stroke-opacity="0.38" stroke-width="3" stroke-dasharray="7 6" stroke-linecap="round" />
  <line x1="324" y1="112" x2="486" y2="112" stroke="#1f9d78" stroke-width="4.5" stroke-linecap="round" />

  <text x="377" y="73" font-size="12" font-weight="600" fill="#64748b" text-anchor="end">λ</text>
  <text x="378" y="76" font-size="9" font-weight="600" fill="#64748b" text-anchor="start">1</text>
  <text x="386" y="73" font-size="12" font-weight="600" fill="#64748b" text-anchor="start">occupied</text>

  <text x="388" y="135" font-size="13" font-weight="700" fill="#167a5c" text-anchor="end">λ</text>
  <text x="389" y="138" font-size="9.5" font-weight="700" fill="#167a5c" text-anchor="start">2</text>
  <text x="398" y="135" font-size="13" font-weight="700" fill="#167a5c" text-anchor="start">free</text>

  <!-- Nodes -->
  <circle cx="90" cy="100" r="24" fill="#ddebf7" stroke="#568cc3" stroke-width="2.2" />
  <text x="90" y="105" font-size="15" font-weight="700" fill="#243d57" text-anchor="middle">A</text>

  <circle cx="300" cy="100" r="24" fill="#ddebf7" stroke="#568cc3" stroke-width="2.2" />
  <text x="300" y="105" font-size="15" font-weight="700" fill="#243d57" text-anchor="middle">B</text>

  <circle cx="510" cy="100" r="24" fill="#ddebf7" stroke="#568cc3" stroke-width="2.2" />
  <text x="510" y="105" font-size="15" font-weight="700" fill="#243d57" text-anchor="middle">C</text>

  <!-- Legend -->
  <line x1="150" y1="168" x2="186" y2="168" stroke="#334155" stroke-width="4" stroke-linecap="round" />
  <text x="194" y="172" font-size="12" fill="#334155">Free channel</text>

  <line x1="322" y1="168" x2="358" y2="168" stroke="#64748b" stroke-opacity="0.7" stroke-width="3" stroke-dasharray="7 6" stroke-linecap="round" />
  <text x="366" y="172" font-size="12" fill="#334155">Occupied channel</text>

  <!-- Outcome banner -->
  <rect x="44" y="192" width="512" height="38" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2" />
  <text x="300" y="216" font-size="13" font-weight="600" fill="#991b1b" text-anchor="middle">No common free wavelength across A → B → C: connection blocked on this route</text>
</svg>
