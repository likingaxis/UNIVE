<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 156" width="560" height="156" role="img" aria-label="Comparison of optical connection setup time versus active service lifetime" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,Helvetica,sans-serif;color:#243d57">
  <title>Connection setup time vs. service lifetime</title>
  <rect width="100%" height="100%" fill="#ffffff" rx="8" />
  <text x="20" y="30" font-size="15" font-weight="700" fill="#243d57">Connection setup vs. active service lifetime (not to scale)</text>

  <text x="20" y="64" font-size="13" font-weight="600" fill="#243d57">Setup</text>
  <rect x="130" y="50" width="404" height="20" rx="10" fill="#eef2f6" stroke="#cbd5e1" stroke-width="1" />
  <rect x="130" y="50" width="14" height="20" rx="7" fill="#d97724" />
  <text x="154" y="64" font-size="12" fill="#475569">One-time route selection &amp; channel reservation</text>

  <text x="20" y="102" font-size="13" font-weight="600" fill="#243d57">Active service</text>
  <rect x="130" y="88" width="404" height="20" rx="10" fill="#2f89b8" />
  <text x="332" y="102" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Months to years of traffic exchange</text>

  <text x="20" y="136" font-size="12" fill="#475569">Because the path remains open for a long lifetime, initial setup overhead becomes negligible.</text>
</svg>
