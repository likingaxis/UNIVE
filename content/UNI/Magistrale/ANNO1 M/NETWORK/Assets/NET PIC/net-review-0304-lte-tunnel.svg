<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="650" viewBox="0 0 1080 650" role="img" aria-labelledby="title desc">
<title id="title">LTE control plane, user plane and GTP-U encapsulation</title>
<desc id="desc">The user data path connects UE, eNodeB, S-GW, P-GW and Internet. Dashed connections link the base station, MME, HSS and gateways for control. A packet-core tunnel wraps the original user IP packet with outer IP, UDP and GTP-U headers. The original IP packet includes its own header and payload.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2463a0"/></marker></defs>
<rect width="1080" height="650" rx="18" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" fill="#17324b">
<text x="40" y="48" font-size="29" font-weight="700">LTE: control establishes the path; data uses it</text>
<g fill="#fff1df" stroke="#b35419" stroke-width="2"><rect x="330" y="100" width="190" height="75" rx="10"/><rect x="690" y="100" width="230" height="75" rx="10"/></g>
<g text-anchor="middle"><text x="425" y="132" font-size="25" font-weight="700">MME</text><text x="425" y="158" font-size="18">Mobility / control</text><text x="805" y="132" font-size="25" font-weight="700">HSS</text><text x="805" y="158" font-size="18">Subscriber information</text></g>
<path d="M520 137H690 M425 175L315 268 M425 175L530 268 M425 175L745 268" fill="none" stroke="#b35419" stroke-width="2.5" stroke-dasharray="7 6"/>
<text x="603" y="118" text-anchor="middle" font-size="18" fill="#984815">control</text>
<g fill="none" stroke="#2463a0" stroke-width="4" marker-end="url(#arr)"><path d="M175 307H231"/><path d="M395 307H461"/><path d="M595 307H676"/><path d="M810 307H901"/></g>
<g fill="#dceafa" stroke="#2463a0" stroke-width="2"><rect x="45" y="268" width="130" height="78" rx="10"/><rect x="235" y="268" width="160" height="78" rx="10"/><rect x="465" y="268" width="130" height="78" rx="10"/><rect x="680" y="268" width="130" height="78" rx="10"/><rect x="905" y="268" width="135" height="78" rx="10"/></g>
<g text-anchor="middle" font-size="24" font-weight="700"><text x="110" y="315">UE</text><text x="315" y="300">eNodeB</text><text x="530" y="315">S-GW</text><text x="745" y="315">P-GW</text><text x="972" y="315">Internet</text></g>
<text x="315" y="327" text-anchor="middle" font-size="18">Base station</text><text x="202" y="255" text-anchor="middle" font-size="18">radio</text>
<text x="540" y="383" text-anchor="middle" font-size="20" fill="#2463a0">Solid path: user packets (downstream follows the reverse direction).</text>
<rect x="40" y="418" width="1000" height="192" rx="12" fill="#ffffff" stroke="#d3dee7"/>
<text x="65" y="453" font-size="23" font-weight="700">Inside a packet-core tunnel</text>
<g stroke="#627b90" stroke-width="1.5"><rect x="70" y="478" width="170" height="64" fill="#dceafa"/><rect x="240" y="478" width="120" height="64" fill="#dceafa"/><rect x="360" y="478" width="170" height="64" fill="#fff1df"/><rect x="530" y="478" width="480" height="64" fill="#e2f2ed"/></g>
<g text-anchor="middle" font-size="21"><text x="155" y="517">Outer IP</text><text x="300" y="517">UDP</text><text x="445" y="517">GTP-U</text><text x="770" y="506" font-weight="700">Original user IP packet</text><text x="770" y="531" font-size="18">original IP header + payload</text></g>
<text x="540" y="581" text-anchor="middle" font-size="19">The tunnel exit removes the outer envelope. Encapsulation alone is not encryption.</text>
</g></svg>
