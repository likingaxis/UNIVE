<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390"
     role="img" aria-labelledby="sub-title sub-desc"
     style="font-family:'Segoe UI',Arial,Helvetica,sans-serif">
  <title id="sub-title">All-optical subnetworks separated by intermediate electrical processing</title>
  <desc id="sub-desc">Top shows the electrical domain above and the optical domain below: edge O/E/O transponders adapt client signals, and an intermediate O/E/O point splits the optical network into two all-optical subnetworks. Bottom shows the analogy with two IP LANs interconnected by a router.</desc>

  <defs>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1L10 5L0 9Z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="880" height="390" rx="12" fill="#ffffff"/>

  <!-- TOP PANEL: Electrical vs Optical Subnetworks -->
  <rect x="20" y="16" width="840" height="236" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="40" y="45" font-size="17" font-weight="700" fill="#0f172a">How intermediate electronics splits an optical network into subnetworks</text>

  <!-- Domain labels on left -->
  <text x="42" y="88" font-size="13.5" font-weight="700" fill="#1e293b">Electrical</text>
  <text x="42" y="106" font-size="13.5" font-weight="700" fill="#1e293b">domain</text>

  <text x="42" y="176" font-size="13.5" font-weight="700" fill="#1d4ed8">Optical</text>
  <text x="42" y="194" font-size="13.5" font-weight="700" fill="#1d4ed8">domain</text>

  <!-- Dashed domain separator -->
  <line x1="125" y1="126" x2="830" y2="126" stroke="#64748b" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Two all-optical subnet clouds (rounded ellipses) -->
  <rect x="195" y="146" width="225" height="82" rx="41" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="307" y="185" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">All-optical</text>
  <text x="307" y="204" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">subnetwork 1</text>

  <rect x="520" y="146" width="225" height="82" rx="41" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="632" y="185" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">All-optical</text>
  <text x="632" y="204" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">subnetwork 2</text>

  <!-- Vertical red split marker -->
  <line x1="470" y1="138" x2="470" y2="238" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="5 4"/>

  <!-- Edge and intermediate electrical boxes -->
  <rect x="138" y="64" width="90" height="44" rx="7" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
  <text x="183" y="84" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Edge O/E/O</text>
  <text x="183" y="99" font-size="11" fill="#475569" text-anchor="middle">(Adaptation)</text>

  <rect x="380" y="64" width="180" height="44" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="470" y="84" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">Intermediate O/E/O</text>
  <text x="470" y="99" font-size="11" fill="#7f1d1d" text-anchor="middle">(Regeneration or λ conversion)</text>

  <rect x="712" y="64" width="90" height="44" rx="7" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
  <text x="757" y="84" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Edge O/E/O</text>
  <text x="757" y="99" font-size="11" fill="#475569" text-anchor="middle">(Adaptation)</text>

  <!-- Signal path arrows between electrical boxes and optical subnets -->
  <path d="M183 108 V187 H195" fill="none" stroke="#334155" stroke-width="2.2"/>
  <path d="M420 187 H445 V112" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arr-s)"/>
  <path d="M495 108 V187 H516" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arr-s)"/>
  <path d="M745 187 H757 V112" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arr-s)"/>

  <!-- BOTTOM PANEL: IP LAN Analogy -->
  <rect x="20" y="268" width="840" height="106" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="40" y="295" font-size="15.5" font-weight="700" fill="#0f172a">Same idea in IP networks: two LANs connected through a router</text>

  <rect x="195" y="310" width="160" height="48" rx="24" fill="#e2e8f0" stroke="#64748b" stroke-width="1.8"/>
  <text x="275" y="339" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">LAN 1</text>

  <circle cx="440" cy="334" r="24" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="440" y="339" font-size="13" font-weight="700" fill="#991b1b" text-anchor="middle">Router</text>

  <rect x="525" y="310" width="160" height="48" rx="24" fill="#e2e8f0" stroke="#64748b" stroke-width="1.8"/>
  <text x="605" y="339" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">LAN 2</text>

  <line x1="355" y1="334" x2="416" y2="334" stroke="#334155" stroke-width="2.2"/>
  <line x1="464" y1="334" x2="525" y2="334" stroke="#334155" stroke-width="2.2"/>
</svg>
