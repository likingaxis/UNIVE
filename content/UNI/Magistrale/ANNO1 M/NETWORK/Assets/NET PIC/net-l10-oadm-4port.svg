<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 336" width="820" height="336"
     role="img" aria-labelledby="oadm-title oadm-desc"
     style="font-family:'Segoe UI',Arial,Helvetica,sans-serif">
  <title id="oadm-title">Four-port logical abstraction of an Optical Add/Drop Multiplexer (OADM)</title>
  <desc id="oadm-desc">Incoming WDM signal carries passthrough wavelengths (lambda 2, 3, 4) optically across the OADM, drops lambda 1 locally through the Drop port, and reuses lambda 1 on the Add port for outgoing local traffic.</desc>

  <defs>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1L10 5L0 9Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1L10 5L0 9Z" fill="#2563eb"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1L10 5L0 9Z" fill="#0d9488"/>
    </marker>
  </defs>

  <rect width="820" height="336" rx="12" fill="#ffffff"/>
  <text x="410" y="34" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">OADM 4-port abstraction: optical pass-through with local drop and add</text>

  <!-- OADM outer box -->
  <rect x="235" y="70" width="350" height="136" rx="12" fill="#eef4fb" stroke="#568cc3" stroke-width="2.2"/>
  <text x="410" y="97" font-size="17" font-weight="700" fill="#1e3a5f" text-anchor="middle">OADM (Node B)</text>

  <!-- Incoming / Outgoing fiber sleeves -->
  <line x1="40" y1="138" x2="235" y2="138" stroke="#94a3b8" stroke-width="32" stroke-opacity="0.22"/>
  <line x1="585" y1="138" x2="780" y2="138" stroke="#94a3b8" stroke-width="32" stroke-opacity="0.22"/>

  <!-- Pass-through wavelengths (lambda 2, 3, 4) -->
  <path d="M46 125 H770" fill="none" stroke="#2563eb" stroke-width="2.6" marker-end="url(#arr-blue)"/>
  <path d="M46 135 H770" fill="none" stroke="#0d9488" stroke-width="2.6" marker-end="url(#arr-teal)"/>

  <!-- Optical passthrough pill -->
  <rect x="295" y="113" width="230" height="27" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="410" y="131" font-size="13" font-weight="700" fill="#1e40af" text-anchor="middle">Optical pass-through (λ₂, λ₃, λ₄)</text>

  <!-- Drop wavelength (lambda 1 from incoming fiber down to Drop port) -->
  <path d="M46 150 H305 Q325 150 325 170 V262" fill="none" stroke="#dc2626" stroke-width="2.8" marker-end="url(#arr-red)"/>

  <!-- Add wavelength (lambda 1 from Add port up into outgoing fiber) -->
  <path d="M495 266 V170 Q495 150 515 150 H770" fill="none" stroke="#dc2626" stroke-width="2.8" marker-end="url(#arr-red)"/>

  <!-- Upward arrow indicator on Add stem inside gap -->
  <path d="M495 245 V224" fill="none" stroke="#dc2626" stroke-width="2.8" marker-end="url(#arr-red)"/>

  <!-- Port indicators on OADM edges -->
  <circle cx="235" cy="138" r="5.5" fill="#0f172a"/>
  <circle cx="585" cy="138" r="5.5" fill="#0f172a"/>
  <circle cx="325" cy="206" r="5.5" fill="#dc2626"/>
  <circle cx="495" cy="206" r="5.5" fill="#dc2626"/>

  <!-- Labels -->
  <text x="135" y="108" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">Incoming WDM fiber</text>
  <text x="135" y="174" font-size="12" fill="#475569" text-anchor="middle">Carries λ₁ + transit λ₂..λ₄</text>

  <text x="685" y="108" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">Outgoing WDM fiber</text>
  <text x="685" y="174" font-size="12" fill="#475569" text-anchor="middle">Reused λ₁ + transit λ₂..λ₄</text>

  <!-- Drop and Add local boxes -->
  <rect x="255" y="266" width="140" height="46" rx="8" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
  <text x="325" y="286" font-size="13" font-weight="700" fill="#991b1b" text-anchor="middle">DROP (λ₁)</text>
  <text x="325" y="303" font-size="11.5" fill="#7f1d1d" text-anchor="middle">To local receiver (O/E)</text>

  <rect x="425" y="266" width="140" height="46" rx="8" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
  <text x="495" y="286" font-size="13" font-weight="700" fill="#991b1b" text-anchor="middle">ADD (λ₁)</text>
  <text x="495" y="303" font-size="11.5" fill="#7f1d1d" text-anchor="middle">From local sender (E/O)</text>

  <text x="410" y="180" font-size="12" font-weight="600" fill="#b91c1c" text-anchor="middle">Dropping λ₁ frees λ₁</text>
  <text x="410" y="195" font-size="12" font-weight="600" fill="#b91c1c" text-anchor="middle">for reuse toward C</text>
</svg>
