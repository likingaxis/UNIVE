<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-label="Four network topologies" style="font-family:Arial,Helvetica,sans-serif;color:#243d57"><title>Four network topologies</title><desc>Point-to-point, tree, ring and mesh, composed from the supplied SVG sketches.</desc><rect width="100%" height="100%" fill="#ffffff" /><text x="24" y="41" font-size="23" font-weight="700" fill="#243d57" text-anchor="start">Point-to-point</text><svg font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-weight="430" fill="currentColor" style="font-family:Arial,Helvetica,sans-serif;color:#243d57" viewBox="0 0 150 88" width="320" x="89" y="60" height="165"><path d="M30 44H120" stroke="#5C86B8" stroke-width="3" /><circle cx="30" cy="44" r="12" fill="#DCEBF7" stroke="#5C86B8" stroke-width="2" /><circle cx="120" cy="44" r="12" fill="#DCEBF7" stroke="#5C86B8" stroke-width="2" /></svg><text x="24" y="247" font-size="16" font-weight="400" fill="#243d57" text-anchor="start">One direct link</text><text x="524" y="41" font-size="23" font-weight="700" fill="#243d57" text-anchor="start">Tree</text><svg font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-weight="430" fill="currentColor" style="font-family:Arial,Helvetica,sans-serif;color:#243d57" viewBox="0 0 150 88" width="320" x="589" y="60" height="165"><g stroke="#5C86B8" stroke-width="2.5" fill="none"><path d="M75 13V37M75 37L31 70M75 37L75 70M75 37L119 70" /></g><circle cx="75" cy="13" r="8" fill="#DCEBF7" stroke="#5C86B8" stroke-width="2" /><circle cx="75" cy="37" r="8" fill="#DCEBF7" stroke="#5C86B8" stroke-width="2" /><circle cx="31" cy="70" r="8" fill="#DCEBF7" stroke="#5C86B8" stroke-width="2" /><circle cx="75" cy="70" r="8" fill="#DCEBF7" stroke="#5C86B8" stroke-width="2" /><circle cx="119" cy="70" r="8" fill="#DCEBF7" stroke="#5C86B8" stroke-width="2" /></svg><text x="524" y="247" font-size="16" font-weight="400" fill="#243d57" text-anchor="start">One path between each pair of nodes</text><text x="24" y="295" font-size="23" font-weight="700" fill="#243d57" text-anchor="start">Ring</text><svg font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-weight="430" fill="currentColor" style="font-family:Arial,Helvetica,sans-serif;color:#243d57" viewBox="0 0 150 88" width="320" x="89" y="314" height="165"><path d="M40 20H110L130 44L110 69H40L20 44Z" fill="none" stroke="#5C86B8" stroke-width="2.5" /><circle cx="40" cy="20" r="7" fill="#DCEBF7" stroke="#5C86B8" stroke-width="2" /><circle cx="110" cy="20" r="7" fill="#DCEBF7" stroke="#5C86B8" stroke-width="2" /><circle cx="130" cy="44" r="7" fill="#DCEBF7" stroke="#5C86B8" stroke-width="2" /><circle cx="110" cy="69" r="7" fill="#DCEBF7" stroke="#5C86B8" stroke-width="2" /><circle cx="40" cy="69" r="7" fill="#DCEBF7" stroke="#5C86B8" stroke-width="2" /><circle cx="20" cy="44" r="7" fill="#DCEBF7" stroke="#5C86B8" stroke-width="2" /></svg><text x="24" y="501" font-size="16" font-weight="400" fill="#243d57" text-anchor="start">Two directions around the ring</text><text x="524" y="295" font-size="23" font-weight="700" fill="#243d57" text-anchor="start">Mesh</text><svg font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-weight="430" fill="currentColor" style="font-family:Arial,Helvetica,sans-serif;color:#243d57" viewBox="0 0 150 88" width="320" x="589" y="314" height="165"><g stroke="#5C86B8" stroke-width="2.3" fill="none"><path d="M16 44L45 15L101 15L134 44L101 73L45 73Z" /><path d="M16 44L45 73M45 15L101 73M45 73L101 15M101 15L134 44M45 15L45 73M101 15L101 73" /></g><circle cx="16" cy="44" r="7" fill="#DCEBF7" stroke="#5C86B8" stroke-width="2" /><circle cx="45" cy="15" r="7" fill="#DCEBF7" stroke="#5C86B8" stroke-width="2" /><circle cx="101" cy="15" r="7" fill="#DCEBF7" stroke="#5C86B8" stroke-width="2" /><circle cx="134" cy="44" r="7" fill="#DCEBF7" stroke="#5C86B8" stroke-width="2" /><circle cx="101" cy="73" r="7" fill="#DCEBF7" stroke="#5C86B8" stroke-width="2" /><circle cx="45" cy="73" r="7" fill="#DCEBF7" stroke="#5C86B8" stroke-width="2" /></svg><text x="524" y="501" font-size="16" font-weight="400" fill="#243d57" text-anchor="start">Several paths may connect the same endpoints</text></svg>