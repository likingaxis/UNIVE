<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" width="1100" height="470" role="img" aria-label="Access networks and transport networks" style="font-family:Arial,Helvetica,sans-serif;color:#243d57"><title>Access networks and transport networks</title><desc>Alice and Bob use local access providers. A carrier connects the distant access networks. The access operator is both a provider to users and a customer of transport.</desc><rect width="100%" height="100%" fill="#ffffff" /><text x="30" y="38" font-size="25" font-weight="700" fill="#243d57" text-anchor="start">Access connects users; transport interconnects distant networks</text><rect x="25" y="90" width="120" height="100" rx="12" fill="#edf5fd" stroke="#7494b6" stroke-width="1.5" /><text x="85.0" y="132" font-size="18" font-weight="700" fill="#243d57" text-anchor="middle">Alice</text><text x="85.0" y="160" font-size="15" font-weight="400" fill="#243d57" text-anchor="middle">Rome</text><rect x="180" y="90" width="200" height="100" rx="12" fill="#e5f1fc" stroke="#7494b6" stroke-width="1.5" /><text x="280.0" y="132" font-size="18" font-weight="700" fill="#243d57" text-anchor="middle">Access network A</text><text x="280.0" y="160" font-size="15" font-weight="400" fill="#243d57" text-anchor="middle">Local connectivity</text><rect x="415" y="90" width="270" height="100" rx="12" fill="#eae6f6" stroke="#7494b6" stroke-width="1.5" /><text x="550.0" y="132" font-size="18" font-weight="700" fill="#243d57" text-anchor="middle">Transport network</text><text x="550.0" y="160" font-size="15" font-weight="400" fill="#243d57" text-anchor="middle">Carrier / wide-area service</text><rect x="720" y="90" width="200" height="100" rx="12" fill="#e5f1fc" stroke="#7494b6" stroke-width="1.5" /><text x="820.0" y="132" font-size="18" font-weight="700" fill="#243d57" text-anchor="middle">Access network B</text><text x="820.0" y="160" font-size="15" font-weight="400" fill="#243d57" text-anchor="middle">Local connectivity</text><rect x="955" y="90" width="120" height="100" rx="12" fill="#edf5fd" stroke="#7494b6" stroke-width="1.5" /><text x="1015.0" y="132" font-size="18" font-weight="700" fill="#243d57" text-anchor="middle">Bob</text><text x="1015.0" y="160" font-size="15" font-weight="400" fill="#243d57" text-anchor="middle">Milan</text><path d="M149 140h24m-6 -6l6 6l-6 6" stroke="#517fb0" stroke-width="2.5" fill="none" /><path d="M384 140h24m-6 -6l6 6l-6 6" stroke="#517fb0" stroke-width="2.5" fill="none" /><path d="M689 140h24m-6 -6l6 6l-6 6" stroke="#517fb0" stroke-width="2.5" fill="none" /><path d="M924 140h24m-6 -6l6 6l-6 6" stroke="#517fb0" stroke-width="2.5" fill="none" /><text x="30" y="229" font-size="19" font-weight="400" fill="#243d57" text-anchor="start">The same access operator provides service to users and buys transport service.</text><rect x="25" y="257" width="510" height="190" rx="12" fill="#edf5fd" stroke="#bac9d9" /><text x="45" y="290" font-size="23" font-weight="700" fill="#243d57" text-anchor="start">Access network</text><text x="45" y="324" font-size="17" font-weight="400" fill="#243d57" text-anchor="start">Customer: an end user or organization</text><text x="45" y="353" font-size="17" font-weight="400" fill="#243d57" text-anchor="start">Role: connect users to an operator</text><text x="45" y="382" font-size="17" font-weight="400" fill="#243d57" text-anchor="start">Scope: relatively limited geographical area</text><text x="45" y="411" font-size="17" font-weight="400" fill="#243d57" text-anchor="start">Traffic: collect individual users' flows</text><rect x="565" y="257" width="510" height="190" rx="12" fill="#f1eef9" stroke="#bac9d9" /><text x="585" y="290" font-size="23" font-weight="700" fill="#243d57" text-anchor="start">Transport network</text><text x="585" y="324" font-size="17" font-weight="400" fill="#243d57" text-anchor="start">Customer: often another network operator</text><text x="585" y="353" font-size="17" font-weight="400" fill="#243d57" text-anchor="start">Role: connect geographically separated networks</text><text x="585" y="382" font-size="17" font-weight="400" fill="#243d57" text-anchor="start">Scope: cities, countries or continents (WAN)</text><text x="585" y="411" font-size="17" font-weight="400" fill="#243d57" text-anchor="start">Traffic: carry aggregates from multiple networks</text></svg>