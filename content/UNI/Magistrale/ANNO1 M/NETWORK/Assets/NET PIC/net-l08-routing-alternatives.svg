<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" width="1000" height="350" role="img" aria-label="Routing before and after a link failure" style="font-family:Arial,Helvetica,sans-serif;color:#243d57"><title>Routing before and after a link failure</title><desc>Left: path A-B-C-F. Right: after a failure on B-C, use A-D-E-F.</desc><rect width="100%" height="100%" fill="#ffffff" /><text x="30" y="36" font-size="22" font-weight="700" fill="#243d57" text-anchor="start">Primary path: A - B - C - F</text><text x="530" y="36" font-size="22" font-weight="700" fill="#243d57" text-anchor="start">Alternative path: A - D - E - F</text><svg font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-weight="430" fill="currentColor" style="font-family:Arial,Helvetica,sans-serif;color:#243d57" viewBox="0 0 320 155" width="470" x="15" y="55" height="230"><g stroke="currentColor" stroke-opacity=".25" stroke-width="3" fill="none"><path d="M35 75L120 30L210 30L285 75M35 75L120 120L210 120L285 75M120 30L120 120M210 30L210 120" /></g><path d="M35 75L120 30L210 30L285 75" fill="none" stroke="#D28A34" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="35" cy="75" r="15" fill="#DCEBF7" stroke="#517FB0" stroke-width="2" /><text x="35" y="79" text-anchor="middle" font-size="12" font-weight="600" fill="#243D57">A</text><circle cx="120" cy="30" r="15" fill="#DCEBF7" stroke="#517FB0" stroke-width="2" /><text x="120" y="34" text-anchor="middle" font-size="12" font-weight="600" fill="#243D57">B</text><circle cx="210" cy="30" r="15" fill="#DCEBF7" stroke="#517FB0" stroke-width="2" /><text x="210" y="34" text-anchor="middle" font-size="12" font-weight="600" fill="#243D57">C</text><circle cx="120" cy="120" r="15" fill="#DCEBF7" stroke="#517FB0" stroke-width="2" /><text x="120" y="124" text-anchor="middle" font-size="12" font-weight="600" fill="#243D57">D</text><circle cx="210" cy="120" r="15" fill="#DCEBF7" stroke="#517FB0" stroke-width="2" /><text x="210" y="124" text-anchor="middle" font-size="12" font-weight="600" fill="#243D57">E</text><circle cx="285" cy="75" r="15" fill="#DCEBF7" stroke="#517FB0" stroke-width="2" /><text x="285" y="79" text-anchor="middle" font-size="12" font-weight="600" fill="#243D57">F</text></svg><svg font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-weight="430" fill="currentColor" style="font-family:Arial,Helvetica,sans-serif;color:#243d57" viewBox="0 0 320 155" width="470" x="515" y="55" height="230"><g stroke="currentColor" stroke-opacity=".25" stroke-width="3" fill="none"><path d="M35 75L120 30L210 30L285 75M35 75L120 120L210 120L285 75M120 30L120 120M210 30L210 120" /></g><path d="M35 75L120 120L210 120L285 75" fill="none" stroke="#29977A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M165 30L195 30" stroke="#CE625B" stroke-width="4" stroke-linecap="round" stroke-dasharray="5 5" /><path d="M172 22L186 38M186 22L172 38" stroke="#CE625B" stroke-width="3" /><circle cx="35" cy="75" r="15" fill="#DCEBF7" stroke="#517FB0" stroke-width="2" /><text x="35" y="79" text-anchor="middle" font-size="12" font-weight="600" fill="#243D57">A</text><circle cx="120" cy="30" r="15" fill="#DCEBF7" stroke="#517FB0" stroke-width="2" /><text x="120" y="34" text-anchor="middle" font-size="12" font-weight="600" fill="#243D57">B</text><circle cx="210" cy="30" r="15" fill="#DCEBF7" stroke="#517FB0" stroke-width="2" /><text x="210" y="34" text-anchor="middle" font-size="12" font-weight="600" fill="#243D57">C</text><circle cx="120" cy="120" r="15" fill="#DCEBF7" stroke="#517FB0" stroke-width="2" /><text x="120" y="124" text-anchor="middle" font-size="12" font-weight="600" fill="#243D57">D</text><circle cx="210" cy="120" r="15" fill="#DCEBF7" stroke="#517FB0" stroke-width="2" /><text x="210" y="124" text-anchor="middle" font-size="12" font-weight="600" fill="#243D57">E</text><circle cx="285" cy="75" r="15" fill="#DCEBF7" stroke="#517FB0" stroke-width="2" /><text x="285" y="79" text-anchor="middle" font-size="12" font-weight="600" fill="#243D57">F</text></svg><text x="30" y="324" font-size="17" font-weight="400" fill="#243d57" text-anchor="start">The orange path uses the upper links.</text><text x="530" y="324" font-size="17" font-weight="400" fill="#243d57" text-anchor="start">The green path bypasses the failed B-C link.</text></svg>