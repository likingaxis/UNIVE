<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 460" width="1060" height="460" role="img" aria-label="Two functional domains of a network node" style="font-family:Arial,Helvetica,sans-serif;color:#243d57"><title>Two functional domains of a network node</title><desc>A cleaned version of the professor's conceptual cylinder sketch: electronic processing above, optical transmission and wavelength handling below.</desc><rect width="100%" height="100%" fill="#ffffff" /><text x="30" y="35" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#243d57" text-anchor="start">A conceptual network node</text><rect x="400" y="94" width="260" height="140" fill="#e8f1fb" /><rect x="400" y="234" width="260" height="140" fill="#eeebf7" /><ellipse cx="530" cy="374" rx="130" ry="36" fill="#eeebf7" stroke="#7494b6" stroke-width="2" /><path d="M400 94V374M660 94V374M400 234H660" fill="none" stroke="#7494b6" stroke-width="2" /><ellipse cx="530" cy="94" rx="130" ry="36" fill="#f5f8fc" stroke="#7494b6" stroke-width="2" /><text x="530" y="177" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#243d57" text-anchor="middle">Electrical</text><text x="530" y="312" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#243d57" text-anchor="middle">Optical</text><text x="35" y="172" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#243d57" text-anchor="start">Electrical domain</text><path d="M275 165H380m-10 -7l10 7l-10 7" fill="none" stroke="#517fb0" stroke-width="2" /><text x="35" y="309" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#243d57" text-anchor="start">Optical domain</text><path d="M275 302H380m-10 -7l10 7l-10 7" fill="none" stroke="#517fb0" stroke-width="2" /><text x="700" y="154" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#243d57" text-anchor="start">Digital information</text><text x="700" y="184" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#243d57" text-anchor="start">Buffers, headers, table lookups</text><text x="700" y="285" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#243d57" text-anchor="start">Light signals</text><text x="700" y="315" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#243d57" text-anchor="start">Transmission and wavelength</text><text x="700" y="345" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#243d57" text-anchor="start">multiplexing / switching</text><text x="530" y="442" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#243d57" text-anchor="middle">The sketch separates functions; it does not prescribe an O/E/O conversion for every signal.</text></svg>