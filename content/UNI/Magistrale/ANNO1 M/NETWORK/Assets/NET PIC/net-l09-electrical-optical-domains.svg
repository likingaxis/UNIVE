<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" width="1000" height="270" role="img" aria-label="Electrical and optical domains" style="font-family:Arial,Helvetica,sans-serif;color:#243d57"><title>Electrical and optical domains</title><desc>Electrical circuits process recovered digital data. Optical devices transmit, multiplex and switch optical signals; wavelength switching does not inspect IP packet headers.</desc><rect width="100%" height="100%" fill="#ffffff" /><rect x="20" y="20" width="465" height="195" rx="14" fill="#e8f1fb" stroke="#91a8c0" stroke-width="1.5" /><text x="40" y="58" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#243d57" text-anchor="start">Electrical domain</text><text x="40" y="103" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#243d57" text-anchor="start">Recover and process digital data</text><text x="40" y="138" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#243d57" text-anchor="start">Inspect headers and perform table lookups</text><text x="40" y="173" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#243d57" text-anchor="start">Buffer and forward packets electronically</text><rect x="515" y="20" width="465" height="195" rx="14" fill="#eeebf7" stroke="#91a8c0" stroke-width="1.5" /><text x="535" y="58" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#243d57" text-anchor="start">Optical domain</text><text x="535" y="103" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#243d57" text-anchor="start">Transmit light through fiber</text><text x="535" y="138" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#243d57" text-anchor="start">Multiplex and switch wavelength channels</text><text x="535" y="173" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#243d57" text-anchor="start">Forward configured optical connections</text><text x="500" y="249" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#243d57" text-anchor="middle">Optical wavelength switching does not require reading each IP packet header.</text></svg>