<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="t2 d2">
  <title id="t2">Fase 1: Spiegazione Interattiva a Sinistra e Blank Page tipo Obsidian a Destra</title>
  <desc id="d2">A sinistra lo studente sottolinea il testo dell'AI per aprire un pop-up di approfondimento o segnalare una spiegazione poco chiara. A destra scrive su un foglio bianco pulito in stile Obsidian con la propria struttura.</desc>

  <defs>
    <style>
      .f { font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .mono { font-family: "JetBrains Mono", Consolas, monospace; }
    </style>
    <filter id="sh" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#141419" flood-opacity="0.09"/>
    </filter>
    <filter id="sh-pop" x="-12%" y="-12%" width="124%" height="132%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#141419" flood-opacity="0.20"/>
    </filter>
    <filter id="sh-s" x="-6%" y="-6%" width="112%" height="118%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#141419" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Revision2000 App Background (bg: #e6e6e9) -->
  <rect width="960" height="540" rx="28" fill="#e6e6e9"/>

  <!-- ================= 1. LEFT DARK RAIL (.rail in Revision2000) ================= -->
  <rect x="16" y="16" width="68" height="508" rx="28" fill="#161618" filter="url(#sh)"/>

  <circle cx="46" cy="34" r="1.5" fill="#76767f"/><circle cx="54" cy="34" r="1.5" fill="#76767f"/>
  <circle cx="46" cy="40" r="1.5" fill="#76767f"/><circle cx="54" cy="40" r="1.5" fill="#76767f"/>

  <!-- 4-Point Star Logo -->
  <path d="M50 54 c.5 5.2 4.5 9.2 9.7 9.7 -5.2.5 -9.2 4.5 -9.7 9.7 -.5-5.2 -4.5-9.2 -9.7-9.7 5.2-.5 9.2-4.5 9.7-9.7z" fill="#ffffff"/>

  <!-- Rail Button: Corso -->
  <g transform="translate(21, 92)">
    <rect x="20" y="8" width="8" height="8" rx="2" fill="none" stroke="#a1a1aa" stroke-width="1.6"/>
    <rect x="30" y="8" width="8" height="8" rx="2" fill="none" stroke="#a1a1aa" stroke-width="1.6"/>
    <rect x="20" y="18" width="8" height="8" rx="2" fill="none" stroke="#a1a1aa" stroke-width="1.6"/>
    <rect x="30" y="18" width="8" height="8" rx="2" fill="none" stroke="#a1a1aa" stroke-width="1.6"/>
    <text x="29" y="40" text-anchor="middle" class="f" font-size="10" font-weight="500" fill="#a1a1aa">Corso</text>
  </g>

  <!-- Active Rail Button: Studio -->
  <g transform="translate(21, 146)">
    <rect width="58" height="50" rx="16" fill="#ffffff" filter="url(#sh-s)"/>
    <path d="M22 12 h14 a2 2 0 0 1 2 2 v10 a2 2 0 0 1-2 2 h-14 a2 2 0 0 1-2-2 v-10 a2 2 0 0 1 2-2z" fill="none" stroke="#111114" stroke-width="1.7"/>
    <line x1="29" y1="12" x2="29" y2="26" stroke="#111114" stroke-width="1.7"/>
    <text x="29" y="41" text-anchor="middle" class="f" font-size="10" font-weight="600" fill="#111114">Studio</text>
  </g>

  <!-- Rail Button: Quiz -->
  <g transform="translate(21, 204)">
    <circle cx="29" cy="18" r="8" fill="none" stroke="#a1a1aa" stroke-width="1.6"/>
    <path d="M26 18 l2 2 l4 -4" fill="none" stroke="#a1a1aa" stroke-width="1.6" stroke-linecap="round"/>
    <text x="29" y="40" text-anchor="middle" class="f" font-size="10" font-weight="500" fill="#a1a1aa">Quiz</text>
  </g>

  <text x="50" y="426" text-anchor="middle" class="f" font-size="13" font-weight="700" fill="#ffffff">2 / 6</text>
  <text x="50" y="440" text-anchor="middle" class="f" font-size="9.5" font-weight="500" fill="#a1a1aa">blocchi</text>

  <rect x="32" y="454" width="36" height="54" rx="18" fill="#ffffff" fill-opacity="0.08"/>
  <circle cx="50" cy="472" r="14" fill="#ffffff"/>
  <circle cx="50" cy="472" r="4" fill="none" stroke="#141416" stroke-width="1.6"/>

  <!-- ================= 2. LEFT PANE: SPIEGAZIONE AI + POP-UP SELEZIONE ================= -->
  <rect x="96" y="16" width="424" height="508" rx="28" fill="#f6f6f7" filter="url(#sh)"/>

  <!-- Top Header Pills -->
  <rect x="116" y="34" width="156" height="28" rx="14" fill="#ffffff" filter="url(#sh-s)"/>
  <circle cx="132" cy="48" r="4" fill="#3b6fd9"/>
  <text x="144" y="52" class="f" font-size="12" font-weight="600" fill="#141416">Spiegazione AI</text>

  <rect x="280" y="34" width="122" height="28" rx="14" fill="#eef6f0"/>
  <text x="341" y="52" text-anchor="middle" class="f" font-size="11" font-weight="600" fill="#25603c">&#10003; Prerequisiti ok</text>

  <rect x="410" y="34" width="90" height="28" rx="14" fill="#ececee"/>
  <text x="455" y="52" text-anchor="middle" class="f" font-size="11" font-weight="500" fill="#4b4b52">Slide p. 12</text>

  <!-- White Explanation Sheet -->
  <rect x="116" y="74" width="384" height="430" rx="20" fill="#ffffff" filter="url(#sh-s)"/>

  <text x="140" y="110" class="f" font-size="17" font-weight="700" fill="#141416">Orologi Logici di Lamport</text>
  <rect x="140" y="122" width="320" height="7" rx="3.5" fill="#e2e2e6"/>
  <rect x="140" y="135" width="270" height="7" rx="3.5" fill="#e2e2e6"/>

  <!-- Visual Schema -->
  <rect x="140" y="154" width="336" height="68" rx="12" fill="#f6f6f7" stroke="#e2e2e6"/>
  <circle cx="190" cy="188" r="16" fill="#ffffff" filter="url(#sh-s)"/>
  <text x="190" y="192" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#141416">A</text>
  <path d="M214 188 h82 m-5 -4 l5 4 l-5 4" fill="none" stroke="#3b6fd9" stroke-width="2" stroke-linecap="round"/>
  <circle cx="320" cy="188" r="16" fill="#3b6fd9"/>
  <text x="320" y="192" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#ffffff">B</text>
  <text x="410" y="192" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#3b6fd9">C(A) &lt; C(B)</text>

  <!-- Highlighted/Selected Text by Student (.hl in Revision2000) -->
  <rect x="136" y="238" width="344" height="42" rx="8" fill="#3b6fd9" fill-opacity="0.15"/>
  <line x1="140" y1="278" x2="476" y2="278" stroke="#3b6fd9" stroke-width="2"/>
  <text x="144" y="256" class="f" font-size="12" font-weight="600" fill="#141416">Se A &#8594; B allora C(A) &lt; C(B), ma non vale</text>
  <text x="144" y="272" class="f" font-size="12" font-weight="600" fill="#141416">necessariamente l'implicazione inversa.</text>

  <!-- Revision2000 Floating Pop-up on Left Selection (#pop) -->
  <g filter="url(#sh-pop)">
    <path d="M224 292 l8 -9 l8 9 z" fill="#ffffff"/>
    <rect x="132" y="291" width="352" height="148" rx="20" fill="#ffffff" stroke="#e2e2e6"/>
  </g>

  <text x="150" y="313" class="f" font-size="10.5" font-weight="700" letter-spacing="0.4" fill="#8a8a92">TESTO SELEZIONATO &#183; COSA VUOI FARE?</text>

  <!-- Chip 1: Approfondisci (Active) -->
  <rect x="150" y="322" width="118" height="30" rx="15" fill="#141416"/>
  <circle cx="164" cy="337" r="3.5" fill="#3b6fd9"/>
  <text x="174" y="341" class="f" font-size="11.5" font-weight="600" fill="#ffffff">Approfondisci</text>

  <!-- Chip 2: Poco chiaro (Feedback sulla spiegazione) -->
  <rect x="274" y="322" width="118" height="30" rx="15" fill="#fceceb"/>
  <circle cx="288" cy="337" r="3.5" fill="#d9534f"/>
  <text x="298" y="341" class="f" font-size="11.5" font-weight="600" fill="#d9534f">Poco chiaro</text>

  <!-- Chip 3: Esempio -->
  <rect x="398" y="322" width="72" height="30" rx="15" fill="#ececee"/>
  <text x="434" y="341" text-anchor="middle" class="f" font-size="11.5" font-weight="500" fill="#4b4b52">Esempio</text>

  <!-- Question / Feedback Input inside Pop-up -->
  <rect x="150" y="362" width="316" height="36" rx="10" fill="#f6f6f7"/>
  <text x="162" y="384" class="f" font-size="11.5" font-weight="500" fill="#4b4b52">"Non mi è chiaro perché non vale il viceversa..."</text>

  <text x="150" y="422" class="f" font-size="11" font-weight="500" fill="#8a8a92">L'AI risponde o riformula il punto</text>
  <rect x="392" y="406" width="74" height="24" rx="12" fill="#141416"/>
  <text x="429" y="422" text-anchor="middle" class="f" font-size="11" font-weight="600" fill="#ffffff">Chiedi &#8629;</text>

  <!-- Remaining skeleton lines -->
  <rect x="140" y="458" width="320" height="7" rx="3.5" fill="#e2e2e6"/>
  <rect x="140" y="472" width="210" height="7" rx="3.5" fill="#e2e2e6"/>

  <!-- ================= 3. RIGHT PANE: BLANK PAGE STILE OBSIDIAN ================= -->
  <rect x="532" y="16" width="412" height="508" rx="28" fill="#ffffff" filter="url(#sh)"/>

  <!-- Minimal Obsidian-style Top Bar -->
  <text x="562" y="47" class="mono" font-size="11.5" font-weight="500" fill="#8a8a92">Sistemi Distribuiti / 02-Orologi-Logici.md</text>
  <rect x="826" y="31" width="96" height="24" rx="12" fill="#f6f6f7"/>
  <circle cx="840" cy="43" r="3.5" fill="#2e9e6a"/>
  <text x="850" y="47" class="f" font-size="10.5" font-weight="600" fill="#4b4b52">Note libere</text>
  <line x1="552" y1="64" x2="924" y2="64" stroke="#ececee" stroke-width="1.2"/>

  <!-- Clean Obsidian Blank Page Content (Student's Own Structure) -->
  <!-- H1 -->
  <text x="562" y="104" class="f" font-size="22" font-weight="700" letter-spacing="-0.4" fill="#141416">Orologi Logici</text>

  <!-- H2 -->
  <text x="562" y="140" class="mono" font-size="12" font-weight="600" fill="#8a8a92">##</text>
  <text x="584" y="140" class="f" font-size="15" font-weight="700" fill="#141416">Idea di base</text>

  <text x="566" y="166" class="f" font-size="13" font-weight="400" fill="#4b4b52">&#8226; Nei sistemi distribuiti non c'è un clock unico.</text>
  <text x="566" y="190" class="f" font-size="13" font-weight="400" fill="#4b4b52">&#8226; Ogni processo mantiene un contatore locale C(i).</text>
  <text x="566" y="214" class="f" font-size="13" font-weight="400" fill="#4b4b52">&#8226; Quando invia un messaggio allega il valore di C.</text>

  <!-- H2 -->
  <text x="562" y="256" class="mono" font-size="12" font-weight="600" fill="#8a8a92">##</text>
  <text x="584" y="256" class="f" font-size="15" font-weight="700" fill="#141416">Relazione Happened-Before (&#8594;)</text>

  <text x="566" y="282" class="f" font-size="13" font-weight="400" fill="#4b4b52">&#8226; Se A avviene prima di B nello stesso processo: A &#8594; B.</text>
  <text x="566" y="306" class="f" font-size="13" font-weight="400" fill="#4b4b52">&#8226; Se A è l'invio di un messaggio e B la ricezione: A &#8594; B.</text>

  <!-- Student actively writing a line with a subtle misconception -->
  <text x="566" y="336" class="f" font-size="13" font-weight="500" fill="#141416">&#8226; Quindi se C(A) &lt; C(B) vuol dire che A ha causato B</text>
  <!-- Blinking Cursor -->
  <rect x="898" y="322" width="2" height="18" rx="1" fill="#3b6fd9"/>

  <!-- Subtle Empty Space showing it's a true blank canvas -->
  <text x="562" y="378" class="f" font-size="12.5" font-style="italic" fill="#a1a1aa">Continua a strutturare i tuoi appunti liberamente...</text>

  <!-- Bottom Floating Pill Bar on Blank Page -->
  <rect x="562" y="452" width="352" height="48" rx="24" fill="#141416" filter="url(#sh-s)"/>
  <text x="720" y="481" text-anchor="middle" class="f" font-size="13.5" font-weight="600" fill="#ffffff">Blocco completato &#183; Verifica i miei appunti</text>
  <circle cx="888" cy="476" r="14" fill="#2e9e6a"/>
  <path d="M883 476 h10 m-3.5 -3.5 l3.5 3.5 l-3.5 3.5" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
