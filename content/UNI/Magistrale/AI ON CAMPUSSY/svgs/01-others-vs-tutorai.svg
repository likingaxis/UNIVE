<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t1 d1">
  <title id="t1">Il Paradosso dell'AI nello Studio: ChatGPT vs Learning Harness</title>
  <desc id="d1">Confronto visivo in stile Revision2000: con ChatGPT ottieni +48% negli esercizi ma -17% da solo all'esame; con il Learning Harness interagisci coi pop-up a sinistra, scrivi su una pagina pulita tipo Obsidian a destra, ricevi domande puntuali, merge e quiz mirati.</desc>

  <defs>
    <style>
      .f { font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .mono { font-family: "JetBrains Mono", Consolas, monospace; }
    </style>
    <filter id="sh" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#141419" flood-opacity="0.08"/>
    </filter>
    <filter id="sh-s" x="-6%" y="-6%" width="112%" height="118%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#141419" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Revision2000 Outer Canvas (bg: #e6e6e9) -->
  <rect width="960" height="520" rx="28" fill="#e6e6e9"/>

  <!-- Top Header -->
  <text x="480" y="42" text-anchor="middle" class="f" font-size="22" font-weight="700" letter-spacing="-0.5" fill="#141416">Il paradosso dell'AI: rispondere &#8800; imparare</text>
  <text x="480" y="64" text-anchor="middle" class="f" font-size="13.5" font-weight="500" fill="#8a8a92">Chi sta facendo davvero il lavoro: l'intelligenza artificiale o lo studente?</text>

  <!-- ================= LEFT PANEL: CHATGPT (IL PARADOSSO) ================= -->
  <rect x="28" y="84" width="438" height="364" rx="28" fill="#f6f6f7" filter="url(#sh)"/>

  <!-- Top Pill Tag -->
  <rect x="52" y="106" width="224" height="32" rx="16" fill="#ffffff" filter="url(#sh-s)"/>
  <circle cx="70" cy="122" r="5" fill="#d9534f"/>
  <circle cx="70" cy="122" r="8" fill="#d9534f" fill-opacity="0.18"/>
  <text x="86" y="127" class="f" font-size="13" font-weight="600" fill="#141416">ChatGPT / AI tradizionale</text>
  <text x="438" y="126" text-anchor="end" class="f" font-size="11.5" font-weight="600" fill="#8a8a92">Studio 2025</text>

  <!-- Big Stat Cards -->
  <rect x="52" y="152" width="188" height="96" rx="20" fill="#ffffff" filter="url(#sh-s)"/>
  <text x="68" y="200" class="f" font-size="38" font-weight="700" letter-spacing="-1.5" fill="#141416">+48%</text>
  <rect x="68" y="212" width="136" height="22" rx="11" fill="#ececee"/>
  <text x="136" y="227" text-anchor="middle" class="f" font-size="11" font-weight="600" fill="#4b4b52">durante gli esercizi</text>

  <rect x="254" y="152" width="188" height="96" rx="20" fill="#ffffff" stroke="#d9534f" stroke-width="1.5" filter="url(#sh-s)"/>
  <text x="270" y="200" class="f" font-size="38" font-weight="700" letter-spacing="-1.5" fill="#d9534f">-17%</text>
  <rect x="270" y="212" width="146" height="22" rx="11" fill="#fceceb"/>
  <text x="343" y="227" text-anchor="middle" class="f" font-size="11" font-weight="700" fill="#d9534f">da soli all'esame</text>

  <!-- Visual Flow: Why it happens -->
  <rect x="52" y="262" width="390" height="114" rx="20" fill="#ececee"/>

  <rect x="68" y="280" width="90" height="78" rx="14" fill="#ffffff" filter="url(#sh-s)"/>
  <rect x="82" y="294" width="34" height="16" rx="5" fill="#fceceb"/>
  <text x="99" y="306" text-anchor="middle" class="mono" font-size="9.5" font-weight="700" fill="#d9534f">PDF</text>
  <rect x="82" y="318" width="58" height="5" rx="2.5" fill="#e2e2e6"/>
  <rect x="82" y="328" width="44" height="5" rx="2.5" fill="#e2e2e6"/>
  <text x="113" y="349" text-anchor="middle" class="f" font-size="10.5" font-weight="600" fill="#4b4b52">Carichi slide</text>

  <path d="M166 319 h18 m-4 -4 l4 4 l-4 4" fill="none" stroke="#8a8a92" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="192" y="280" width="114" height="78" rx="14" fill="#141416"/>
  <text x="249" y="304" text-anchor="middle" class="f" font-size="11" font-weight="700" fill="#ffffff">L'AI fa il lavoro</text>
  <rect x="210" y="313" width="78" height="5" rx="2.5" fill="#76767f"/>
  <rect x="210" y="323" width="62" height="5" rx="2.5" fill="#76767f"/>
  <text x="249" y="348" text-anchor="middle" class="f" font-size="10" font-weight="500" fill="#a1a1aa">Appunti pronti</text>

  <path d="M314 319 h18 m-4 -4 l4 4 l-4 4" fill="none" stroke="#8a8a92" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="340" y="280" width="86" height="78" rx="14" fill="#ffffff" opacity="0.65"/>
  <text x="383" y="314" text-anchor="middle" class="f" font-size="11.5" font-weight="700" fill="#8a8a92">Studente</text>
  <text x="383" y="332" text-anchor="middle" class="f" font-size="11" font-weight="600" fill="#d9534f">passivo</text>

  <!-- Left Bottom Conclusion -->
  <rect x="52" y="390" width="390" height="40" rx="14" fill="#fceceb"/>
  <text x="247" y="415" text-anchor="middle" class="f" font-size="13" font-weight="600" fill="#d9534f">Aiuta a rispondere, ma non a imparare</text>

  <!-- ================= RIGHT PANEL: LEARNING HARNESS (LA SOLUZIONE) ================= -->
  <rect x="494" y="84" width="438" height="364" rx="28" fill="#f6f6f7" filter="url(#sh)"/>

  <!-- Top Pill Tag -->
  <rect x="518" y="106" width="236" height="32" rx="16" fill="#141416" filter="url(#sh-s)"/>
  <path d="M538 114 c.3 3.4 3 6.2 6.5 6.5 -3.5.3 -6.2 3.1 -6.5 6.5 -.3-3.4 -3-6.2 -6.5-6.5 3.5-.3 6.2-3.1 6.5-6.5z" fill="#ffffff"/>
  <text x="554" y="127" class="f" font-size="13" font-weight="600" fill="#ffffff">Il nostro Learning Harness</text>

  <!-- Visual Flow: Mini Revision2000 + Obsidian Dual-Pane -->
  <rect x="518" y="152" width="390" height="224" rx="20" fill="#ececee"/>

  <!-- Mini Dark Rail -->
  <rect x="530" y="166" width="28" height="196" rx="14" fill="#161618"/>
  <path d="M544 180 c.2 2.2 1.8 4 4 4 -2.2.2 -4 1.8 -4 4 -.2-2.2 -1.8-4 -4-4 2.2-.2 4-1.8 4-4z" fill="#ffffff"/>
  <rect x="536" y="200" width="16" height="16" rx="5" fill="#ffffff"/>
  <circle cx="544" cy="232" r="3.5" fill="#76767f"/>
  <circle cx="544" cy="248" r="3.5" fill="#76767f"/>

  <!-- Mini Left Pane: Spiegazione AI + Pop-up selezione -->
  <rect x="566" y="166" width="156" height="196" rx="16" fill="#ffffff" filter="url(#sh-s)"/>
  <text x="578" y="186" class="f" font-size="10.5" font-weight="700" fill="#3b6fd9">1. Spiegazione AI</text>
  <rect x="578" y="196" width="132" height="6" rx="3" fill="#e2e2e6"/>
  <rect x="578" y="207" width="108" height="6" rx="3" fill="#e2e2e6"/>
  <!-- Highlighted line by student -->
  <rect x="576" y="219" width="124" height="14" rx="4" fill="#3b6fd9" fill-opacity="0.18"/>
  <line x1="578" y1="232" x2="698" y2="232" stroke="#3b6fd9" stroke-width="1.5"/>
  <!-- Student Pop-up on left -->
  <path d="M614 238 l5 -5 l5 5 z" fill="#141416"/>
  <rect x="578" y="237" width="132" height="44" rx="10" fill="#141416"/>
  <text x="588" y="253" class="f" font-size="9.5" font-weight="600" fill="#ffffff">&#10022; Approfondisci</text>
  <text x="588" y="269" class="f" font-size="9.5" font-weight="500" fill="#fca5a5">&#9888; Poco chiaro &#183; Rispiega</text>

  <text x="578" y="330" class="f" font-size="11" font-weight="700" fill="#141416">Selezioni a sinistra</text>
  <text x="578" y="345" class="f" font-size="10" font-weight="500" fill="#8a8a92">Domande o "poco chiaro"</text>

  <!-- Center Arrow -->
  <circle cx="732" cy="264" r="12" fill="#141416" filter="url(#sh-s)"/>
  <path d="M728 264 h8 m-3 -3 l3 3 l-3 3" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Mini Right Pane: Blank Page Obsidian + AI Pop-up sul punto -->
  <rect x="742" y="166" width="156" height="196" rx="16" fill="#ffffff" filter="url(#sh-s)"/>
  <text x="754" y="186" class="f" font-size="10.5" font-weight="700" fill="#25603c">2. Tue Note (Obsidian)</text>
  <text x="754" y="203" class="mono" font-size="9.5" font-weight="700" fill="#141416"># Titolo</text>
  <rect x="754" y="210" width="114" height="5" rx="2.5" fill="#4b4b52"/>
  <!-- AI highlighted student line -->
  <rect x="752" y="220" width="126" height="14" rx="4" fill="#cf9a12" fill-opacity="0.22"/>
  <line x1="754" y1="233" x2="876" y2="233" stroke="#cf9a12" stroke-width="1.5" stroke-dasharray="3 2"/>
  <!-- AI Pop-up on student's note -->
  <path d="M792 238 l5 -5 l5 5 z" fill="#eef6f0"/>
  <rect x="754" y="237" width="132" height="56" rx="10" fill="#eef6f0" stroke="#2e9e6a"/>
  <text x="764" y="253" class="f" font-size="9.5" font-weight="700" fill="#25603c">&#10022; Pop-up AI sul punto</text>
  <text x="764" y="267" class="f" font-size="9" font-weight="500" fill="#141416">Domanda mirata &#8594; Merge</text>
  <text x="764" y="281" class="f" font-size="9" font-weight="600" fill="#3b6fd9">+ Quiz in Fase 2</text>

  <text x="754" y="330" class="f" font-size="11" font-weight="700" fill="#141416">Scrivi tu a destra</text>
  <text x="754" y="345" class="f" font-size="10" font-weight="500" fill="#2e9e6a">Pop-up AI + Merge + Quiz</text>

  <!-- Right Bottom Conclusion -->
  <rect x="518" y="390" width="390" height="40" rx="14" fill="#eef6f0"/>
  <text x="713" y="415" text-anchor="middle" class="f" font-size="13" font-weight="700" fill="#25603c">Guida il tuo ragionamento dalla lezione all'esame</text>

  <!-- Bottom Toast Pill -->
  <rect x="200" y="466" width="560" height="38" rx="19" fill="#141416" filter="url(#sh)"/>
  <text x="480" y="490" text-anchor="middle" class="f" font-size="13" font-weight="600" fill="#ffffff">Non vogliamo un'AI che studi al posto tuo &#183; Vogliamo un'AI che ti insegni a studiare</text>
</svg>
