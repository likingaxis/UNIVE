<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="t3 d3">
  <title id="t3">Fine Blocco e Fase 2: Pop-up AI sulle Note, Merge e Quiz Mirati</title>
  <desc id="d3">1. L'AI fa apparire un pop-up direttamente sul punto preciso della nota scritta dallo studente con una domanda mirata. 2. Rispondendo si arriva al Merge nella struttura dello studente. 3. In una seconda fase vengono generati Quiz mirati sulle lacune emerse.</desc>

  <defs>
    <style>
      .f { font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .mono { font-family: "JetBrains Mono", Consolas, monospace; }
    </style>
    <filter id="sh" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#141419" flood-opacity="0.08"/>
    </filter>
    <filter id="sh-pop" x="-12%" y="-12%" width="124%" height="132%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#141419" flood-opacity="0.18"/>
    </filter>
    <filter id="sh-s" x="-6%" y="-6%" width="112%" height="118%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#141419" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Revision2000 Outer Canvas (bg: #e6e6e9) -->
  <rect width="960" height="540" rx="28" fill="#e6e6e9"/>

  <!-- Top Header -->
  <text x="480" y="40" text-anchor="middle" class="f" font-size="22" font-weight="700" letter-spacing="-0.5" fill="#141416">Finito un blocco: Pop-up sulle tue note, Merge e Quiz</text>
  <text x="480" y="62" text-anchor="middle" class="f" font-size="13.5" font-weight="500" fill="#8a8a92">L'AI interviene direttamente nei punti precisi della tua struttura e prepara i quiz della seconda fase</text>

  <!-- ================= STEP 1: POP-UP AI SUL PUNTO DELLA NOTA ================= -->
  <rect x="24" y="80" width="292" height="390" rx="28" fill="#f6f6f7" filter="url(#sh)"/>

  <circle cx="56" cy="112" r="15" fill="#141416"/>
  <text x="56" y="117" text-anchor="middle" class="f" font-size="12.5" font-weight="700" fill="#ffffff">1</text>
  <text x="80" y="111" class="f" font-size="14.5" font-weight="700" fill="#141416">Pop-up sul tuo punto</text>
  <text x="80" y="128" class="f" font-size="11.5" font-weight="500" fill="#8a8a92">Domanda ancorata alla tua nota</text>

  <!-- Mini Obsidian Note Page -->
  <rect x="40" y="144" width="260" height="308" rx="20" fill="#ffffff" filter="url(#sh-s)"/>
  <text x="56" y="168" class="mono" font-size="10" font-weight="500" fill="#8a8a92">02-Orologi-Logici.md</text>
  <line x1="56" y1="176" x2="284" y2="176" stroke="#ececee"/>

  <text x="56" y="198" class="f" font-size="13.5" font-weight="700" fill="#141416">## Relazione A &#8594; B</text>
  <rect x="56" y="210" width="190" height="6" rx="3" fill="#e2e2e6"/>
  <rect x="56" y="222" width="160" height="6" rx="3" fill="#e2e2e6"/>

  <!-- Highlighted Line on Student's Note (.hl.k-comment in Revision2000) -->
  <rect x="52" y="236" width="236" height="36" rx="6" fill="#cf9a12" fill-opacity="0.20"/>
  <line x1="56" y1="271" x2="284" y2="271" stroke="#cf9a12" stroke-width="2" stroke-dasharray="4 2"/>
  <text x="60" y="252" class="f" font-size="11.5" font-weight="600" fill="#141416">&#8226; Quindi se C(A) &lt; C(B) vuol dire</text>
  <text x="60" y="266" class="f" font-size="11.5" font-weight="600" fill="#141416">  che A ha causato B</text>

  <!-- Floating AI Pop-up anchored directly to that line! -->
  <g filter="url(#sh-pop)">
    <path d="M126 283 l7 -8 l7 8 z" fill="#141416"/>
    <rect x="52" y="282" width="236" height="154" rx="16" fill="#141416"/>
  </g>
  <circle cx="68" cy="302" r="4" fill="#cf9a12"/>
  <text x="78" y="306" class="f" font-size="10.5" font-weight="700" fill="#f0c24d">DOMANDA SU QUESTO PUNTO</text>

  <text x="66" y="328" class="f" font-size="11.5" font-weight="500" fill="#ffffff">E se A e B avvengono su due</text>
  <text x="66" y="344" class="f" font-size="11.5" font-weight="500" fill="#ffffff">processi che non comunicano?</text>
  <text x="66" y="360" class="f" font-size="11.5" font-weight="500" fill="#a1a1aa">C(A) &lt; C(B) basta comunque?</text>

  <!-- Student Reply Box inside Pop-up -->
  <rect x="64" y="372" width="212" height="50" rx="10" fill="#26262b"/>
  <text x="74" y="390" class="f" font-size="11" font-weight="500" fill="#ececef">"Ah no, in quel caso sono</text>
  <text x="74" y="406" class="f" font-size="11" font-weight="500" fill="#ececef">concorrenti!"</text>
  <rect x="224" y="394" width="44" height="22" rx="11" fill="#2e9e6a"/>
  <text x="246" y="409" text-anchor="middle" class="f" font-size="10" font-weight="700" fill="#ffffff">Invia</text>

  <!-- Arrow 1 -> 2 -->
  <circle cx="325" cy="275" r="13" fill="#141416" filter="url(#sh-s)"/>
  <path d="M321 275 h8 m-3 -3.5 l3.5 3.5 l-3.5 3.5" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ================= STEP 2: MERGE NELLA TUA STRUTTURA ================= -->
  <rect x="334" y="80" width="292" height="390" rx="28" fill="#f6f6f7" filter="url(#sh)"/>

  <circle cx="366" cy="112" r="15" fill="#141416"/>
  <text x="366" y="117" text-anchor="middle" class="f" font-size="12.5" font-weight="700" fill="#ffffff">2</text>
  <text x="390" y="111" class="f" font-size="14.5" font-weight="700" fill="#141416">Merge nella tua nota</text>
  <text x="390" y="128" class="f" font-size="11.5" font-weight="500" fill="#8a8a92">Integra senza perdere il tuo stile</text>

  <!-- Mini Obsidian Note Page with Inline Diff -->
  <rect x="350" y="144" width="260" height="308" rx="20" fill="#ffffff" filter="url(#sh-s)"/>
  <text x="366" y="168" class="mono" font-size="10" font-weight="500" fill="#8a8a92">02-Orologi-Logici.md</text>
  <line x1="366" y1="176" x2="594" y2="176" stroke="#ececee"/>

  <text x="366" y="198" class="f" font-size="13.5" font-weight="700" fill="#141416">## Relazione A &#8594; B</text>
  <rect x="366" y="210" width="190" height="6" rx="3" fill="#e2e2e6"/>
  <rect x="366" y="222" width="160" height="6" rx="3" fill="#e2e2e6"/>

  <!-- Strikethrough old line -->
  <rect x="366" y="238" width="228" height="26" rx="6" fill="#fceceb"/>
  <text x="374" y="255" class="f" font-size="11.5" font-weight="500" fill="#d9534f" text-decoration="line-through">&#8226; Se C(A) &lt; C(B) allora A ha causato B</text>

  <!-- Merged Green Addition in place -->
  <rect x="366" y="270" width="228" height="72" rx="10" fill="#eef6f0" stroke="#2e9e6a"/>
  <text x="376" y="290" class="f" font-size="11.5" font-weight="700" fill="#25603c">&#10003; Nota aggiornata dal Merge:</text>
  <text x="376" y="308" class="f" font-size="11.5" font-weight="500" fill="#141416">&#8226; A &#8594; B implica C(A) &lt; C(B), ma se</text>
  <text x="376" y="324" class="f" font-size="11.5" font-weight="500" fill="#141416">  sono concorrenti non vale il viceversa.</text>

  <!-- Rest of student's note untouched -->
  <text x="366" y="366" class="f" font-size="13" font-weight="700" fill="#141416">## Esempio</text>
  <rect x="366" y="378" width="180" height="6" rx="3" fill="#e2e2e6"/>

  <rect x="366" y="398" width="228" height="38" rx="19" fill="#141416"/>
  <text x="480" y="422" text-anchor="middle" class="f" font-size="12" font-weight="600" fill="#ffffff">&#10003; Accetta Merge nella pagina</text>

  <!-- Arrow 2 -> 3 -->
  <circle cx="635" cy="275" r="13" fill="#141416" filter="url(#sh-s)"/>
  <path d="M631 275 h8 m-3 -3.5 l3.5 3.5 l-3.5 3.5" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ================= STEP 3: SECONDA FASE (QUIZ & RIPASSI MIRATI) ================= -->
  <rect x="644" y="80" width="292" height="390" rx="28" fill="#f6f6f7" filter="url(#sh)"/>

  <circle cx="676" cy="112" r="15" fill="#3b6fd9"/>
  <text x="676" y="117" text-anchor="middle" class="f" font-size="12.5" font-weight="700" fill="#ffffff">3</text>
  <text x="700" y="111" class="f" font-size="14.5" font-weight="700" fill="#141416">Fase 2: Quiz &amp; Ripassi</text>
  <text x="700" y="128" class="f" font-size="11.5" font-weight="500" fill="#8a8a92">Costruiti sui dubbi emersi nelle note</text>

  <!-- Quiz Card -->
  <rect x="660" y="144" width="260" height="222" rx="20" fill="#ffffff" filter="url(#sh-s)"/>

  <rect x="676" y="160" width="148" height="22" rx="11" fill="#fdf6e2"/>
  <circle cx="688" cy="171" r="3.5" fill="#cf9a12"/>
  <text x="698" y="175" class="f" font-size="10" font-weight="700" fill="#9a6b00">Da lacuna: Concorrenza</text>

  <text x="676" y="204" class="f" font-size="12.5" font-weight="700" fill="#141416">Quiz di verifica (senza aiuto AI)</text>
  <text x="676" y="224" class="f" font-size="11.5" font-weight="500" fill="#4b4b52">P1 ha C(A)=3, P2 ha C(B)=5.</text>
  <text x="676" y="240" class="f" font-size="11.5" font-weight="500" fill="#4b4b52">Nessun messaggio tra P1 e P2.</text>
  <text x="676" y="256" class="f" font-size="11.5" font-weight="600" fill="#141416">Chi è avvenuto prima?</text>

  <!-- Quiz Option Pills -->
  <rect x="676" y="270" width="228" height="32" rx="10" fill="#f6f6f7"/>
  <text x="690" y="290" class="f" font-size="11.5" font-weight="500" fill="#4b4b52">A. L'evento A perché 3 &lt; 5</text>

  <rect x="676" y="308" width="228" height="34" rx="10" fill="#eef6f0" stroke="#2e9e6a" stroke-width="1.5"/>
  <text x="690" y="329" class="f" font-size="11.5" font-weight="700" fill="#25603c">&#10003; B. Sono concorrenti (A &#8741; B)</text>

  <!-- Spaced Review Mini Queue below Quiz -->
  <rect x="660" y="378" width="260" height="74" rx="18" fill="#ffffff" filter="url(#sh-s)"/>
  <text x="676" y="400" class="f" font-size="11.5" font-weight="700" fill="#141416">Pianificazione fino all'esame</text>
  <rect x="676" y="412" width="106" height="24" rx="12" fill="#eef6f0"/>
  <text x="729" y="428" text-anchor="middle" class="f" font-size="10.5" font-weight="600" fill="#25603c">&#10003; Ripasso tra 3g</text>
  <rect x="790" y="412" width="114" height="24" rx="12" fill="#eef4ff"/>
  <text x="847" y="428" text-anchor="middle" class="f" font-size="10.5" font-weight="600" fill="#3b6fd9">Simulazione esame</text>

  <!-- Bottom Toast Pill -->
  <rect x="170" y="484" width="620" height="38" rx="19" fill="#141416" filter="url(#sh)"/>
  <text x="480" y="508" text-anchor="middle" class="f" font-size="13" font-weight="600" fill="#ffffff">Pop-up mirati dove scrivi &#8594; Merge nei tuoi appunti &#8594; Quiz sulle tue vere lacune</text>
</svg>
